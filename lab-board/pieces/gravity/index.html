  ctl.shadows = LabUI.check(g3, { label: 'Shadows', value: P.shadows, onChange: v => set('shadows', v, applyLight) });
  const acts = document.createElement('div'); acts.className = 'acts'; acts.innerHTML = '<button type="button" data-a="clear">Clear</button><button type="button" data-a="reset">Reset all</button><button type="button" data-a="copy">Copy settings</button>'; panel.appendChild(acts);
  acts.querySelector('[data-a=clear]').onclick = () => { while (drops.length) removeDrop(drops[0]); };
  acts.querySelector('[data-a=reset]').onclick = () => { P = { ...DEF }; save(); for (const k in ctl) ctl[k].set(P[k]); world.gravity = { x: 0, y: -P.gravity, z: 0 }; applyLight(); buildCore(); };
  acts.querySelector('[data-a=copy]').onclick = e => { const d = {}; for (const k in P) if (P[k] !== DEF[k]) d[k] = P[k]; navigator.clipboard?.writeText(JSON.stringify(d, null, 2)); e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy settings', 1200); }; }
function openPanel(on) { document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('tuning')) openPanel(false); });

// ---------- start; the board's box: ?thumb=1 a still (a few things already on it and around it), ?demo=1 the same, then falling ----------
buildPanel(); setMode(mode); LabUI.segThumb($('mode')); applyLight(); buildCore(); resize(); view.az = view.taz; view.el = view.tel; view.dist = view.tdist; placeCam();   // (the camera in place before the first steps: they let go of what comes near the lens)
if (BARE) { seed = 3; const R = spread();   // (a set scene: the same few things in the same places, so the live box starts on the still)
  for (let i = 0; i < 26; i++) spawn((rnd() - .5) * 2.4 * R, (rnd() - .5) * 1.2 * R, -2.5 + rnd() * 8.5);
  if (q.has('sheet')) { dropCloth(); for (let i = 0; i < 160; i++) physics(1 / 60); }
  for (let i = 0; i < 40; i++) physics(1 / 60); }
document.body.classList.add('ready');
requestAnimationFrame(frame);
window.GRAVITY = { get P() { return P; }, spawn, drops, world, buildCore, get jelly() { return jelly; }, hold };
</script>
