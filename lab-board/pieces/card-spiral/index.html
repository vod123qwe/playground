<style>
  /* Cards on a spiral. Two-sided cards hang round an upright axis, one turn of the spiral above the other, and the whole of it turns
     slowly: the near ones show their faces, the far ones their backs, and each card drifts a little on its own. The back is a printed
     pattern (the badge's tiles and stripes); the face is a simpler cut of the same pattern, a small label, a heading and a few tags.
     A scroll or a drag turns the spiral, and a little of the turn climbs it, like a screw; it runs down and settles back to its slow
     turn. A click draws a card out to the front (a second click turns it over); a click beside it or Esc puts it back. Light or dark
     on top; Customize tunes the spiral, the cards and the words. One canvas (three.js). */
  :root { --bg: #0b0b0c; --ink: #f2f1ee; --muted: rgba(255,255,255,.55); --ease: cubic-bezier(.22,.61,.36,1); --page: #17181b; --boxbg: #111113; --morph: .55s cubic-bezier(.3,1.12,.4,1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--lab-font); transition: background .4s; -webkit-font-smoothing: antialiased; }
  body.light { --bg: #efede8; --ink: #161616; --muted: rgba(20,20,20,.5); --page: #fff; --boxbg: #efede8; }
  .stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  .stage.dragging { cursor: grabbing; } .stage.over { cursor: pointer; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  /* the words: a small label, then the heading; in the middle unless moved (Customize, or drag them while it is open) */
  .say { position: fixed; left: calc(50% + var(--tx, 0) * 100vw); top: calc(var(--ty, .5) * 100vh); z-index: 2; width: min(1100px, 92vw); transform: translate(-50%, -50%) translateY(var(--ey, 0px)); text-align: center; pointer-events: none; transition: opacity .5s var(--ease); }
  body.tuning .say { pointer-events: auto; cursor: move; } body.tuning .say:hover { outline: 1px dashed var(--muted); outline-offset: 10px; border-radius: 12px; }
  .say .lbl { display: inline-flex; align-items: center; gap: 8px; height: 30px; margin-bottom: 18px; padding: 0 14px 0 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font: 500 13px var(--lab-font); letter-spacing: -.005em; color: var(--ink); }
  .say .lbl::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #f47c6a; box-shadow: 0 0 0 3px rgba(244,124,106,.22); }
  body.light .say .lbl { border-color: rgba(20,20,20,.1); background: rgba(255,255,255,.6); }
  body.nolabel .say .lbl { display: none; }
  .say h1 { margin: 0; font: 600 calc(clamp(32px, 5.6vw, 84px) * var(--ts, 1))/.98 var(--lab-font); letter-spacing: -.045em; text-wrap: balance; }
  body:not(.light) .say h1 { text-shadow: 0 2px 28px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.25); }   /* (over a light card it still reads) */
  body.light .say h1 { text-shadow: 0 2px 28px rgba(239,237,232,.75); }
  body.nowords .say { display: none; }
  body.inside .say > * { opacity: 0; }   /* (inside the spiral the words are painted in the scene; this box stays to drag them by) */
  .cue { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 3; transform: translateX(-50%); color: var(--muted); font-size: 13px; white-space: nowrap; transition: opacity .4s; pointer-events: none; }
  body.moved .cue { opacity: 0; }
  /* the dark that comes up from below (a page's end, or a fade at the bottom) */
  .shade { position: fixed; inset: 0; z-index: 4; pointer-events: none; --c: 0; background: linear-gradient(to top, var(--bg) calc(var(--c) * 115% - 15%), transparent calc(var(--c) * 115% + 20%)); opacity: min(1, calc(var(--c) * 6)); }
  .end { position: fixed; left: 50%; bottom: 40vh; z-index: 5; transform: translateX(-50%); color: var(--muted); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .5s; }
  body.atend .end { opacity: 1; }
  /* the looks: the variants pill at the bottom */

  /* the corner controls (as on every piece) */

  .tune:hover { transform: translateY(-1px); } .tune svg { width: 19px; height: 19px; } body.tuning .tune { opacity: 0; pointer-events: none; }
  .mode { left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: #1c1c1f; font: 600 13px var(--lab-font); }
  .mode button { height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,.5); font: inherit; cursor: pointer; }

  body.bare .back, body.bare .tune, body.bare .mode, body.bare .panel, body.bare .cue, body.bare .say, body.bare .dock, body.bare .end { display: none; }
  /* with the controls on top, the words sit lower */

  .panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 340px; z-index: 7; display: flex; flex-direction: column; overflow: auto; overscroll-behavior: contain; padding: 0 20px; --ui-pad: 20px;
    font-family: var(--lab-font); border-radius: 26px; border: 1px solid var(--ui-card-line, rgba(20,20,20,.08)); opacity: 0; translate: 24px 0; visibility: hidden; transition: translate var(--morph), opacity .3s, visibility 0s .55s; }
  body.tuning .panel { opacity: 1; translate: 0 0; visibility: visible; transition: translate var(--morph), opacity .35s .08s; }
  .panel::-webkit-scrollbar { width: 0; }

  .ph2 h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; } .ph2 p { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--ui-muted); }

  .acts { position: sticky; bottom: 0; z-index: 3; display: flex; margin: auto -20px 0; padding: 14px 20px 20px; background: var(--ui-bg); }
  .txt { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--ui-line, rgba(20,20,20,.12)); border-radius: 12px; background: transparent; color: var(--ui-ink); font: 500 14px var(--lab-font); }
  @media (max-width: 760px) { .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 56vh; translate: 0 calc(100% + 16px); } body.tuning .panel { translate: 0 0; } }

<script type="module">

const CARDS = [
  ['Outside · 20 min', 'Walk a street you have never taken.', ['Outdoors', 'Solo']],
  ['Slow · 10 min', 'Sit somewhere with no phone and no music.', ['Calm', 'Anywhere']],
  ['People · 5 min', 'Ask someone nearby for a recommendation.', ['Talk', 'Today']],
  ['Hands · 30 min', 'Make something you can hold.', ['Craft', 'Home']],
  ['Notice · 15 min', 'Find five colours on your way home.', ['Look', 'Walk']],
  ['Kind · 5 min', 'Write a note to someone you miss.', ['Letter', 'Warm']],
  ['Taste · 40 min', 'Cook a dish you have never cooked.', ['Kitchen', 'New']],
  ['Body · 15 min', 'Stretch outside before breakfast.', ['Morning', 'Move']],
  ['Quiet · 1 h', 'Read in a park until the chapter ends.', ['Book', 'Park']],
  ['Curious · 20 min', 'Learn the name of a tree near you.', ['Nature', 'Learn']],
  ['Play · 30 min', 'Play a game with no screen at all.', ['Friends', 'Fun']],
  ['Listen · 40 min', 'Hear an album from start to finish.', ['Music', 'Still']] ];

// ---------- the patterns: the badge's tiles and stripes ----------
const SETS = {

function tileFigure(c, x, y, s, fig, A, B, C, line) {

  else if (fig === 'diamond') { c.beginPath(); c.moveTo(m, y + s * .04); c.lineTo(x + s * .96, n); c.lineTo(m, y + s * .96); c.lineTo(x + s * .04, n); c.closePath(); paint(B); c.beginPath(); c.rect(m - s * .17, n - s * .17, s * .34, s * .34); paint(C); }

  else if (fig === 'dots') { c.beginPath(); c.rect(m - s * .25, y, s * .5, s); paint(B); circ(m, y + s * .27, s * .17); paint(C); circ(m, y + s * .73, s * .17); paint(C); }

// (stripes in two colours, and lines across them where the stripes swap colour: arrows, zigzags, diamonds come out of plain stripes)
const frac = x => x - Math.floor(x), tri = x => 1 - Math.abs(2 * frac(x) - 1);

const MOTIFS = {

// one design per card: three colours from the set, and either a wall of one figure or a run of stripes; simple: the face's cut of it
const LINE = 'rgba(25,22,20,.5)';
function designs(set) {

    tileFigure(c, i * s, y0 + r * s, s, fig, alt ? B : A, alt ? A : B, C, LINE); } }

// ---------- the card faces, drawn once on canvases ----------

  else renderer.render(scene, camera); }

// ---------- the view ----------
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  { const v = renderer.getDrawingBufferSize(new THREE.Vector2()); rt.setSize(v.x, v.y); rtText.setSize(v.x, v.y); post.uniforms.uRes.value.copy(v); }

function view() { const w = innerWidth, h = innerHeight; camera.setViewOffset(w, h, -P.posX * w, -P.posY * h + (view.shift || 0), w, h); group.rotation.set(P.lean * Math.PI / 180, 0, -P.tilt * Math.PI / 180); if (fontsIn) placeWords(); }
function depth() { const bg = mode === 'light' ? 0xefede8 : 0x0b0b0c; scene.fog.color.setHex(bg); veil.material.color.setHex(bg);
  scene.fog.near = D - P.radius * .25; scene.fog.far = D + P.radius * (.7 + 3.4 * (1 - P.depth)); }
addEventListener('resize', resize);

// ---------- light and dark ----------
let mode = BARE ? (q.get('mode') === 'light' ? 'light' : 'dark') : (() => { try { return localStorage.getItem(KEY + '.mode') || 'dark'; } catch { return 'dark'; } })();
function setMode(m) { mode = m; if (!BARE) try { localStorage.setItem(KEY + '.mode', m); } catch { } document.body.classList.toggle('light', m === 'light'); document.body.classList.toggle('dark', m === 'dark'); $('panel').classList.toggle('dark', m === 'dark');
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.m === m))); $('vars').classList.toggle('dark', m === 'dark'); document.querySelector('meta[name=theme-color]').content = m === 'light' ? '#efede8' : '#0b0b0c';
  scene.background = new THREE.Color(m === 'light' ? 0xefede8 : 0x0b0b0c); depth(); if (fontsIn) drawWords(); }
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => setMode(b.dataset.m));

// ---------- the words ----------
function words() { if (typeof drawWords === 'function' && fontsIn) drawWords(); const sy = $('say').style; sy.setProperty('--tx', P.tx); sy.setProperty('--ty', P.ty); sy.setProperty('--ts', P.ts); $('title').textContent = P.title; $('lbl').textContent = P.label; document.body.classList.toggle('nowords', !P.words); document.body.classList.toggle('nolabel', !P.label.trim()); }

// (while Customize is open the words can be dragged about)
{ let wd = null; const say = $('say');
  say.addEventListener('pointerdown', e => { if (!document.body.classList.contains('tuning')) return; wd = { x: e.clientX, y: e.clientY }; say.setPointerCapture(e.pointerId); e.preventDefault(); });
  say.addEventListener('pointermove', e => { if (!wd) return; P.tx = clamp(P.tx + (e.clientX - wd.x) / innerWidth, -.45, .45); P.ty = clamp(P.ty + (e.clientY - wd.y) / innerHeight, .05, .95); wd = { x: e.clientX, y: e.clientY }; words(); ctl.tx?.set(P.tx); ctl.ty?.set(P.ty); });
  say.addEventListener('pointerup', () => { if (wd) { wd = null; save(); } }); }

// ---------- the looks ----------
const lookNow = () => Object.keys(LOOKS).find(n => LOOK_KEYS.every(k => P[k] === (k in LOOKS[n] ? LOOKS[n][k] : DEF[k]))) || 'Custom';
function applyLook(n) { for (const k of LOOK_KEYS) P[k] = k in LOOKS[n] ? LOOKS[n][k] : DEF[k]; for (const k of LOOK_KEYS) ctl[k]?.set(P[k]); exitT = 0; save(); resize(); $('nm').textContent = n; }

// ---------- the panel ----------
const panel = $('panel'), ctl = {};

  head.querySelector('.pc').onclick = () => openPanel(false); panel.appendChild(head);

  { const h = document.createElement('p'); h.className = 'ui-hint'; h.textContent = 'Or hold Shift and drag the spiral.'; gp.appendChild(h); }

  sl(gx, 'dof', 'Depth blur', 0, 16, .1, 'px'); sl(gx, 'turnBlur', 'Blur while turning', 0, 2, .01, ''); sl(gx, 'aberr', 'Aberration', 0, 2, .01, ''); sl(gx, 'shade', 'Dark from below', 0, 1, .01, '', 'fx');

  sl(g0, 'spiral', 'Climb (how much a turn climbs)', 0, 1, .01, ''); sl(g0, 'scroll', 'Scroll strength', .2, 3, .05, '×'); sl(g0, 'drift', 'Turn on its own', 0, .6, .01, '');
  sl(g0, 'perTurn', 'Cards in a turn', 6, 18, 1, '', 'build'); sl(g0, 'pitch', 'Gap between turns', 1.5, 3.5, .05, '', 'build'); sl(g0, 'radius', 'Radius', 2.2, 4.6, .05, '', 'build'); sl(g0, 'scatter', 'Scatter', 0, 1, .01, '');
