<style>
  /* A badge on a lanyard, hanging in the middle of the page: the two straps come down from above, wide apart, and meet at a metal
     clip; the card hangs from it by a ring through its slot. Grab the card (or a strap) and throw it: it swings, turns about the ring,
     the straps go slack and taut (a small verlet world: the card is a rigid set of points, the straps are chains). A tap on the card
     deals it a new graphic. The graphic takes one of several forms: the stripes generator below, or rays, threads, orbits, blobs,
     facets, an eye that follows the hand, a wall of tiles (a tap on one tile deals just that tile); and the type one of three setups (editorial serif, grotesk in the lab's own face (Google Sans Flex), classic serif, each with a mono). The pattern is a generator: stripes in two colours, and lines across them where the stripes swap colour,
     so arrows, Vs, zigzags, diamonds and bowties come out of plain stripes; it drifts slowly. Light or dark on top; Customize tunes
     the pattern, the colours and the lanyard. One canvas. */
  :root { --bg: #f3f2ee; --ease: cubic-bezier(.22,.61,.36,1); --page: #fff; --boxbg: #f3f2ee; --morph: .55s cubic-bezier(.3,1.12,.4,1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); font-family: var(--lab-font); overflow: hidden; transition: background .4s; }
  body.dark { --bg: #0e0e10; --page: #17181b; --boxbg: #151517; }
  body.tuning { background: var(--page); }
  .stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); touch-action: none; transition: inset var(--morph), border-radius var(--morph), background .4s; }
  body.tuning .stage { background: var(--boxbg); border-radius: 26px; }
  .stage.grab { cursor: grab; } .stage.dragging { cursor: grabbing; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .back, .tune, .mode { position: fixed; top: 16px; z-index: 6; transition: top var(--morph), left var(--morph); }
  body.tuning .back, body.tuning .mode { top: 30px; } body.tuning .back { left: 30px; }
  .back { left: 16px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 999px; background: #fff; color: #1b1c20; }
  .back:hover { translate: -2px 0; } .back svg { width: 20px; height: 20px; }
  .tune { right: 16px; display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 20px 0 16px; border: 0; border-radius: 999px; background: #fff; color: #1b1c20; font: 600 14px var(--lab-font); cursor: pointer; transition: transform .2s var(--ease), opacity .2s; }
  .tune:hover { transform: translateY(-1px); } .tune svg { width: 19px; height: 19px; } body.tuning .tune { opacity: 0; pointer-events: none; }
  .mode { left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: #fff; font: 600 13px var(--lab-font); transition: left .45s var(--ease); }
  .mode button { height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: rgba(20,20,20,.55); font: inherit; cursor: pointer; }
  .mode button:hover { color: #1b1c20; } .mode button[aria-checked=true] { background: #1b1c20; color: #fff; }
  body.dark .back, body.dark .tune, body.dark .mode { background: #1c1c1f; color: #f2f2f0; }
  body.dark .mode button { color: rgba(255,255,255,.5); } body.dark .mode button[aria-checked=true] { background: #f2f2f0; color: #1b1c20; }
  /* the shuffle button: at the foot of the page, a pill like the corner buttons */
  .shuf { position: fixed; left: 50%; bottom: 22px; z-index: 6; translate: -50% 0; display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 20px 0 16px; border: 0; border-radius: 999px;
    background: #fff; color: #1b1c20; font: 600 14px var(--lab-font); cursor: pointer; transition: left .45s var(--ease), transform .2s var(--ease), scale .25s var(--ease); }
  .shuf:hover { transform: translateY(-1px); } .shuf:active { scale: .96; } .shuf svg { width: 19px; height: 19px; transition: rotate .45s var(--ease); } .shuf:hover svg { rotate: 180deg; }
  body.dark .shuf { background: #1c1c1f; color: #f2f2f0; } body.bare .shuf { display: none; }
  .hint { position: fixed; left: 50%; bottom: 84px; translate: -50% 0; font-size: 13px; color: #1b1c20; opacity: .45; white-space: nowrap; pointer-events: none; transition: left .45s var(--ease); }
  body.dark .hint { color: #f2f2f0; }
  body.bare .back, body.bare .tune, body.bare .mode, body.bare .hint, body.bare .panel { display: none; }
  .panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 340px; z-index: 5; display: flex; flex-direction: column; overflow: auto; overscroll-behavior: contain; padding: 0 20px; --ui-pad: 20px;
    font-family: var(--lab-font); border-radius: 26px; border: 1px solid var(--ui-card-line, rgba(20,20,20,.08)); opacity: 0; translate: 24px 0; visibility: hidden;
    transition: translate var(--morph), opacity .3s, visibility 0s .55s; }
  body.tuning .panel { opacity: 1; translate: 0 0; visibility: visible; transition: translate var(--morph), opacity .35s .08s; }
  .panel::-webkit-scrollbar { width: 0; }
  .ph { position: sticky; top: 0; z-index: 3; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 0 -20px; padding: 22px 20px 12px; background: var(--ui-bg); }
  .ph h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; } .ph p { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--ui-muted); }
  .pc { flex: none; width: 32px; height: 32px; margin: -4px -6px 0 0; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: var(--ui-ink); cursor: pointer; transition: background .2s; } .pc:hover { background: var(--ui-field); } .pc svg { width: 18px; height: 18px; }
  .play-intro { height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--ui-field); font: 500 12.5px var(--lab-font); color: var(--ui-ink); cursor: pointer; transition: background .2s; } .play-intro:hover { background: var(--ui-field-hi); }
  .acts { position: sticky; bottom: 0; display: flex; margin: auto -20px 0; padding: 14px 20px 20px; background: var(--ui-bg); }
  @media (min-width: 761px) { body.tuning .stage { inset: 16px 368px 16px 16px; } body.tuning .mode, body.tuning .hint, body.tuning .shuf { left: calc(50% - 176px); } }
  @media (max-width: 760px) { .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 56vh; translate: 0 calc(100% + 16px); }
    body.tuning .panel { translate: 0 0; } body.tuning .stage { inset: 8px 8px calc(56vh + 16px) 8px; border-radius: 22px; } body.tuning .hint, body.tuning .shuf { display: none; }
    body.tuning .back, body.tuning .mode { top: 18px; } body.tuning .back { left: 18px; } }
</style>

<body>
<a class="back" href="../../" aria-label="Back to the lab" title="Back to the lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></a>
<div class="mode lab-seg" id="mode" role="radiogroup" aria-label="Light or dark"><button type="button" role="radio" data-m="light">Light</button><button type="button" role="radio" data-m="dark">Dark</button></div>
<button class="tune" id="tune" type="button" aria-controls="panel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Customize</button>
<main class="stage" id="stage" aria-label="A badge on a lanyard: drag it and let go to swing it, tap it for a new pattern"><canvas id="cv"></canvas></main>
<button class="shuf" id="shuf" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3.5c2.2 0 3.6 1 4.8 2.8l2.4 4.4C14.9 16 16.3 17 18.5 17H21M17.5 13.5L21 17l-3.5 3.5M3 17h3.5c1.5 0 2.6-.5 3.5-1.4M14 8.4c.9-.9 2-1.4 3.5-1.4H21M17.5 3.5L21 7l-3.5 3.5"/></svg>Shuffle</button>
<p class="hint">Drag the badge and let go · tap it for a new graphic (on Tiles, tap a tile)</p>
<aside class="panel lab-ui soft" id="panel" aria-label="Customize the badge"></aside>
<script src="../../shared/lab-ui.js?v=19"></script>
<script>
// ---------- the settings; kept in the browser ----------
const KEY = 'lab.badge.v1';
const DEF = { form: 'blobs', detail: .5, fonts: 'grotesk', tiles: 'playground', bump: {}, motif: 'arrows', stripes: 16, repeat: 2, drift: .35, dir: 'v', palette: 'coral', invert: false, spread: 260, weight: 1, swing: .992, size: 1, seed: 7 };
let P = (() => { const p = { ...DEF }; try { const o = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in DEF) if (typeof o[k] === typeof DEF[k]) p[k] = o[k]; } catch { } return p; })();
const save = () => { try { const d = {}; for (const k in P) if (P[k] !== DEF[k]) d[k] = P[k]; localStorage.setItem(KEY, JSON.stringify(d)); } catch { } };
const $ = id => document.getElementById(id), stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const q = new URLSearchParams(location.search), BARE = q.has('thumb') || q.has('demo'), DEMO = q.has('demo');

// ---------- the colours: ink, paper, and the card's own colour; the pattern's light stripes are the paper, or the colour ----------
const PALETTES = {   // (ink and paper; tone: the card's block; field: the graphic's ground; dot: the pastel; deep: the shapes and the eye's ground)
  coral: { name: 'Coral', ink: '#1c1b1a', paper: '#efe9dc', tone: '#f07a5f', field: '#e2643f', dot: '#ead68f', deep: '#6e2a22' },
  sky:   { name: 'Sky',   ink: '#1c1b1a', paper: '#efe9dc', tone: '#a9c8dd', field: '#8cc5d3', dot: '#d8a2cd', deep: '#284a63' },
  mint:  { name: 'Mint',  ink: '#1c1b1a', paper: '#efe9dc', tone: '#bfe9c8', field: '#86d6bb', dot: '#eef3ef', deep: '#1f5a49' },
  lilac: { name: 'Lilac', ink: '#1c1b1a', paper: '#efe9dc', tone: '#c3b0dd', field: '#b49fcf', dot: '#efe7b0', deep: '#6b2735' },
  stone: { name: 'Stone', ink: '#1c1b1a', paper: '#efe9dc', tone: '#b9b4a6', field: '#d9c99e', dot: '#e9907f', deep: '#4a4436' },
  night: { name: 'Night', dark: true, ink: '#efe9dc', paper: '#1f1e1d', tone: '#f07a5f', field: '#2a2927', dot: '#f07a5f', deep: '#3a3835' } };

// ---------- the pattern: stripes, and lines across them where the stripes swap colour ----------
// (every motif is a few boundary lines y = f(x) over the band, x and y from 0 to 1; a point below an odd number of them has its
// stripe's colours swapped. Drawn as one shape: each stripe cut into narrow slices, each slice split at the lines into pieces that
// alternate between the two colours; every dark piece goes into a single path filled once over the light ground, so no seams show
// where two dark pieces meet. Phase slides the lines along, so the shapes drift)
const frac = x => x - Math.floor(x), tri = x => 1 - Math.abs(2 * frac(x) - 1);      // (tri: 0 → 1 → 0 over each unit)
// (ramp: up from 0 to 1, then straight back down over r, a steep back in place of a jump: a jump would leave hairline slivers as
// the shapes drift across the stripes; the back is one stripe wide)
const ramp = (x, r) => { const f = frac(x); return f < 1 - r ? f / (1 - r) : (1 - f) / r; };
const MOTIFS = {
  arrows:   { name: 'Arrows',   lines: (k, ph, r) => [u => .5 - .5 * (1 - ramp(u * k + ph, r)), u => .5 + .5 * (1 - ramp(u * k + ph, r))] },
  v:        { name: 'V',        lines: (k, ph) => [u => .12 + .76 * (1 - tri(u * k * .5 + ph + .5))] },
  zigzag:   { name: 'Zigzag',   lines: (k, ph) => [u => .2 + .6 * tri(u * k + ph), u => .2 + .6 * tri(u * k + ph + .5)] },
  diamonds: { name: 'Diamonds', lines: (k, ph) => [u => .5 - .44 * tri(u * k + ph), u => .5 + .44 * tri(u * k + ph)] },
  bowtie:   { name: 'Bowtie',   lines: (k, ph) => [u => .5 - .48 * (1 - tri(u * k + ph)), u => .5 + .48 * (1 - tri(u * k + ph))] },
  lens:     { name: 'Lens',     lines: (k, ph) => [u => .08 + .34 * (2 * frac(u * k * .5 + ph) - 1) ** 2, u => .92 - .34 * (2 * frac(u * k * .5 + ph) - 1) ** 2] },
  slant:    { name: 'Slant',    lines: (k, ph, r) => [u => ramp(u * k * .5 + ph, r / 2) * 1.3 - .15, u => ramp(u * k * .5 + ph + .5, r / 2) * 1.3 - .15] } };
function pattern(c, w, h, o) {   // (o: motif, stripes, repeat, phase, dir, a (dark), b (light))
  c.save(); if (o.dir === 'h') { c.translate(w, 0); c.rotate(Math.PI / 2); [w, h] = [h, w]; }
  const n = Math.max(2, Math.round(o.stripes)), sw = w / n, sub = Math.max(2, Math.ceil(240 / n)), lines = MOTIFS[o.motif].lines(o.repeat, o.phase, Math.min(.5, o.repeat / n)), dark = new Path2D(), cl = y => Math.max(0, Math.min(h, y));
  const slice = (i, xa, xb, depth = 0) => { const ua = xa / w + 1e-7, ub = xb / w - 1e-7;
    // (a line that jumps inside the slice (the back of an arrow, the step of a slant): split the slice right at the jump)
    if (depth < 2) for (const f of lines) if (Math.abs(f(ua) - f(ub)) > .3) { let lo = ua, hi = ub; for (let t = 0; t < 22; t++) { const m = (lo + hi) / 2; if (Math.abs(f(lo) - f(m)) > Math.abs(f(m) - f(hi))) hi = m; else lo = m; }
      const xs = (lo + hi) / 2 * w; slice(i, xa, xs, depth + 1); slice(i, xs, xb, depth + 1); return; }
    const um = (ua + ub) / 2, cuts = lines.map(f => [cl(f(ua) * h), cl(f(ub) * h), f(um)]).sort((p, q) => p[2] - q[2]), edges = [[0, 0], ...cuts, [h, h]];
    for (let e = 0; e < edges.length - 1; e++) if (((i % 2 === 0) ? 1 : 0) ^ (e % 2)) {
      const [ta, tb] = edges[e], [ba, bb] = edges[e + 1]; if (ba - ta < .01 && bb - tb < .01) continue;
      dark.moveTo(xa, ta); dark.lineTo(xb, tb); dark.lineTo(xb, Math.max(bb, tb)); dark.lineTo(xa, Math.max(ba, ta)); dark.closePath(); } };
  for (let i = 0; i < n; i++) for (let j = 0; j < sub; j++) slice(i, (i + j / sub) * sw, (i + (j + 1) / sub) * sw);
  c.fillStyle = o.b; c.fillRect(0, 0, w, h); c.fillStyle = o.a; c.fill(dark); c.restore(); }

// ---------- the world: a lanyard of two chains, a clip, a ring, a rigid card (verlet) ----------
const CW = 280, CH = 420;                       // (the card in its own units)
let W = 1, H = 1, dpr = 1, k = 1, pts = [], sticks = [], strapL = [], strapR = [], clip, hole, TL, TR, BR, BL, built = false;
const pt = (x, y, w) => { const p = { x, y, px: x, py: y, w }; pts.push(p); return p; };
const stick = (a, b, rope) => sticks.push({ a, b, len: Math.hypot(b.x - a.x, b.y - a.y), rope });
function build() { pts = []; sticks = []; k = Math.min(W / 760, H / 900) * P.size;
  const cx = W / 2, cw = CW * k, ch = CH * k, ring = 20 * k, cy = Math.max(H * .5 - ch / 2 - ring - 10 * k, 90 * k);   // (the clip, so the card hangs in the middle)
  clip = pt(cx, cy, 1); hole = pt(cx, cy + ring, .12); stick(clip, hole);
  TL = pt(cx - cw / 2, hole.y - 22 * k, .12); TR = pt(cx + cw / 2, hole.y - 22 * k, .12); BR = pt(cx + cw / 2, TL.y + ch, .12); BL = pt(cx - cw / 2, TL.y + ch, .12);
  const card = [TL, TR, BR, BL, hole]; for (let i = 0; i < card.length; i++) for (let j = i + 1; j < card.length; j++) stick(card[i], card[j]);
  const chain = side => { const ax = cx + side * P.spread * k / 2, ay = -12 * k, n = 16, out = [];
    for (let i = 0; i <= n; i++) { const t = i / n; out.push(i === n ? clip : pt(ax + (cx - ax) * t, ay + (cy - ay) * t, i === 0 ? 0 : 1)); }
    for (let i = 0; i < n; i++) stick(out[i], out[i + 1], true); return out; };
  strapL = chain(-1); strapR = chain(1); built = true; }
let grab = null;   // ({ kind: 'card', u, v, x, y } or { kind: 'strap', p, x, y })
function step(dt) { const g = 2600 * k * P.weight;
  for (const p of pts) { if (!p.w) continue; const damp = p.w < 1 ? P.swing : .975, vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp; p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + g * dt * dt; }
  for (let it = 0; it < 18; it++) {
    for (const s of sticks) { const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y, d = Math.hypot(dx, dy) || 1e-6; if (s.rope && d <= s.len) continue;   // (a strap can go slack, never stretch)
      const wsum = s.a.w + s.b.w; if (!wsum) continue; const diff = (d - s.len) / d / wsum; s.a.x += dx * diff * s.a.w; s.a.y += dy * diff * s.a.w; s.b.x -= dx * diff * s.b.w; s.b.y -= dy * diff * s.b.w; }
    if (grab && grab.kind === 'card') { const { u, v } = grab, wt = [(1 - u) * (1 - v), u * (1 - v), u * v, (1 - u) * v], C = [TL, TR, BR, BL];   // (the held point of the card pulled to the hand, shared out to its corners)
      let x = 0, y = 0, n2 = 0; C.forEach((p, i) => { x += p.x * wt[i]; y += p.y * wt[i]; n2 += wt[i] * wt[i]; }); const dx = (grab.x - x) * .5 / n2, dy = (grab.y - y) * .5 / n2;
      C.forEach((p, i) => { p.x += dx * wt[i]; p.y += dy * wt[i]; }); }
    if (grab && grab.kind === 'strap') { grab.p.x = grab.x; grab.p.y = grab.y; } } }

// ---------- the other forms of the graphic: line art, orbits, blobs, facets, an eye ----------
// (each one a small composition laid out from the seed, so a shuffle deals a new one and a reload keeps it; each one moves a little
// with the drift. Thin ink lines on a coloured field, pastel dots under them, as on printed matter)
const seeded = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const TAU = Math.PI * 2;
function dots(c, R, w, h, col, n, ph) { c.fillStyle = col;
  for (let i = 0; i < n; i++) { const x = R() * w, y = R() * h, r = 10 + R() * 8, a = R() * TAU; c.beginPath(); c.arc(x + Math.cos(ph * TAU + a) * 5, y + Math.sin(ph * TAU + a) * 4, r, 0, TAU); c.fill(); } }
const LOOK = { x: CW / 2, y: 75, tx: CW / 2, ty: 75 };   // (where the eye looks, in the card's units; eased)
const FORMS = {
  stripes: { name: 'Stripes' },
  rays: { name: 'Rays', draw(c, w, h, o) { const R = seeded(o.seed), n = 10 + Math.round(o.detail * 22), edge = R() < .5;
    c.fillStyle = o.pal.field; c.fillRect(0, 0, w, h); dots(c, R, w, h, o.pal.dot, 2 + (R() * 2 | 0), o.phase);
    const cx = edge ? w * 1.04 : w * (.3 + .4 * R()), cy = h * (.25 + .5 * R()), a0 = R() * TAU, sway = Math.sin(o.phase * TAU) * .06;
    c.strokeStyle = o.pal.ink; c.lineWidth = 1.1; c.beginPath();
    for (let i = 0; i < n; i++) { const a = edge ? Math.PI + (i / (n - 1) - .5) * 2.4 + (R() - .5) * .12 + sway : a0 + i / n * TAU + (R() - .5) * .3 + sway; c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * w * 2, cy + Math.sin(a) * w * 2); }
    if (!edge) { c.moveTo(cx, 0); c.lineTo(cx, h); } c.stroke(); } },
  threads: { name: 'Threads', draw(c, w, h, o) { const R = seeded(o.seed), n = 3 + Math.round(o.detail * 4);
    c.fillStyle = o.pal.field; c.fillRect(0, 0, w, h); dots(c, R, w, h, o.pal.dot, 2 + (R() * 2 | 0), o.phase);
    c.strokeStyle = o.pal.ink; c.lineWidth = 1.1;
    for (let i = 0; i < n; i++) { const x = w * R(), y = h * R(), rx = w * (.3 + .55 * R()), ry = h * (.45 + .9 * R()), rot = R() * Math.PI + o.phase * (i % 2 ? .6 : -.6);
      c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); c.stroke(); } } },
  orbits: { name: 'Orbits', draw(c, w, h, o) { const R = seeded(o.seed), n = 3 + Math.round(o.detail * 3), side = R() < .5;
    c.fillStyle = o.pal.field; c.fillRect(0, 0, w, h); c.strokeStyle = c.fillStyle = o.pal.ink; c.lineWidth = 1;
    for (let i = 0; i < n; i++) { const t = n > 1 ? i / (n - 1) : 0, dashed = i % 2 === 1;

  const head = document.createElement('header'); head.className = 'ph'; head.innerHTML = '<div><h2>Tune</h2><p>The pattern on the badge, its colours, and the lanyard it hangs from. A tap on the badge deals a new one.</p></div><button class="pc" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  head.querySelector('.pc').onclick = () => openPanel(false); panel.appendChild(head);
  const set = (key, v, re) => { P[key] = v; save(); if (re) size(true); };
  const sl = (g, key, label, min, max, st, unit, re) => ctl[key] = LabUI.slider(g, { label, min, max, step: st, unit, value: P[key], def: DEF[key], onInput: v => set(key, v, re) });
  const g0 = LabUI.group(panel, 'Graphic', { key: KEY + '.g.pattern' });
  ctl.form = LabUI.seg(g0, { label: 'Form', options: Object.entries(FORMS).map(([v, f]) => [v, f.name]), value: P.form, onChange: v => { set('form', v); showFor(); } });
  ctl.tiles = LabUI.seg(g0, { label: 'Tile colours', options: Object.entries(TILESETS).map(([v, t]) => [v, t.name]), value: P.tiles, onChange: v => set('tiles', v) });
  ctl.motif = LabUI.seg(g0, { label: 'Shape', options: Object.entries(MOTIFS).map(([v, m]) => [v, m.name]), value: P.motif, onChange: v => set('motif', v) });
  sl(g0, 'stripes', 'Stripes', 6, 32, 2); sl(g0, 'repeat', 'Repeat', 1, 4, 1);
  ctl.dir = LabUI.seg(g0, { label: 'Stripes run', options: [['v', 'Down'], ['h', 'Across']], value: P.dir, onChange: v => set('dir', v) });
  sl(g0, 'detail', 'Detail', 0, 1, .05); sl(g0, 'drift', 'Drift', 0, 2, .05);
  { const r = document.createElement('div'); r.className = 'ui-row'; r.innerHTML = '<span class="ui-label">Composition</span><button type="button" class="play-intro">New layout</button>'; g0.appendChild(r);
    r.querySelector('button').onclick = () => { P.seed = (P.seed * 48271 + 11) % 2147483647; P.bump = {}; save(); }; ctl.relayout = { row: r, set() { } }; }
  const gT = LabUI.group(panel, 'Type', { key: KEY + '.g.type' });
  ctl.fonts = LabUI.seg(gT, { label: 'Fonts', options: Object.entries(FONTS).map(([v, f]) => [v, f.name]), value: P.fonts, onChange: v => set('fonts', v) });
  const g1 = LabUI.group(panel, 'Colour', { key: KEY + '.g.colour' });
  ctl.palette = LabUI.swatches(g1, { label: 'Palette', options: Object.entries(PALETTES).map(([v, p]) => ({ v, name: p.name, css: `linear-gradient(135deg, ${p.tone} 0 50%, ${p.ink} 50% 100%)` })), value: P.palette, onChange: v => set('palette', v) });
  ctl.invert = LabUI.check(g1, { label: 'Stripes in the card’s colour', value: P.invert, onChange: v => set('invert', v) });
  showFor();
  const g2 = LabUI.group(panel, 'Lanyard', { key: KEY + '.g.lanyard' }); sl(g2, 'spread', 'Spread at the top', 0, 600, 10, 'px', true); sl(g2, 'weight', 'Weight', .3, 2.5, .05); sl(g2, 'swing', 'Keeps swinging', .95, .999, .001);
  const g3 = LabUI.group(panel, 'Look', { key: KEY + '.g.look' }); sl(g3, 'size', 'Size', .6, 1.6, .05, '×', true);
  const acts = document.createElement('div'); acts.className = 'acts'; acts.innerHTML = '<button type="button" data-a="shuffle">Shuffle</button><button type="button" data-a="reset">Reset all</button>'; panel.appendChild(acts);
  acts.querySelector('[data-a=shuffle]').onclick = shuffle;
  acts.querySelector('[data-a=reset]').onclick = () => { P = { ...DEF }; seed = P.seed; save(); for (const key in ctl) ctl[key].set(P[key]); showFor(); size(true); }; }
// (the rows that only the stripes use show only for the stripes; Detail and a new layout only for the others)
function showFor() { const st = P.form === 'stripes';
  for (const key of ['motif', 'stripes', 'repeat', 'dir', 'invert']) if (ctl[key]) ctl[key].row.style.display = st ? '' : 'none';
  for (const key of ['detail', 'relayout']) if (ctl[key]) ctl[key].row.style.display = st ? 'none' : '';
  if (ctl.tiles) ctl.tiles.row.style.display = P.form === 'tiles' ? '' : 'none'; }
function openPanel(on) { document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);
$('shuf').onclick = () => shuffle();
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('tuning')) openPanel(false); });

// ---------- the board's box: ?thumb=1 the still, hanging at rest; ?demo=1 nudged now and then, a new pattern every few swings ----------
if (BARE) { document.body.classList.add('bare'); P = { ...DEF }; seed = P.seed; setMode('light'); }
buildPanel(); setMode(BARE ? 'light' : mode); LabUI.segThumb($('mode'));
if (DEMO) document.documentElement.style.visibility = 'hidden';   // (the board's live box: shown once the first picture is drawn with its type, so it lands on the still under it)
fontsReady().finally(() => { size(); if (DEMO) requestAnimationFrame(() => { document.documentElement.style.visibility = ''; });
  if (q.has('thumb')) { for (let i = 0; i < 600; i++) step(1 / 120); draw(); return; }
  requestAnimationFrame(t => { last = t; tick(t); });
  if (DEMO) { let n = 0; setInterval(() => { const s = (n % 2 ? 1 : -1) * 14 * k; for (const p of [BL, BR]) p.px -= s; if (++n % 3 === 0) shuffle(); }, 2400); } });
window.BADGE = { get P() { return P; }, shuffle, step, draw, size };
</script>
