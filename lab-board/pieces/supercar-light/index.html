<style>
  /* Supercar Light: a light car (10k triangles) that looks real because of its maps and its light, not its geometry. Two switches
     on the stage (Intact / Damaged, PBR Before / After); Customize opens the lab's card beside the stage with everything else. */
  :root { --bg: #e9ebee; --ink: #1b1c20; --ease: cubic-bezier(.22,.61,.36,1); --page: #fff; --morph: .55s cubic-bezier(.3,1.12,.4,1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--lab-font); overflow: hidden; }
  body.tuning { background: var(--page); }
  .stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); transition: inset var(--morph), border-radius var(--morph); }
  body.tuning .stage { border-radius: 26px; }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .skeleton { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity .4s ease; pointer-events: none; }
  .skeleton.gone { opacity: 0; }
  .skeleton .car { width: min(56%, 620px); aspect-ratio: 4.2 / 1; border-radius: 40% 46% 18% 18% / 70% 70% 30% 30%; background: #dcdfe4; position: relative; }
  .skeleton .car::before, .skeleton .car::after { content: ""; position: absolute; bottom: -14%; width: 17%; aspect-ratio: 1; border-radius: 50%; background: #d0d3d9; }
  .skeleton .car::before { left: 13%; } .skeleton .car::after { right: 13%; }
  @media (prefers-reduced-motion: no-preference) { .skeleton .car { animation: pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .55; } } }

  .back, .tune { position: fixed; top: 16px; z-index: 6; transition: top var(--morph), left var(--morph); }
  body.tuning .back { top: 30px; left: 30px; }
  .back { left: 16px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 999px; background: #fff; color: #1b1c20; }
  .back:hover { translate: -2px 0; } .back svg { width: 20px; height: 20px; }
  .tune { right: 16px; display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 20px 0 16px; border: 0; border-radius: 999px; background: #fff; color: #1b1c20; font: 600 14px var(--lab-font); cursor: pointer; transition: transform .2s var(--ease), opacity .2s; }
  .tune:hover { transform: translateY(-1px); } .tune svg { width: 19px; height: 19px; } body.tuning .tune { opacity: 0; pointer-events: none; }
  .back:focus-visible, .tune:focus-visible, .pick button:focus-visible { outline: 2px solid rgba(20,20,20,.35); outline-offset: 2px; }

  /* the two switches on the stage: the lab's segmented pill (one thumb slides to the chosen side) */
  .dock { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); translate: -50% 0; z-index: 6; display: flex; gap: 10px; transition: left var(--morph), bottom var(--morph); }
  .pick { display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: #fff; font: 600 13px var(--lab-font); }
  .pick .tag { padding: 0 6px 0 12px; color: rgba(20,20,20,.42); font-size: 12px; letter-spacing: .04em; }
  .pick button { height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: rgba(20,20,20,.55); font: inherit; cursor: pointer; white-space: nowrap; }
  .pick button:hover { color: #1b1c20; } .pick button[aria-checked=true] { color: #fff; }
  @media (max-width: 520px) { .dock { flex-direction: column; align-items: center; gap: 8px; } }

  /* the card beside the stage (the lab's shared controls, soft look) */
  .panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 340px; z-index: 5; display: flex; flex-direction: column; overflow: auto; overscroll-behavior: contain; padding: 0 20px; --ui-pad: 20px;
    font-family: var(--lab-font); border-radius: 26px; border: 1px solid var(--ui-card-line, rgba(20,20,20,.08)); opacity: 0; translate: 24px 0; visibility: hidden;
    transition: translate var(--morph), opacity .3s, visibility 0s .55s; }
  body.tuning .panel { opacity: 1; translate: 0 0; visibility: visible; transition: translate var(--morph), opacity .35s .08s; }
  .panel::-webkit-scrollbar { width: 0; }
  .ph { position: sticky; top: 0; z-index: 3; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 0 -20px; padding: 22px 20px 12px; background: var(--ui-bg); }
  .ph h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; } .ph p { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--ui-muted); }
  .pc { flex: none; width: 32px; height: 32px; margin: -4px -6px 0 0; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: var(--ui-ink); cursor: pointer; transition: background .2s; } .pc:hover { background: var(--ui-field); } .pc svg { width: 18px; height: 18px; }
  .btns { display: flex; gap: 6px; margin: 2px 0 10px; }
  .btns button { height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--ui-field); font: 500 12.5px var(--lab-font); color: var(--ui-ink); cursor: pointer; transition: background .2s, scale .3s var(--ui-spring); }
  .btns button:hover { background: var(--ui-field-hi); } .btns button:active { scale: .95; }
  .foot { margin: auto -20px 0; padding: 16px 20px 18px; font-size: 11.5px; line-height: 1.5; color: var(--ui-muted); }
  .foot a { color: inherit; }

  @media (min-width: 761px) { body.tuning .stage { inset: 16px 368px 16px 16px; } body.tuning .dock { left: calc(50% - 176px); } }
  @media (max-width: 760px) { .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 56vh; translate: 0 calc(100% + 16px); }
    body.tuning .panel { translate: 0 0; } body.tuning .stage { inset: 8px 8px calc(56vh + 16px) 8px; border-radius: 22px; } body.tuning .dock { display: none; }
    body.tuning .back { top: 18px; left: 18px; } }

  /* the board's box (?thumb, ?demo): the car alone */
  body.bare .back, body.bare .tune, body.bare .dock, body.bare .panel { display: none; }

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { Reflector } from "three/addons/objects/Reflector.js";
import { GroundedSkybox } from "three/addons/objects/GroundedSkybox.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const THUMB = Q.has("thumb"), DEMO = Q.has("demo"), BARE = THUMB || DEMO;
if (BARE) document.body.classList.add("bare");
const A = "assets/";

const S = {
  pbr: "after", variant: "damaged",
  view: "render", quality: "high",
  env: "studio_small_09", bg: "color", bgColor: "#e9ebee", envRot: 0, envI: 1, exposure: 0.75,
  azimuth: 126, elevation: 49, sun: 2.6, spin: false,
  paint: "orig", paintType: "metallic", flakes: 0.35, rim: "#C9A24A", rimFinish: "satin",
  relief: "bump", reliefK: 0.5, depth: "none", depthK: 0.5, flat: false,
  albedo: true, ao: true, orm: true, coat: true, glow: 0, wheels: true,
  bloom: true, bloomK: 0.5, mirror: true, mirrorK: 0.86, ssao: true, dof: true, dofK: 0.35,
  dentClick: true, dentR: 18, dentDepth: 2.5, dentK: 1,
  fur3d: true, furLen: 2.0, furDensity: 1100, furDroop: 0.35,
};
const QUALITY = {
  low:    { pr: 1,   shadow: 1024, mirror: 0.35, samples: 0, shells: 10, label: "low" },
  medium: { pr: 1.5, shadow: 2048, mirror: 0.6,  samples: 4, shells: 22, label: "medium" },
  high:   { pr: 2,   shadow: 4096, mirror: 1,    samples: 4, shells: 40, label: "high" },
};
//               rough metal coat irid
const PAINT = {
  gloss:    [0.16, 0.0,  1, 0],
  metallic: [0.34, 0.6,  1, 0],
  pearl:    [0.26, 0.25, 1, 1],
  matte:    [0.58, 0.12, 0, 0],
  chrome:   [0.06, 1.0,  0, 0],
  fur:      [0.92, 0.0,  0, 0],  // + sheen (soft fabric highlight), no clear coat
};
const RIM = { matte: [0.6, 0.55], satin: [0.34, 0.85], gloss: [0.12, 1] };
// the damaged car's dents: rays shot at the body, each hit becomes a dent (from, to, radius cm, depth cm); +Z is the nose, +X its left
const DENT_RAYS = [
  [[5, 0.55, 0.35], [0, 0.55, 0.35], 20, 3],
  [[5, 0.62, -1.25], [0, 0.62, -1.25], 15, 2.5],
  [[-5, 0.48, 0.1], [0, 0.48, 0.1], 22, 3.5],
  [[0.25, 5, 1.75], [0.25, 0, 1.75], 30, 4],
  [[3.5, 0.45, 5], [0.55, 0.45, 2.0], 14, 3],
  [[-3.5, 0.7, -5], [-0.6, 0.7, -2.1], 18, 3],
  [[0.2, 5, -0.2], [0.2, 0, -0.2], 24, 2.5],
];

// ---------------------------------------------------------------- renderer, scene, camera
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: THUMB });
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.info.autoReset = false;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 400);
camera.position.set(5.6, 1.9, 6.4);
const START = camera.position.clone();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.45, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 2.2;
controls.maxDistance = 16;
// the car turns on its own until the first touch (the board's live preview turns for good)
controls.autoRotate = !THUMB;
controls.autoRotateSpeed = 0.9;
if (!DEMO) controls.addEventListener("start", () => { controls.autoRotate = false; });

let dirty = true;
const invalidate = () => (dirty = true);
controls.addEventListener("change", invalidate);

const pmrem = new THREE.PMREMGenerator(renderer);
const roomEnv = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const sun = new THREE.DirectionalLight(0xffffff, S.sun);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 30 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
const basicFill = new THREE.HemisphereLight(0xffffff, 0x50505a, 1.1); // "before": a plain viewer's light, no environment
basicFill.visible = false;
scene.add(basicFill);

const shadowPlane = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.ShadowMaterial({ opacity: 0.3 }));
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = 0.002;
shadowPlane.receiveShadow = true;
shadowPlane.renderOrder = 2; // the shadow darkens the floor reflection, not the other way round
scene.add(shadowPlane);

// polished-floor reflection: transparent, softly blurred, fading out away from the car
const FloorReflectionShader = {
  name: "FloorReflectionShader",
  uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, uStrength: { value: 0.35 } },
  vertexShader: /* glsl */`
    uniform mat4 textureMatrix;
    varying vec4 vUv;
    varying float vR;
    void main() {
      vUv = textureMatrix * vec4(position, 1.0);
      vR = length(position.xy);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float uStrength;
    varying vec4 vUv;
    varying float vR;
    void main() {
      vec2 uv = vUv.xy / vUv.w;
      float b = 0.0015 + vR * 0.0012;
      vec3 c = texture2D(tDiffuse, uv).rgb * 0.36
        + (texture2D(tDiffuse, uv + vec2(b, 0.0)).rgb + texture2D(tDiffuse, uv - vec2(b, 0.0)).rgb
         + texture2D(tDiffuse, uv + vec2(0.0, b)).rgb + texture2D(tDiffuse, uv - vec2(0.0, b)).rgb) * 0.16;
      float fade = 1.0 - smoothstep(1.0, 7.5, vR);
      gl_FragColor = vec4(c, uStrength * fade);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
};
let mirror = null;
function ensureMirror() {
  if (mirror) return mirror;
  mirror = new Reflector(new THREE.CircleGeometry(14, 64), { clipBias: 0.003, textureWidth: 512, textureHeight: 512, shader: FloorReflectionShader });
  mirror.material.transparent = true;
  mirror.material.depthWrite = false;
  mirror.rotation.x = -Math.PI / 2;
  mirror.position.y = 0.001;
  mirror.renderOrder = 1;
  scene.add(mirror);
  resize();
  return mirror;
}

// ---------------------------------------------------------------- post-processing
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.blendIntensity = 1;
const bokeh = new BokehPass(scene, camera, { focus: 7, aperture: 0.002, maxblur: 0.01 });
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.45, 0.85);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(gtao);
composer.addPass(bokeh);
composer.addPass(bloom);
composer.addPass(new OutputPass());
// AO and depth of field only need the car and the floor: hide the projected sky (GTAO would darken it) and the mirror
// (it would render its whole reflection again inside every pass)
function hideDuring(pass) {
  const run = pass.render.bind(pass);
  pass.render = (...args) => {
    const objs = [grounded, mirror].filter(Boolean);
    const vis = objs.map((o) => o.visible);
    objs.forEach((o) => (o.visible = false));
    run(...args);
    objs.forEach((o, i) => (o.visible = vis[i]));
  };
}
hideDuring(gtao);
hideDuring(bokeh);

function resize() {
  const r = stage.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const q = QUALITY[S.quality];
  const pr = Math.min(devicePixelRatio, q.pr);
  renderer.setPixelRatio(pr);
  renderer.setSize(r.width, r.height, false);
  composer.setPixelRatio(pr);
  composer.setSize(r.width, r.height);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
  if (mirror) mirror.getRenderTarget().setSize(Math.round(r.width * pr * q.mirror), Math.round(r.height * pr * q.mirror));
  invalidate();
}
new ResizeObserver(resize).observe(stage);

// ---------------------------------------------------------------- textures
const loader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(path, srgb) {
  return new Promise((ok) => loader.load(A + "tex/" + path, (t) => {
    t.flipY = false; // glTF UV convention
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.anisotropy = maxAniso;
    ok(t);
  }, undefined, () => ok(null)));
}
function canvasTex(size, draw, srgb) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.flipY = false;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
const checker = () => canvasTex(1024, (g, size) => {
  const n = 16, s = size / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    g.fillStyle = (x + y) % 2 ? "#f3f3f5" : `hsl(${(x * 22 + y * 9) % 360} 55% 62%)`;
    g.fillRect(x * s, y * s, s, s);
    g.fillStyle = "#17181b"; g.font = "600 18px sans-serif";
    g.fillText(`${String.fromCharCode(65 + y)}${x + 1}`, x * s + 6, y * s + 22);
  }
}, true);
const flakeTex = () => {
  const t = canvasTex(256, (g, size) => {
    const img = g.createImageData(size, size);
    for (let i = 0; i < size * size; i++) {
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random());
      img.data[i * 4] = 128 + Math.cos(a) * r * 127;
      img.data[i * 4 + 1] = 128 + Math.sin(a) * r * 127;
      img.data[i * 4 + 2] = 255;
      img.data[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }, false);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
};

// ---------------------------------------------------------------- shader patch: paint, rims, flakes, parallax, dents
const U = {
  uMask: { value: null }, uHeight: { value: null }, uFlakeMap: { value: null },
  uPaintOn: { value: 0 }, uPaintColor: { value: new THREE.Color() }, uPaintLum: { value: 0.48 },
  uPaintRough: { value: 0.16 }, uPaintMetal: { value: 0 }, uPaintCoat: { value: 1 }, uTypeOn: { value: 0 },
  uRimOn: { value: 0 }, uRimColor: { value: new THREE.Color() }, uRimLum: { value: 0.05 },
  uRimRough: { value: 0.34 }, uRimMetal: { value: 0.85 }, uRimFinishOn: { value: 0 },
  uFlakes: { value: 0 }, uFlakeScale: { value: 70 },
  uParallax: { value: 0 }, uHeightTop: { value: 0.66 },
  uDents: { value: Array.from({ length: 24 }, () => new THREE.Vector4()) },    // xyz centre, w radius (m)
  uDentDirs: { value: Array.from({ length: 24 }, () => new THREE.Vector4()) }, // xyz push direction, w depth (m)
  uDentCount: { value: 0 }, uDentK: { value: 1 },
};
const MAX_DENTS = 24;
// Dents live in 3D, not in UV: a smooth bowl (1 - s^2)^2 around a point on the body. Every part and every UV island near that point
// sees the same field, so nothing tears at seams or part joints.
const DENT_GLSL = /* glsl */`
uniform vec4 uDents[24];
uniform vec4 uDentDirs[24];
uniform int uDentCount;
uniform float uDentK;
vec3 labDentOffset(vec3 p) {
  vec3 o = vec3(0.0);
  for (int i = 0; i < 24; i++) {
    if (i >= uDentCount) break;
    vec3 d = p - uDents[i].xyz;
    float s2 = dot(d, d) / (uDents[i].w * uDents[i].w);
    if (s2 < 1.0) { float f = 1.0 - s2; o += uDentDirs[i].xyz * uDentDirs[i].w * uDentK * f * f; }
  }
  return o;
}
// gradient of the dent depth: the shading normal tilts by it (bowl walls face the bowl's centre)
vec3 labDentGrad(vec3 p) {
  vec3 g = vec3(0.0);
  for (int i = 0; i < 24; i++) {
    if (i >= uDentCount) break;
    vec3 d = p - uDents[i].xyz;
    float r = uDents[i].w;
    float s2 = dot(d, d) / (r * r);
    if (s2 < 1.0) g += -4.0 * uDentDirs[i].w * uDentK * (1.0 - s2) * d / (r * r);
  }
  return g;
}
`;
const GLSL_PARS = /* glsl */`
varying vec2 vLabUv;
uniform sampler2D uMask, uHeight, uFlakeMap;
uniform float uPaintOn, uPaintLum, uPaintRough, uPaintMetal, uPaintCoat, uTypeOn;
uniform vec3 uPaintColor, uRimColor;
uniform float uRimOn, uRimLum, uRimRough, uRimMetal, uRimFinishOn;
uniform float uFlakes, uFlakeScale, uParallax, uHeightTop;
float labDepth(vec2 uv, vec2 dx, vec2 dy) {
  return clamp((uHeightTop - textureGrad(uHeight, uv, dx, dy).r) / uHeightTop, 0.0, 1.0);
}
// steep parallax with linear refinement; tangent frame from screen-space derivatives
vec2 labParallax(vec2 uv) {
  if (uParallax <= 0.0) return uv;
  vec3 p = -vViewPosition;
  vec3 q0 = dFdx(p), q1 = dFdy(p);
  vec2 st0 = dFdx(uv), st1 = dFdy(uv);

  if (v === "damaged" && body) {
    modelRoot.updateMatrixWorld(true);
    for (const [from, to, r, d] of DENT_RAYS) {
      const o = new THREE.Vector3(...from), dir = new THREE.Vector3(...to).sub(o).normalize();
      const h = hitBody(o, dir);
      if (h) dents.push({ c: h.point.clone(), dir: h.normal.clone().negate().normalize(), r: r / 100, depth: d / 100 });
    }
  }
  uploadDents();
}
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || !S.dentClick || S.pbr === "before" || BARE) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  if (moved > 5 || performance.now() - downAt.t > 450) return; // that was a drag to orbit, not a click
  const r = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const h = hitBody(raycaster.ray.origin.clone(), raycaster.ray.direction.clone());
  if (h) addDent(h.point, h.normal);
});
function randomDents() {
  for (let k = 0, made = 0; k < 40 && made < 6; k++) {
    const a = Math.random() * Math.PI * 2, up = 0.15 + Math.random() * 0.5;
    const origin = new THREE.Vector3(Math.cos(a) * 6, 0.5 + up * 4, Math.sin(a) * 6);
    const target = new THREE.Vector3((Math.random() - 0.5) * 1.2, 0.35 + Math.random() * 0.5, (Math.random() - 0.5) * 3.6);
    const h = hitBody(origin, target.sub(origin).normalize());
    if (!h || h.point.y < 0.15) continue;
    addDent(h.point, h.normal, (8 + Math.random() * 22) / 100, (1 + Math.random() * 3.5) / 100);
    made++;
  }
}

// ---------------------------------------------------------------- loop: draw only when something changed; step quality down if it struggles
const clock = new THREE.Clock();
let frames = 0, lastStat = performance.now(), lastInfo = { calls: 0, triangles: 0 }, autoQuality = !BARE, slow = 0, autoFrom = Infinity;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (S.spin) { S.azimuth = (S.azimuth + dt * 24) % 360; ctl.azimuth?.set(S.azimuth); placeSun(); dirty = true; }
  if (S.wheels && wheels.length && !THUMB && !window.__rec) { for (const w of wheels) w.rotation.x += dt * 6; dirty = true; }
  controls.update();
  if (dirty) {
    dirty = false;
    renderer.info.reset();
    if (S.dof) bokeh.uniforms.focus.value = camera.position.distanceTo(controls.target);
    const post = S.pbr === "after" && (S.bloom || S.ssao || S.dof);
    if (post) composer.render(dt); else renderer.render(scene, camera);
    lastInfo = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
    frames++;
  }
  const now = performance.now();
  if (now - lastStat > 500) {
    const fps = (frames * 1000) / (now - lastStat);
    // (a busy card on a slow device: after about two seconds under 26 fps step down one notch, until someone picks a quality)
    if (autoQuality && now > autoFrom && frames > 5 && fps < 26 && S.quality !== "low" && document.visibilityState === "visible") {
      if (++slow >= 4) { slow = 0; S.quality = S.quality === "high" ? "medium" : "low"; ctl.quality?.set(S.quality); apply(); }
    } else slow = 0;
    note("perf", frames
      ? `${fps.toFixed(0)} fps · ${lastInfo.triangles.toLocaleString("en")} triangles · ${lastInfo.calls} draw calls · ${QUALITY[S.quality].label} quality`
      : `at rest · 0 fps · last frame ${lastInfo.triangles.toLocaleString("en")} triangles`);
    frames = 0;
    lastStat = now;
  }
});

// ---------------------------------------------------------------- start
async function init() {
  makeMaterials();
  if (!BARE) buildPanel();
  assets = await fetch(A + "assets.json").then((r) => r.json()).catch(() => ({ hdri: {} }));
  const [gltf, ao] = await Promise.all([gltfLoader.loadAsync(A + "model.glb"), tex("ao.webp", false)]);
  T.ao = ao;
  meshes = []; wheels = []; body = null;
  gltf.scene.traverse((o) => {
    if (/^Wheels?_/.test(o.name)) wheels.push(o);
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    const isGlass = o.material.name === "Glass";
    o.userData.glass = isGlass;
    if (isGlass) o.castShadow = false;
    if (o.name === "Body") body = o;
    meshes.push(o);
  });
  modelRoot = gltf.scene;
  scene.add(modelRoot);
  await Promise.all([setVariant(S.variant), setEnv(S.env)]);
  syncAll();
  apply();
  const skel = $("skeleton");
  skel.classList.add("gone");
  setTimeout(() => skel.remove(), 600);
  loadVariant(S.variant === "damaged" ? "clean" : "damaged"); // the other look, quietly, so the switch is instant
  requestAnimationFrame(() => requestAnimationFrame(() => (window.__ready = true))); // (for the board's thumbnail shot)
  autoFrom = performance.now() + 4000; // (shaders compile in the first seconds: slow frames then say nothing about the device)
}
init().catch((e) => console.error(e));
// the board's hover video, frame by frame: the camera at an angle round the car from the start view, the wheels at a turn
if (BARE) window.__orbit = (deg, wheel = 0) => {
  window.__rec = true;
  controls.autoRotate = false;
  const off = START.clone().sub(controls.target).applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(deg));
  camera.position.copy(controls.target).add(off);
  controls.update();
  for (const w of wheels) w.rotation.x = wheel;
  invalidate();
};
window.__lab = { S, apply, scene, camera, controls, mats, U, invalidate, dents, addDent, uploadDents, setVariant };
