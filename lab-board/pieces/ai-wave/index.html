<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Wave · lab</title>
<meta name="theme-color" content="#f3f2ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/lab-ui.css?v=21">
<style>
  /* The AirDrop wave on its own: a ring of light runs out across the page and fades, its edge white with a rainbow in it, a little
     light left behind, a touch of shade ahead; whatever lies under it bends like under a lens. One runs out of the middle every few
     seconds; a tap sends one from anywhere. A shader over the page (the surface drawn into a texture, the pixels really displaced). */
  :root { --font: var(--lab-font); --bg: #f3f2ee; --ink: #1b1c20; --muted: rgba(20,20,20,.45); --chip: #fff; --ease: cubic-bezier(.22,.61,.36,1);
    --page: #fff; --box: var(--bg); --morph: .55s cubic-bezier(.3,1.12,.4,1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
  body.tuning { background: var(--page); }
  .stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); touch-action: manipulation; cursor: pointer; transition: inset var(--morph), border-radius var(--morph); }
  body.tuning .stage { border-radius: 26px; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hint { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); z-index: 3; transform: translateX(-50%); margin: 0; color: var(--muted); font-size: 13px; pointer-events: none; transition: opacity .6s, left var(--morph); }
  .hint.gone { opacity: 0; }
  /* chrome, as on the other lab pieces */
  .back { position: fixed; top: 16px; left: 16px; z-index: 6; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 999px; background: var(--chip); color: var(--ink); transition: top var(--morph), left var(--morph), translate .2s var(--ease); }
  .back:hover { translate: -2px 0; } .back svg { width: 20px; height: 20px; }
  .tune { position: fixed; top: 16px; right: 16px; z-index: 6; display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 20px 0 16px; border: 0; border-radius: 999px; background: var(--chip); color: var(--ink);
    font: 600 14px var(--font); cursor: pointer; transition: transform .2s var(--ease), opacity .2s; }
  .tune:hover { transform: translateY(-1px); } .tune svg { width: 19px; height: 19px; }
  body.tuning .tune { opacity: 0; pointer-events: none; } body.tuning .back { top: 30px; left: 30px; }
  /* the panel: a card beside the stage (lab-ui soft) */
  .panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 340px; z-index: 5; display: flex; flex-direction: column; overflow: auto; overscroll-behavior: contain; padding: 0 20px; --ui-pad: 20px;
    border-radius: 26px; border: 1px solid var(--ui-card-line, rgba(20,20,20,.08)); opacity: 0; translate: 24px 0; visibility: hidden; transition: translate var(--morph), opacity .3s, visibility 0s .55s; }
  body.tuning .panel { opacity: 1; translate: 0 0; visibility: visible; transition: translate var(--morph), opacity .35s .08s; }
  .panel::-webkit-scrollbar { width: 0; }
  .lab-ui { font-family: var(--font); }
  .ph { position: sticky; top: 0; z-index: 3; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 0 -20px; padding: 22px 20px 12px; background: var(--ui-bg); }
  .ph h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; } .ph p { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--ui-muted); }
  .pc { flex: none; width: 32px; height: 32px; margin: -4px -6px 0 0; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: var(--ui-ink); cursor: pointer; } .pc:hover { background: var(--ui-field); } .pc svg { width: 18px; height: 18px; }
  .acts { position: sticky; bottom: 0; display: flex; margin: auto -20px 0; padding: 14px 20px 20px; background: var(--ui-bg); }
  @media (min-width: 761px) { body.tuning .stage { inset: 16px 368px 16px 16px; } body.tuning .hint { left: calc(50% - 176px); } }
  @media (max-width: 760px) { .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 56vh; translate: 0 calc(100% + 16px); } body.tuning .panel { translate: 0 0; }
    body.tuning .stage { inset: 8px 8px calc(56vh + 16px) 8px; border-radius: 22px; } body.tuning .hint { display: none; } }
  body.bare .back, body.bare .tune, body.bare .panel, body.bare .hint { display: none !important; }
</style>
</head>
<body>
<a class="back" href="../../" aria-label="Back to the lab" title="Back to the lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></a>
<button class="tune" id="tune" type="button" aria-controls="panel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Customize</button>
<main class="stage" id="stage" aria-label="A wave of light runs across the page. Tap to send one."><canvas id="gl" aria-hidden="true"></canvas></main>
<p class="hint" id="hint">Tap anywhere to send a wave</p>
<aside class="panel lab-ui soft" id="panel" aria-label="Customize the wave"></aside>
<script src="../../shared/lab-ui.js?v=20"></script>
<script type="module">
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), THUMB = q.has('thumb'), DEMO = q.has('demo'), BARE = THUMB || DEMO;
const KEY = 'lab.ai-wave.v2';
const DEF = { speed: 1, width: 40, strength: 1, chroma: .8, glow: 1, surface: 'plain', auto: true, every: 3.2 };
let P = (() => { const p = { ...DEF }; try { const o = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in DEF) if (typeof o[k] === typeof DEF[k]) p[k] = o[k]; } catch { } return p; })();
if (BARE && !THUMB) P = { ...DEF };
const save = () => { if (BARE) return; try { const d = {}; for (const k in P) if (P[k] !== DEF[k]) d[k] = P[k]; localStorage.setItem(KEY, JSON.stringify(d)); } catch { } };
const stage = $('stage'), cv = $('gl');

// ---------- the surface under the wave: the page's own ground (Plain), or a fine grid of dots that shows the bend (Dots) ----------
const surf = document.createElement('canvas'), g = surf.getContext('2d'); let dirty = true;
function drawSurface() { const W = stage.clientWidth, H = stage.clientHeight, d = Math.min(devicePixelRatio || 1, 2); surf.width = Math.round(W * d); surf.height = Math.round(H * d); g.setTransform(d, 0, 0, d, 0, 0);
  g.fillStyle = '#f3f2ee'; g.fillRect(0, 0, W, H);
  if (P.surface === 'dots') { g.fillStyle = 'rgba(20,20,20,.16)'; const s = 22, ox = (W % s) / 2, oy = (H % s) / 2; for (let y = oy; y < H; y += s) for (let x = ox; x < W; x += s) { g.beginPath(); g.arc(x, y, 1.1, 0, 7); g.fill(); } }
  dirty = true; }

// ---------- the wave: a shader over the surface ----------
const gl = cv.getContext('webgl2', { premultipliedAlpha: false, antialias: false, preserveDrawingBuffer: THUMB });
const VS = `#version 300 es
in vec2 aP; out vec2 vUv; void main(){ vUv = aP * .5 + .5; gl_Position = vec4(aP, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uRes; uniform vec4 uW[8]; uniform int uN; uniform float uWidth, uAmp, uChroma, uGlow, uT;
uniform vec3 uC0, uC1, uC2, uC3;
vec3 pal(float x){ x = fract(x) * 4.; vec3 a = x < 1. ? uC0 : x < 2. ? uC1 : x < 3. ? uC2 : uC3; vec3 b = x < 1. ? uC1 : x < 2. ? uC2 : x < 3. ? uC3 : uC0; float f = fract(x); return mix(a, b, f * f * (3. - 2. * f)); }
vec3 tex(vec2 p){ return texture(uTex, vec2(p.x / uRes.x, 1. - p.y / uRes.y)).rgb; }
void main(){
  vec2 P = vec2(vUv.x, 1. - vUv.y) * uRes;
  vec2 disp = vec2(0.); float ring = 0., wash = 0., shade = 0.; vec3 rc = vec3(0.);
  for (int i = 0; i < 8; i++) { if (i >= uN) break; vec4 w = uW[i]; vec2 d = P - w.xy; float L = length(d); vec2 dir = d / max(L, 1.);
    float x = (L - w.z) / uWidth, gss = exp(-x * x), s = w.w;
    // a lens: what is just ahead is pushed out, what is just behind is pulled in; a bright edge; a little light left behind, a touch of shade ahead
    disp += dir * (-2. * x * gss) * uAmp * s; ring += gss * s; wash += smoothstep(.6, -5., x) * smoothstep(-14., -5., x) * s; shade += exp(-(x - 1.6) * (x - 1.6) * 1.5) * s;
    rc += pal(atan(d.y, d.x) / 6.283 + w.z * .0015 + uT * .05) * gss * s; }
  float ca = uChroma * .45;
  vec3 col = vec3(tex(P - disp * (1. + ca)).r, tex(P - disp).g, tex(P - disp * (1. - ca)).b);
  vec3 rim = mix(vec3(1.), rc / max(ring, 1e-3), .3 + .35 * uChroma);
  col *= 1. - shade * .05 * uAmp / 26.;
  col = mix(col, vec3(1.), clamp(wash * .05 * uGlow, 0., .4));
  col = mix(col, rim, clamp(ring * .42 * uGlow, 0., .8)); col += rim * ring * .1 * uGlow;
  o = vec4(col, 1.); }`;
let prog, U = {}, texture;
function sh(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
if (gl) { prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS); for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(prog, i).name; U[nm.replace('[0]', '')] = gl.getUniformLocation(prog, nm); }
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, 'aP'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  texture = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texture); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); }
const hex = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const COLS = ['#7b5cff', '#2ec5ff', '#ff6fd8', '#ffc56e'].map(hex);

// ---------- the waves: born at a point, the front runs out across the page and fades ----------
const waves = [];
function wave(x, y, strength = 1, at = performance.now() / 1000) { if (waves.length >= 8) waves.shift(); waves.push({ x, y, born: at, strength }); }
const fromMiddle = s => wave(stage.clientWidth / 2, stage.clientHeight / 2, s);
let next = 0;
stage.addEventListener('pointerdown', e => { if (e.button > 0) return; const r = stage.getBoundingClientRect(); wave(e.clientX - r.left, e.clientY - r.top, 1); next = performance.now() / 1000 + P.every; $('hint').classList.add('gone'); });

// ---------- the loop ----------
function frame(ms, still) { if (!still) requestAnimationFrame(frame); if (!gl) return; const now = still ?? ms / 1000;
  const W = stage.clientWidth, H = stage.clientHeight, d = Math.min(devicePixelRatio || 1, 2);
  if (cv.width !== Math.round(W * d) || cv.height !== Math.round(H * d)) { cv.width = Math.round(W * d); cv.height = Math.round(H * d); drawSurface(); }
  if (dirty) { gl.bindTexture(gl.TEXTURE_2D, texture); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, surf); dirty = false; }
  // (every few seconds a wave runs out of the middle, while nobody sends one)
  if (!THUMB && P.auto && now >= next) { fromMiddle(1); next = now + P.every; }
  // (the front crosses the page in about a second at 1×, gathering speed; it fades as it reaches the far corner)
  const diag = Math.hypot(W, H), sp = diag / 1.05 * P.speed, arr = new Float32Array(32); let n = 0;
  for (let i = waves.length - 1; i >= 0; i--) { const w = waves[i], age = now - w.born, far = Math.max(Math.hypot(w.x, w.y), Math.hypot(W - w.x, w.y), Math.hypot(w.x, H - w.y), Math.hypot(W - w.x, H - w.y));
    if (age * sp * (1 + age * .35) > far * 1.15) waves.splice(i, 1); }
  for (const w of waves) { const age = now - w.born, travel = age * sp * (1 + age * .35), far = Math.max(Math.hypot(w.x, w.y), Math.hypot(W - w.x, w.y), Math.hypot(w.x, H - w.y), Math.hypot(W - w.x, H - w.y));
    const k = Math.min(1, travel / far), s = w.strength * Math.min(1, age / .08) * (1 - Math.pow(k, 2.2));
    arr.set([w.x * d, w.y * d, travel * d, Math.max(0, s)], n * 4); n++; }
  gl.viewport(0, 0, cv.width, cv.height); gl.useProgram(prog);
  gl.uniform2f(U.uRes, cv.width, cv.height); gl.uniform4fv(U.uW, arr); gl.uniform1i(U.uN, n);
  gl.uniform1f(U.uWidth, P.width * d); gl.uniform1f(U.uAmp, 15 * P.strength * d); gl.uniform1f(U.uChroma, P.chroma); gl.uniform1f(U.uGlow, P.glow); gl.uniform1f(U.uT, now);
  COLS.forEach((c, i) => gl.uniform3f(U['uC' + i], ...c)); gl.uniform1i(U.uTex, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }

// ---------- the panel ----------
const panel = $('panel'), ctl = {};
function buildPanel() { panel.innerHTML = '';
  const head = document.createElement('header'); head.className = 'ph'; head.innerHTML = '<div><h2>Tune</h2><p>The AirDrop wave. Tap the page to send one from anywhere.</p></div><button class="pc" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  head.querySelector('.pc').onclick = () => openPanel(false); panel.appendChild(head);
  const set = (k, v) => { P[k] = v; save(); }, show = () => fromMiddle(1);
  const g1 = LabUI.group(panel, 'Wave', { key: KEY + '.g.wave', open: true });
  ctl.speed = LabUI.slider(g1, { label: 'Speed', min: .4, max: 2, step: .05, unit: '×', value: P.speed, def: DEF.speed, onInput: v => set('speed', v), onChange: show });
  ctl.width = LabUI.slider(g1, { label: 'Width', min: 20, max: 160, step: 1, unit: 'px', value: P.width, def: DEF.width, onInput: v => set('width', v), onChange: show });
  ctl.strength = LabUI.slider(g1, { label: 'Bend', min: 0, max: 2, step: .05, unit: '×', value: P.strength, def: DEF.strength, onInput: v => set('strength', v), onChange: show });
  ctl.chroma = LabUI.slider(g1, { label: 'Rainbow', min: 0, max: 1.5, step: .05, unit: '', value: P.chroma, def: DEF.chroma, onInput: v => set('chroma', v), onChange: show });
  ctl.glow = LabUI.slider(g1, { label: 'Light', min: 0, max: 1.5, step: .05, unit: '', value: P.glow, def: DEF.glow, onInput: v => set('glow', v), onChange: show });
  ctl.surface = LabUI.seg(g1, { label: 'Under it', options: [['plain', 'Plain'], ['dots', 'Dots']], value: P.surface, onChange: v => { set('surface', v); drawSurface(); show(); } });
  const g2 = LabUI.group(panel, 'On its own', { key: KEY + '.g.auto', open: true });
  ctl.auto = LabUI.check(g2, { label: 'A wave from the middle every few seconds', value: P.auto, onChange: v => set('auto', v) });
  ctl.every = LabUI.slider(g2, { label: 'Every', min: 1.5, max: 8, step: .1, unit: 's', value: P.every, def: DEF.every, onInput: v => set('every', v) });
  const acts = document.createElement('div'); acts.className = 'acts'; acts.innerHTML = '<button type="button" id="reset">Reset</button>'; panel.appendChild(acts);
  acts.querySelector('#reset').onclick = () => { P = { ...DEF }; save(); for (const k in ctl) ctl[k].set?.(P[k]); drawSurface(); }; }
function openPanel(on) { document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);
addEventListener('keydown', e => { if (e.target.closest?.('input, .panel')) return; if (e.key === ' ') { e.preventDefault(); fromMiddle(1); } else if (e.key === 'Escape') openPanel(false); });
new ResizeObserver(() => drawSurface()).observe(stage);

// ---------- start (?thumb=1: the board's still, a wave half way out of the middle; ?demo=1: waves on their own) ----------
if (BARE) document.body.classList.add('bare'); else buildPanel();
drawSurface();
if (THUMB) { const W = stage.clientWidth, H = stage.clientHeight; wave(W / 2, H / 2, 1, 0); const draw = () => frame(0, +(q.get('t') || .24)); draw(); new ResizeObserver(draw).observe(stage); }
else requestAnimationFrame(frame);
window.WAVE = { get P() { return P; }, wave, fromMiddle, waves };
</script>
</body>
</html>
