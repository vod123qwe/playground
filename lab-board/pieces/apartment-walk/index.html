<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apartment Walk · lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/lab-ui.css">
<style>
  :root{ --ink:#1b1c20; --muted:rgba(20,20,20,.5); --line:rgba(20,20,20,.1); --ease:cubic-bezier(.22,.61,.36,1); }
  *{box-sizing:border-box}
  html, body{margin:0; height:100%; overflow:hidden; background:#e8e5df; color:var(--ink); font:500 13.5px/1.4 "Inter", system-ui, sans-serif; -webkit-font-smoothing:antialiased}
  #gl{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none}
  body.walk #gl{cursor:grab} body.walk.looking #gl{cursor:grabbing}
  button{font:inherit; color:inherit}

  /* chrome: white pills, the same family as the other lab pieces */
  .pill{display:flex; align-items:center; gap:9px; height:46px; padding:0 20px 0 16px; border:0; border-radius:999px; background:#fff; color:var(--ink); font-weight:600; cursor:pointer}
  .pill svg{width:19px; height:19px}
  .pill:focus-visible, .icon:focus-visible, .modes button:focus-visible{outline:2px solid rgba(20,20,20,.35); outline-offset:2px}
  .icon{display:grid; place-items:center; width:46px; height:46px; border:0; border-radius:999px; background:#fff; color:var(--ink); cursor:pointer}
  .icon svg{width:20px; height:20px}
  .back{position:fixed; top:16px; left:16px; z-index:5; text-decoration:none}
  .tr{position:fixed; top:16px; right:16px; z-index:5; display:flex; gap:8px; transition:right .45s var(--ease)}
  body.tuning .tr .tune{display:none}
  @media (min-width:761px){ body.tuning .tr{right:400px} }

  /* overview | walk, bottom centre */
  .dock{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:4; transform:translateX(-50%); transition:left .45s var(--ease)}
  @media (min-width:761px){ body.tuning .dock{left:calc(50% - 192px)} }
  .modes{position:relative; display:flex; gap:0; height:46px; padding:5px; border-radius:999px; background:#fff}
  .modes button{position:relative; z-index:1; display:flex; align-items:center; gap:8px; height:36px; padding:0 16px 0 13px; border:0; border-radius:999px; background:transparent; font-weight:600; color:rgba(20,20,20,.62); cursor:pointer; transition:color .3s ease}
  .modes button svg{width:18px; height:18px}
  .modes button[aria-pressed=true]{color:#fff}
  .modes i{position:absolute; top:5px; left:5px; height:36px; border-radius:999px; background:var(--ink); transition:transform .45s var(--ease), width .45s var(--ease)}

  /* the hint, bottom left */
  .hint{position:fixed; left:16px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:4; display:flex; align-items:center; gap:10px; height:46px; padding:0 16px;
        border-radius:999px; box-shadow:inset 0 0 0 1.5px rgba(20,20,20,.18); color:rgba(20,20,20,.7); font-size:12.5px; font-weight:600; white-space:nowrap}
  .hint kbd{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 5px; border-radius:6px; background:rgba(20,20,20,.07); font:600 11px/1 "Inter", sans-serif}
  @media (max-width:760px){ .hint{bottom:calc(76px + env(safe-area-inset-bottom)); height:38px; font-size:12px} }
  @media (pointer:coarse){ .hint .keys{display:none} } @media (pointer:fine){ .hint .touch{display:none} }

  /* room names over the model (overview) and the room you are in (walk) */
  .overlay{position:fixed; inset:0; z-index:3; pointer-events:none}
  .rl{position:absolute; left:0; top:0; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.9); text-align:center; white-space:nowrap; transition:opacity .35s ease}
  .rl b{display:block; font-size:12px; font-weight:600; line-height:1.2} .rl small{display:block; color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
  body.walk .rl, body.nolabels .rl{opacity:0}
  .here{position:fixed; top:16px; left:50%; z-index:4; transform:translate(-50%, -8px); display:flex; align-items:center; gap:8px; height:46px; padding:0 18px; border-radius:999px;
        background:#fff; font-weight:600; opacity:0; transition:opacity .35s ease, transform .45s var(--ease); pointer-events:none; white-space:nowrap}
  .here small{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
  body.walk .here.on{opacity:1; transform:translate(-50%, 0)}
  @media (max-width:760px){ .here{top:70px} }

  /* the minimap (walk) */
  .mini{position:fixed; top:72px; left:16px; z-index:4; width:196px; height:180px; border-radius:18px; background:#fff; opacity:0; visibility:hidden; transform:translateY(-6px);
        transition:opacity .35s ease, transform .45s var(--ease), visibility 0s linear .45s; cursor:crosshair}
  body.walk .mini{opacity:1; visibility:visible; transform:none; transition:opacity .35s ease, transform .45s var(--ease), visibility 0s}
  @media (max-width:760px){ .mini{width:132px; height:122px; top:auto; bottom:calc(128px + env(safe-area-inset-bottom)); left:auto; right:16px} }

  /* the stick on touch screens (walk) */
  .stick{position:fixed; left:28px; bottom:calc(128px + env(safe-area-inset-bottom)); z-index:4; width:116px; height:116px; border-radius:50%; background:rgba(255,255,255,.55);
         box-shadow:inset 0 0 0 1.5px rgba(20,20,20,.14); touch-action:none; display:none}
  .stick i{position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px rgba(20,20,20,.12)}
  @media (pointer:coarse){ body.walk .stick{display:block} }

  /* the panel */
  .panel{--ui-pad:28px; position:fixed; top:0; right:0; bottom:0; z-index:6; width:384px; overflow:auto; padding:0 28px 28px; background:#fff; box-shadow:-1px 0 0 var(--line);
         transform:translateX(100%); visibility:hidden; transition:transform .45s var(--ease), visibility 0s linear .45s; overscroll-behavior:contain}
  body.tuning .panel{transform:none; visibility:visible; transition:transform .45s var(--ease)}
  @media (max-width:760px){ .panel{top:auto; left:0; width:auto; height:62vh; transform:translateY(100%)} }
  .ph{position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:flex-start; margin:0 -28px; padding:28px 28px 20px; background:#fff; border-bottom:1px solid var(--line)}
  .ph h2{margin:0; font-size:20px; font-weight:600} .ph p{margin:4px 0 0; color:var(--muted); font-size:12.5px}
  .ph button{width:32px; height:32px; border:0; background:transparent; cursor:pointer; display:grid; place-items:center} .ph svg{width:20px; height:20px}
  .facts{margin:0 -28px; padding:16px 28px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr auto; gap:6px 12px; font-size:12.5px}
  .facts span{color:rgba(20,20,20,.7)} .facts b{font-weight:600; font-variant-numeric:tabular-nums; text-align:right}
  .note{color:var(--muted); font-size:12px; margin:8px 0 0}

  .loading{position:fixed; inset:0; z-index:8; display:grid; place-items:center; pointer-events:none; color:var(--muted); font-weight:600; transition:opacity .5s ease}
  body.ready .loading{opacity:0}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
<body>
<canvas id="gl" tabindex="0" aria-label="The apartment in 3D"></canvas>
<div class="loading" id="loading">Laying the floors…</div>
<div class="overlay" id="overlay"></div>

<a class="icon back" href="../../" aria-label="Back to the lab" title="Back to the lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></a>
<div class="here" id="here" aria-live="polite"><span id="here-n"></span><small id="here-a"></small></div>
<canvas class="mini" id="mini" width="392" height="360" aria-label="Minimap: click to move there"></canvas>
<div class="stick" id="stick" aria-hidden="true"><i></i></div>

<div class="tr">
  <button class="pill tune" id="tune" type="button" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Customize</span>
  </button>
</div>

<div class="dock"><div class="modes" role="group" aria-label="View">
  <i id="modes-i" aria-hidden="true"></i>
  <button type="button" id="m-over" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Overview</button>
  <button type="button" id="m-walk" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="1.8"/><path d="M9 21l2.5-6.5L14 17v4M8 11.5l3-3.5h3l2.5 3.5M11.5 14.5 12 8"/></svg>Walk</button>
</div></div>

<div class="hint" id="hint" aria-live="polite"></div>
<aside class="panel lab-ui" id="panel" aria-label="Customize the view"></aside>

<script src="../../shared/lab-ui.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- the flat: walls, openings, balconies, rooms, all in centimetres (tools/extract_plan.py) ----------
const A = await (await fetch('apartment.json')).json();
const H = A.height, M = .01;                                      // cm → m
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const all = [...A.floor.outer, ...A.balconies.flatMap(b => b.outer)];
const CX = (Math.min(...all.map(p => p[0])) + Math.max(...all.map(p => p[0]))) / 2, CZ = (Math.min(...all.map(p => p[1])) + Math.max(...all.map(p => p[1]))) / 2;
const wx = x => (x - CX) * M, wz = z => (z - CZ) * M;               // plan → world (metres, centred)
const px = x => x / M + CX, pz = z => z / M + CZ;                   // world → plan
const shoelace = ps => Math.abs(ps.reduce((s, p, i) => { const q = ps[(i + 1) % ps.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2;

const S = { cut: 255, plan: false, planOp: .75, labels: true, thick: true, eye: 165, speed: 1.4, fov: 72, ceiling: true, sun: 35, exposure: 1 };
const DEF = { ...S };

// ---------- renderer, scene, light ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e8e5df');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .55;
const hemi = new THREE.HemisphereLight('#fffaf2', '#cbbfae', .6); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff1dc', 2.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004; sun.shadow.normalBias = .02;
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: .5, far: 60 });
scene.add(sun, sun.target);
function placeSun() {                                             // the sun comes in through the long facade; the slider turns it round
  const a = THREE.MathUtils.degToRad(S.sun), out = new THREE.Vector2(.7902, -.6128);   // the facade faces up and to the right on the drawing
  const d = new THREE.Vector3(out.x * Math.cos(a) - out.y * Math.sin(a), 0, out.x * Math.sin(a) + out.y * Math.cos(a)).normalize();
  sun.position.set(d.x * 18, 14, d.z * 18);
}

const camera = new THREE.PerspectiveCamera(40, 1, .05, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08; controls.maxPolarAngle = 1.35; controls.minDistance = 4; controls.maxDistance = 40;
controls.target.set(0, 0, 0);
camera.position.set(9.5, 17.5, 15);

// ---------- materials ----------
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), H * M);
const clip = { clippingPlanes: [cutPlane], clipShadows: true };
const mat = {
  wall: new THREE.MeshStandardMaterial({ color: '#f5f3ef', roughness: .92, ...clip }),
  thick: new THREE.MeshStandardMaterial({ color: '#e6e0d7', roughness: .92, ...clip }),
  floor: new THREE.MeshStandardMaterial({ color: '#dccbb2', roughness: .78 }),
  balcony: new THREE.MeshStandardMaterial({ color: '#cfcac3', roughness: .9 }),
  ceiling: new THREE.MeshStandardMaterial({ color: '#fbfaf8', roughness: .95, side: THREE.DoubleSide }),
  frame: new THREE.MeshStandardMaterial({ color: '#3a3b40', roughness: .5, metalness: .2, ...clip }),
  cap: new THREE.MeshBasicMaterial({ color: '#1b1c20' }),
  capThin: new THREE.MeshBasicMaterial({ color: '#1b1c20' }),
  rail: new THREE.MeshStandardMaterial({ color: '#dfeef0', roughness: .05, transparent: true, opacity: .28, depthWrite: false, side: THREE.DoubleSide }),
  frosted: new THREE.MeshStandardMaterial({ color: '#f3f5f5', roughness: .85, transparent: true, opacity: .8, depthWrite: false, side: THREE.DoubleSide }),
  alu: new THREE.MeshStandardMaterial({ color: '#b9bcbf', roughness: .38, metalness: .75 }),
  jamb: new THREE.MeshStandardMaterial({ color: '#f6f5f2', roughness: .55, ...clip }),
  front: new THREE.MeshStandardMaterial({ color: '#43454a', roughness: .5, metalness: .1, ...clip }),
  nickel: new THREE.MeshStandardMaterial({ color: '#cfc9bf', roughness: .32, metalness: 1, ...clip }),
};
const glassMat = () => new THREE.MeshStandardMaterial({ color: '#d6ecef', roughness: .04, metalness: .1, transparent: true, opacity: .22, depthWrite: false, side: THREE.DoubleSide, ...clip });

// ---------- geometry ----------
const shape = (outer, holes = []) => {
  const s = new THREE.Shape(outer.map(p => new THREE.Vector2(wx(p[0]), -wz(p[1]))));
  for (const h of holes) s.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(wx(p[0]), -wz(p[1])))));
  return s;
};
function prism(outer, holes, y0, y1, m, shadows = true) {           // a plan polygon, extruded from y0 to y1 (cm)
  const g = new THREE.ExtrudeGeometry(shape(outer, holes), { depth: (y1 - y0) * M, bevelEnabled: false, curveSegments: 1 });
  g.rotateX(-Math.PI / 2); g.translate(0, y0 * M, 0);
  const mesh = new THREE.Mesh(g, m); mesh.castShadow = shadows; mesh.receiveShadow = true; return mesh;
}
function flat(outer, holes, y, m) {
  const g = new THREE.ShapeGeometry(shape(outer, holes)); g.rotateX(-Math.PI / 2); g.translate(0, y * M, 0);
  return new THREE.Mesh(g, m);
}
const world = new THREE.Group(); scene.add(world);
const wallsG = new THREE.Group(), capsG = new THREE.Group(), glassG = [], labelsAt = [];
world.add(wallsG, capsG);

// walls: thick (outer, structural) and thin (partitions), taken from the drawing
const wallMeshes = [];
for (const p of A.walls) { const m = prism(p.outer, p.holes, 0, H, mat.wall); wallsG.add(m); wallMeshes.push(m); }   // one outline per wall: the faces run through, no seams
// openings: a sill below, a lintel above; glass and a slim frame in the facade ones
// ---------- windows and balcony doors: white inside, graphite outside; the leaves that open, open ----------
// per opening, left to right along the wall: turn = a side-hung leaf (hinge at its start 0 / end 1), tilt = hinged at the bottom, the top tips in
const SASH = {
  'O17 balcony door + window 270': [{}, { turn: 0 }, { turn: 1 }],   // three leaves: the left one fixed, the middle and the right open inwards, wide
  'O22 balcony door 90': [{ turn: 0 }],
  'O25 window 180, sill 30': { transom: 94, below: [{ tilt: true }], above: [{}, {}] },   // a low horizontal pane that tilts, two fixed above
  'O21 balcony door 90': [{ turn: 0 }],
  'balcony door 113': [{ turn: 1 }],
  'balcony door 180': [{ turn: 0 }, {}],
  'balcony door 270': [{}, {}, { turn: 1 }],
};
const sashes = [];
const pip = (x, z, ps) => { let c = false; for (let i = 0, j = ps.length - 1; i < ps.length; j = i++) { const [xi, zi] = ps[i], [xj, zj] = ps[j]; if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c; } return c; };
const whiteFrame = new THREE.MeshStandardMaterial({ color: '#f4f4f2', roughness: .45, ...clip });
const winHandle = new THREE.MeshStandardMaterial({ color: '#f7f7f5', roughness: .3, ...clip });
function buildGlazing(o) {
  const [q0, q1, q2, q3] = o.quad, a = [(q0[0] + q3[0]) / 2, (q0[1] + q3[1]) / 2], b = [(q1[0] + q2[0]) / 2, (q1[1] + q2[1]) / 2];
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]), e = [(b[0] - a[0]) / len, (b[1] - a[1]) / len];
  let n = [-e[1], e[0]]; const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  if (!pip(mid[0] + n[0] * 45, mid[1] + n[1] * 45, A.floor.outer)) n = [-n[0], -n[1]];   // n points into the flat
  const G = new THREE.Group(), th = Math.atan2(-e[1], e[0]); G.position.set(wx(a[0]), 0, wz(a[1])); G.rotation.y = th; world.add(G);
  const sI = Math.sign(-e[1] * n[0] + e[0] * n[1]) || 1;           // local +z is inside when sI = 1
  // a bar in two halves: the inside one white, the outside one graphite (x, y: centre in the plane; w, h: size; depth 7 cm)
  const bar = (parent, w, h, x, y) => {
    for (const [m, z] of [[whiteFrame, 1.75], [mat.frame, -1.75]]) { const k = new THREE.Mesh(new THREE.BoxGeometry(w * M, h * M, 3.5 * M), m); k.position.set(x * M, y * M, sI * z * M); k.castShadow = true; parent.add(k); }
  };
  const F = 6, SW = 6, y0 = o.sill, y1 = o.head;
  bar(G, len, F, len / 2, y1 - F / 2); bar(G, len, F, len / 2, y0 + F / 2); bar(G, F, y1 - y0, F / 2, (y0 + y1) / 2); bar(G, F, y1 - y0, len - F / 2, (y0 + y1) / 2);   // the fixed frame
  const spec = SASH[o.name] || Array.from({ length: o.panes || 1 }, () => ({}));
  const rows = Array.isArray(spec) ? [{ lo: y0 + F, hi: y1 - F, leaves: spec }] : [{ lo: y0 + F, hi: spec.transom - 3, leaves: spec.below }, { lo: spec.transom + 3, hi: y1 - F, leaves: spec.above }];
  if (!Array.isArray(spec)) bar(G, len - 2 * F, 6, len / 2, spec.transom);   // the transom
  for (const row of rows) {
    const nL = row.leaves.length, lw = (len - 2 * F) / nL, lh = row.hi - row.lo;
    row.leaves.forEach((L, i) => {
      const x0 = F + i * lw, hinge = L.turn === 1 ? x0 + lw : x0, hs = L.turn === 1 ? -1 : 1;   // hs: the leaf runs from the hinge towards +x or -x
      const pivot = new THREE.Group();
      if (L.tilt) pivot.position.set(x0 * M, row.lo * M, sI * 3.5 * M); else pivot.position.set(hinge * M, row.lo * M, sI * 3.5 * M);
      G.add(pivot);
      const inner = new THREE.Group(); inner.position.set(0, 0, -sI * 3.5 * M); pivot.add(inner);   // the sash, drawn from the pivot on the inside face
      const cx = L.tilt ? lw / 2 : hs * lw / 2;
      bar(inner, lw, SW, cx, lh - SW / 2); bar(inner, lw, SW, cx, SW / 2); bar(inner, SW, lh, cx - lw / 2 + SW / 2, lh / 2); bar(inner, SW, lh, cx + lw / 2 - SW / 2, lh / 2);
      const glass = new THREE.Mesh(new THREE.PlaneGeometry((lw - 2 * SW) * M, (lh - 2 * SW) * M), glassMat()); glass.position.set(cx * M, lh / 2 * M, 0); inner.add(glass); glassG.push(glass);
      const open = L.turn != null || L.tilt;
      if (open) {                                                    // a white window handle on the inside: on the lock stile, or on top for the tilting pane
        const hx = L.tilt ? lw / 2 : hs * (lw - SW / 2), hy = L.tilt ? lh - SW / 2 : Math.min(105 - row.lo, lh / 2), hg = new THREE.Group();
        hg.position.set(hx * M, hy * M, sI * 3.7 * M); inner.add(hg);
        const rose = new THREE.Mesh(new THREE.BoxGeometry(.03, .075, .012), winHandle); rose.position.z = sI * .006; hg.add(rose);
        const lever = new THREE.Mesh(new THREE.BoxGeometry(.022, .12, .018), winHandle); lever.position.set(0, L.tilt ? .0 : -.055, sI * .03); if (L.tilt) lever.rotation.z = Math.PI / 2; hg.add(lever);
      }
      // for collisions (plan cm): the leaf as a segment from its hinge; fixed ones never move
      const ph = L.tilt ? [a[0] + e[0] * x0, a[1] + e[1] * x0] : [a[0] + e[0] * hinge, a[1] + e[1] * hinge];
      const dir = L.tilt ? e : [e[0] * hs, e[1] * hs];
      const leafMesh = glass;
      const sash = { o, pivot, leaf: leafMesh, ph, dir, side: n, lw, f: 0, to: 0, kind: L.tilt ? 'tilt' : L.turn != null ? 'turn' : 'fixed', sI, hs, high: row.lo > 60 };
      leafMesh.userData.door = sash; sashes.push(sash);
    });
  }
}
const caps = [];                                                   // the cut surfaces, drawn black like the plan
for (const p of A.walls) caps.push({ poly: p, lo: 0, hi: H, m: mat.cap });

  g.fillStyle = '#f4efe7'; g.beginPath(); path(A.floor.outer); g.fill();
  const here = roomAt(P.x, P.z); if (here) { g.fillStyle = 'rgba(27,28,32,.07)'; g.beginPath(); path(here.outline); g.fill(); }
  g.fillStyle = '#1b1c20'; for (const p of A.walls) { g.beginPath(); path(p.outer); p.holes.forEach(path); g.fill('evenodd'); }
  const x = P.x * s + ox, z = P.z * s + oz, half = THREE.MathUtils.degToRad(S.fov) * .55;
  const grd = g.createRadialGradient(x, z, 0, x, z, 56); grd.addColorStop(0, 'rgba(47,111,235,.35)'); grd.addColorStop(1, 'rgba(47,111,235,0)');
  g.fillStyle = grd; g.beginPath(); g.moveTo(x, z); g.arc(x, z, 56, P.yaw - half, P.yaw + half); g.closePath(); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, z, 8, 0, 7); g.fill(); g.fillStyle = '#2f6feb'; g.beginPath(); g.arc(x, z, 5.5, 0, 7); g.fill();
}
mini.addEventListener('click', e => {
  const r = mini.getBoundingClientRect(), { s, ox, oz } = MF;
  const x = ((e.clientX - r.left) / r.width * mini.width - ox) / s, z = ((e.clientY - r.top) / r.height * mini.height - oz) / s;
  if (clear(x, z)) { P.x = x; P.z = z; P.vx = P.vz = 0; }
});

// ---------- chrome ----------
const mOver = document.getElementById('m-over'), mWalk = document.getElementById('m-walk'), modesI = document.getElementById('modes-i');
function paintModes() {
  mOver.setAttribute('aria-pressed', String(mode === 'over')); mWalk.setAttribute('aria-pressed', String(mode === 'walk'));
  const b = mode === 'walk' ? mWalk : mOver; modesI.style.width = b.offsetWidth + 'px'; modesI.style.transform = `translateX(${b.offsetLeft - 5}px)`;
}
mOver.addEventListener('click', () => setMode('over')); mWalk.addEventListener('click', () => setMode('walk'));
const hint = document.getElementById('hint');
function paintHint() {
  hint.innerHTML = mode === 'walk'
    ? `<span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · drag to look · <kbd>Shift</kbd> run · <kbd>E</kbd> door</span><span class="touch">Stick to walk · drag to look</span>`
    : `<span class="keys">Drag to orbit · double-click a room to walk in</span><span class="touch">Drag to orbit · double-tap a room to walk in</span>`;
}
const here = document.getElementById('here'), hereN = document.getElementById('here-n'), hereA = document.getElementById('here-a');
let lastRoom = null;

// ---------- the panel ----------
const panel = document.getElementById('panel'), tune = document.getElementById('tune');
const total = A.rooms.reduce((s, r) => s + r.area, 0), balc = ROOMS.filter(r => r.name === 'Balcony').reduce((s, r) => s + r.area, 0);
panel.innerHTML = `<div class="ph"><div><h2>Apartment</h2><p>Built from the floor plan, in real centimetres</p></div><button type="button" id="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div class="facts"><span>Rooms (to the wall faces)</span><b>${total.toFixed(1)} m²</b><span>Balconies</span><b>${balc.toFixed(1)} m²</b><span>Clear height</span><b>${(H / 100).toFixed(2)} m</b><span>Openings</span><b>${A.openings.filter(o => o.glazed).length} facade · ${A.openings.filter(o => !o.glazed).length} doors</b></div>`;
const open = on => { document.body.classList.toggle('tuning', on); tune.setAttribute('aria-expanded', String(on)); };
tune.addEventListener('click', () => open(true)); panel.querySelector('#close').addEventListener('click', () => open(false));
const ctl = {};
{
  let g = LabUI.group(panel, 'View', { key: 'lab.aw.group.view' });
  ctl.cut = LabUI.slider(g, { label: 'Cut the walls at', min: 40, max: 255, step: 5, unit: ' cm', value: S.cut, def: DEF.cut, onInput: v => { S.cut = v; if (mode === 'over' && !tween) applyCut(v); } });
  ctl.labels = LabUI.check(g, { label: 'Room names', value: S.labels, onChange: v => { S.labels = v; document.body.classList.toggle('nolabels', !v); } });
  ctl.thick = LabUI.check(g, { label: 'Mark thick walls', value: S.thick, onChange: v => { S.thick = v; paintWalls(); } });
  ctl.plan = LabUI.check(g, { label: 'Floor plan on the floor', value: S.plan, onChange: v => { S.plan = v; plan.visible = v; } });
  ctl.planOp = LabUI.slider(g, { label: 'Plan opacity', min: .1, max: 1, step: .05, value: S.planOp, def: DEF.planOp, onInput: v => { S.planOp = v; plan.material.opacity = v; } });
  g = LabUI.group(panel, 'Walk', { key: 'lab.aw.group.walk' });
  ctl.eye = LabUI.slider(g, { label: 'Eye height', min: 110, max: 195, step: 1, unit: ' cm', value: S.eye, def: DEF.eye, onInput: v => { S.eye = v; } });
  ctl.speed = LabUI.slider(g, { label: 'Speed', min: .5, max: 3, step: .1, unit: ' m/s', value: S.speed, def: DEF.speed, onInput: v => { S.speed = v; } });
  ctl.fov = LabUI.slider(g, { label: 'Field of view', min: 50, max: 100, step: 1, unit: '°', value: S.fov, def: DEF.fov, onInput: v => { S.fov = v; if (mode === 'walk' && !tween) { camera.fov = v; camera.updateProjectionMatrix(); } } });
  ctl.ceiling = LabUI.check(g, { label: 'Ceiling', value: S.ceiling, onChange: v => { S.ceiling = v; } });
  g = LabUI.group(panel, 'Doors', { key: 'lab.aw.group.doors' });
  ctl.doors = LabUI.seg(g, { label: 'All doors', options: [['built', 'As left'], ['open', 'Open'], ['closed', 'Closed']], value: 'built',
    onChange: v => { for (const dr of doors) if (dr.kind !== 'fixed') dr.to = v === 'open' ? 1 : v === 'closed' ? 0 : (dr.hidden || dr.front || dr.kind ? 0 : 1); } });
  const dn = document.createElement('p'); dn.className = 'note';
  dn.textContent = 'Porta Vector V, flush, white, 80 cm; Metal-Bud Rumba handles, satin nickel. The pantry and the laundry have hidden doors, flush with the wall. Windows and balcony doors: white inside, graphite outside; the opening leaves open too (the low pane in the bedroom window tilts). Click a leaf or press E to open or close it; walking into a closed door opens it.';
  g.appendChild(dn);
  g = LabUI.group(panel, 'Light', { key: 'lab.aw.group.light' });
  ctl.sun = LabUI.slider(g, { label: 'Sun direction', min: -90, max: 90, step: 1, unit: '°', value: S.sun, def: DEF.sun, onInput: v => { S.sun = v; placeSun(); } });
  ctl.exposure = LabUI.slider(g, { label: 'Exposure', min: .5, max: 1.8, step: .05, value: S.exposure, def: DEF.exposure, onInput: v => { S.exposure = v; renderer.toneMappingExposure = v; } });
  const note = document.createElement('p'); note.className = 'note';
  note.textContent = 'Walls, piers and openings are traced from the furnished plan (1 cm = 1.209 px) and checked against the architect’s sizes: 270, 90, 180 and 90 cm in the facade. Heights: 2.55 m clear, doors 205 cm, balcony doors 242 cm.';
  panel.appendChild(note);
}
function paintWalls() { mat.capThin.color.set('#6d6f76'); buildCaps(); }
function applyCut(v) { S.cutNow = v; cutPlane.constant = Math.min(v, H + 1) * M + .0005; buildCaps(); }

// ---------- frame ----------
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); paintModes();
}
addEventListener('resize', resize);
const v = new THREE.Vector3();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, to = tween.to();
    camera.position.lerpVectors(tween.from.pos, to.pos, e); camera.quaternion.slerpQuaternions(tween.from.q, to.q, e);
    camera.fov = tween.from.fov + (to.fov - tween.from.fov) * e; camera.updateProjectionMatrix();
    const cut = tween.from.cut + (to.cut - tween.from.cut) * e; if (Math.abs(cut - (S.cutNow ?? -1)) > .5 || k === 1) applyCut(cut);
    if (k === 1) { tween = null; if (mode === 'over') { controls.target.copy(overPose.target); controls.enabled = true; controls.update(); } }
  } else if (mode === 'walk') {
    stepWalk(dt); const e = eyePose(); camera.position.copy(e.pos); camera.quaternion.copy(e.q);
  } else controls.update();
  for (const dr of doors) {
    if (dr.f !== dr.to) { const k = reduce ? 1 : Math.min(1, dt * 2.6); dr.f += Math.sign(dr.to - dr.f) * Math.min(Math.abs(dr.to - dr.f), k * (.35 + Math.abs(dr.to - dr.f))); if (Math.abs(dr.to - dr.f) < .002) dr.f = dr.to; }
    const ez = THREE.MathUtils.smootherstep(dr.f, 0, 1);
    if (dr.kind === 'tilt') dr.pivot.rotation.x = dr.sI * ez * .17;        // tips in about 10°
    else if (dr.kind === 'turn') dr.pivot.rotation.y = -dr.sI * dr.hs * ez * Math.PI / 2;   // wide open, square to the wall
    else if (!dr.kind) dr.pivot.rotation.y = -dr.sg * ez * Math.PI / 2 * .98;
  }
  // the ceiling only from inside
  const inside = mode === 'walk' && !tween;
  ceiling.visible = !!(S.ceiling && (inside || (tween && mode === 'walk' && (now - tween.t0) / tween.dur > .8)));
  // labels
  const w = innerWidth, h = innerHeight;
  for (const l of labelsAt) {
    v.copy(l.v).project(camera);
    const vis = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    l.el.style.transform = `translate(${(v.x + 1) / 2 * w}px, ${(1 - v.y) / 2 * h}px) translate(-50%, -50%)`; l.el.style.visibility = vis ? '' : 'hidden';
  }
  if (mode === 'walk') {
    drawMini();
    const r = roomAt(P.x, P.z);
    if (r !== lastRoom) { lastRoom = r; here.classList.toggle('on', !!r); if (r) { hereN.textContent = r.name; hereA.textContent = r.area.toFixed(1) + ' m²'; } }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

placeSun(); paintWalls(); applyCut(S.cut); plan.visible = S.plan; renderer.toneMappingExposure = S.exposure;
resize(); paintHint(); requestAnimationFrame(frame);
document.body.classList.add('ready');
window.AW = { A, P, S, wx, wz, step: stepWalk, keys, free, camera, controls, renderer, scene, doors, nearestDoor, toggleDoor, setMode, clear, roomAt, get mode() { return mode; } };
</script>
