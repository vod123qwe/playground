<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apartment Walk · lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/lab-ui.css">
<style>
  :root{ --ink:#1b1c20; --muted:rgba(20,20,20,.5); --line:rgba(20,20,20,.1); --ease:cubic-bezier(.22,.61,.36,1); }
  *{box-sizing:border-box}
  html, body{margin:0; height:100%; overflow:hidden; background:#e8e5df; color:var(--ink); font:500 13.5px/1.4 "Inter", system-ui, sans-serif; -webkit-font-smoothing:antialiased}
  #gl{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none}
  body.walk #gl{cursor:grab} body.walk.looking #gl{cursor:grabbing}
  button{font:inherit; color:inherit}

  /* chrome: white pills, the same family as the other lab pieces */
  .pill{display:flex; align-items:center; gap:9px; height:46px; padding:0 20px 0 16px; border:0; border-radius:999px; background:#fff; color:var(--ink); font-weight:600; cursor:pointer}
  .pill svg{width:19px; height:19px}
  .pill:focus-visible, .icon:focus-visible, .modes button:focus-visible{outline:2px solid rgba(20,20,20,.35); outline-offset:2px}
  .icon{display:grid; place-items:center; width:46px; height:46px; border:0; border-radius:999px; background:#fff; color:var(--ink); cursor:pointer}
  .icon svg{width:20px; height:20px}
  .back{position:fixed; top:16px; left:16px; z-index:5; text-decoration:none}
  .tr{position:fixed; top:16px; right:16px; z-index:5; display:flex; gap:8px; transition:right .45s var(--ease)}
  body.tuning .tr .tune{display:none}
  @media (min-width:761px){ body.tuning .tr{right:400px} }

  /* overview | walk, bottom centre */
  .dock{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:4; transform:translateX(-50%); transition:left .45s var(--ease)}
  @media (min-width:761px){ body.tuning .dock{left:calc(50% - 192px)} }
  .modes{position:relative; display:flex; gap:0; height:46px; padding:5px; border-radius:999px; background:#fff}
  .modes button{position:relative; z-index:1; display:flex; align-items:center; gap:8px; height:36px; padding:0 16px 0 13px; border:0; border-radius:999px; background:transparent; font-weight:600; color:rgba(20,20,20,.62); cursor:pointer; transition:color .3s ease}
  .modes button svg{width:18px; height:18px}
  .modes button[aria-pressed=true]{color:#fff}
  .modes i{position:absolute; top:5px; left:5px; height:36px; border-radius:999px; background:var(--ink); transition:transform .45s var(--ease), width .45s var(--ease)}

  /* the hint, bottom left */
  /* the hint sits centred above the view switch, so the two never meet (it follows the dock when the panel opens) */
  .hint{position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); z-index:4; transform:translateX(-50%); display:flex; align-items:center; gap:10px; height:34px; padding:0 14px;
        max-width:calc(100vw - 32px); border-radius:999px; background:rgba(232,229,223,.72); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
        color:rgba(20,20,20,.62); font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:left .45s var(--ease)}
  @media (min-width:761px){ body.tuning .hint{left:calc(50% - 192px); max-width:calc(100vw - 416px)} }
  .pts{position:fixed; left:16px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:4; display:none; align-items:center; gap:8px; height:36px; padding:0 14px; border-radius:999px;
       background:rgba(232,229,223,.72); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:rgba(20,20,20,.66); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums}
  .pts i{width:8px; height:8px; border-radius:50%; background:#c9a15a; transition:background .3s} .pts.done i{background:#3fae6a}
  body.walk.pt-on .pts{display:flex}
  @media (max-width:760px){ .pts{bottom:calc(128px + env(safe-area-inset-bottom)); left:auto; right:160px} }
  .hint kbd{display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; border-radius:6px; background:rgba(20,20,20,.07); font:600 11px/1 "Inter", sans-serif}
  @media (max-width:760px){ .hint{height:32px; font-size:11.5px} }
  @media (pointer:coarse){ .hint .keys{display:none} } @media (pointer:fine){ .hint .touch{display:none} }

  /* room names over the model (overview) and the room you are in (walk) */
  .overlay{position:fixed; inset:0; z-index:3; pointer-events:none}
  .rl{position:absolute; left:0; top:0; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.9); text-align:center; white-space:nowrap; transition:opacity .35s ease}
  .rl b{display:block; font-size:12px; font-weight:600; line-height:1.2} .rl small{display:block; color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
  body.walk .rl, body.nolabels .rl{opacity:0}
  .here{position:fixed; top:16px; left:50%; z-index:4; transform:translate(-50%, -8px); display:flex; align-items:center; gap:8px; height:46px; padding:0 18px; border-radius:999px;
        background:#fff; font-weight:600; opacity:0; transition:opacity .35s ease, transform .45s var(--ease); pointer-events:none; white-space:nowrap}
  .here small{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
  body.walk .here.on{opacity:1; transform:translate(-50%, 0)}
  @media (max-width:760px){ .here{top:70px} }

  /* the minimap (walk) */
  .mini{position:fixed; top:72px; left:16px; z-index:4; width:196px; height:180px; border-radius:18px; background:#fff; opacity:0; visibility:hidden; transform:translateY(-6px);
        transition:opacity .35s ease, transform .45s var(--ease), visibility 0s linear .45s; cursor:crosshair}
  body.walk .mini{opacity:1; visibility:visible; transform:none; transition:opacity .35s ease, transform .45s var(--ease), visibility 0s}
  @media (max-width:760px){ .mini{width:132px; height:122px; top:auto; bottom:calc(128px + env(safe-area-inset-bottom)); left:auto; right:16px} }

  /* the stick on touch screens (walk) */
  .stick{position:fixed; left:28px; bottom:calc(128px + env(safe-area-inset-bottom)); z-index:4; width:116px; height:116px; border-radius:50%; background:rgba(255,255,255,.55);
         box-shadow:inset 0 0 0 1.5px rgba(20,20,20,.14); touch-action:none; display:none}
  .stick i{position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px rgba(20,20,20,.12)}
  @media (pointer:coarse){ body.walk .stick{display:block} }

  /* the panel */
  .panel{--ui-pad:28px; position:fixed; top:0; right:0; bottom:0; z-index:6; width:384px; overflow:auto; padding:0 28px 28px; background:#fff; box-shadow:-1px 0 0 var(--line);
         transform:translateX(100%); visibility:hidden; transition:transform .45s var(--ease), visibility 0s linear .45s; overscroll-behavior:contain}
  body.tuning .panel{transform:none; visibility:visible; transition:transform .45s var(--ease)}
  @media (max-width:760px){ .panel{top:auto; left:0; width:auto; height:62vh; transform:translateY(100%)} }
  .ph{position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:flex-start; margin:0 -28px; padding:28px 28px 20px; background:#fff; border-bottom:1px solid var(--line)}
  .ph h2{margin:0; font-size:20px; font-weight:600} .ph p{margin:4px 0 0; color:var(--muted); font-size:12.5px}
  .ph button{width:32px; height:32px; border:0; background:transparent; cursor:pointer; display:grid; place-items:center} .ph svg{width:20px; height:20px}
  .facts{margin:0 -28px; padding:16px 28px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr auto; gap:6px 12px; font-size:12.5px}
  .facts span{color:rgba(20,20,20,.7)} .facts b{font-weight:600; font-variant-numeric:tabular-nums; text-align:right}
  .note{color:var(--muted); font-size:12px; margin:8px 0 0}

  /* the photo's progress */
  .modal{position:fixed; inset:0; z-index:9; display:grid; place-items:center; background:rgba(232,229,223,.6); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
         opacity:0; visibility:hidden; transition:opacity .3s ease, visibility 0s linear .3s}
  .modal.open{opacity:1; visibility:visible; transition:opacity .3s ease, visibility 0s}
  .card{width:min(360px, calc(100vw - 32px)); padding:24px; border-radius:22px; background:#fff; box-shadow:0 0 0 1px var(--line)}
  .card b{display:block; font-size:15px; font-weight:600} .card p{margin:6px 0 16px; color:var(--muted)}
  .meter{height:6px; border-radius:6px; background:rgba(20,20,20,.08); overflow:hidden} .meter i{display:block; height:100%; width:0; background:var(--ink); transition:width .2s linear}
  .card .row2{display:flex; justify-content:space-between; align-items:center; margin-top:14px}
  .card .row2 span{color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums}
  .card button{height:36px; padding:0 14px; border:0; border-radius:999px; background:rgba(20,20,20,.06); font-weight:600; cursor:pointer}
  @media (max-width:760px){ #photo span{display:none} #photo{padding:0 13px} }
  .loading{position:fixed; inset:0; z-index:8; display:grid; place-items:center; pointer-events:none; color:var(--muted); font-weight:600; transition:opacity .5s ease}
  body.ready .loading{opacity:0}
  /* the hand (the same as in the Glass Button): over something that opens, and while Space-panning */
  body.hand-on #gl{cursor:none !important}
  .hand{position:fixed; left:0; top:0; z-index:20; width:30px; height:30px; margin:-15px 0 0 -15px; pointer-events:none; opacity:0; will-change:transform, opacity; transition:opacity .22s ease}
  body.hand-on .hand{opacity:1}
  .hand svg{width:100%; height:100%; overflow:visible}
  .hand .halo{stroke:#fff; stroke-width:4.2} .hand .ink{stroke:#1b1c20; stroke-width:1.6}
  .hand .h-open, .hand .h-grab{transition:opacity .18s ease, transform .24s cubic-bezier(.22,.61,.36,1); transform-origin:50% 60%}
  .hand .h-grab{opacity:0; transform:scale(.9)}
  body.hand-grab .hand .h-open{opacity:0; transform:scale(1.06)} body.hand-grab .hand .h-grab{opacity:1; transform:none}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
<body>
<canvas id="gl" tabindex="0" aria-label="The apartment in 3D"></canvas>
<div class="loading" id="loading">Laying the floors…</div>
<div class="overlay" id="overlay"></div>
<div class="hand" id="hand" aria-hidden="true"><svg viewBox="-2 -2 28 28" fill="none" stroke-linecap="round" stroke-linejoin="round"><g class="h-open"><g class="halo"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></g><g class="ink"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></g></g><g class="h-grab"><g class="halo"><path d="M18 11.5V9a2 2 0 0 0-4 0v1.4"/><path d="M14 10V8a2 2 0 0 0-4 0v2"/><path d="M10 9.9V9a2 2 0 0 0-4 0v5"/><path d="M6 14a2 2 0 0 0-4 0"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8 2 2 0 1 1 4 0"/></g><g class="ink"><path d="M18 11.5V9a2 2 0 0 0-4 0v1.4"/><path d="M14 10V8a2 2 0 0 0-4 0v2"/><path d="M10 9.9V9a2 2 0 0 0-4 0v5"/><path d="M6 14a2 2 0 0 0-4 0"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8 2 2 0 1 1 4 0"/></g></g></svg></div>

<a class="icon back" href="../../" aria-label="Back to the lab" title="Back to the lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></a>
<div class="here" id="here" aria-live="polite"><span id="here-n"></span><small id="here-a"></small></div>
<canvas class="mini" id="mini" width="392" height="360" aria-label="Minimap: click to move there"></canvas>
<div class="stick" id="stick" aria-hidden="true"><i></i></div>

<div class="tr">
  <button class="pill" id="photo" type="button" title="A still in 4K: soft shadows, contact shadows, clean edges">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg><span>Photo</span>
  </button>
  <button class="pill tune" id="tune" type="button" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Customize</span>
  </button>
</div>

<div class="dock"><div class="modes" role="group" aria-label="View">
  <i id="modes-i" aria-hidden="true"></i>
  <button type="button" id="m-over" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Overview</button>
  <button type="button" id="m-walk" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="1.8"/><path d="M9 21l2.5-6.5L14 17v4M8 11.5l3-3.5h3l2.5 3.5M11.5 14.5 12 8"/></svg>Walk</button>
</div></div>

<div class="hint" id="hint" aria-live="polite"></div>
<div class="pts" id="pts" aria-live="polite"><i></i><span>Live preview</span></div>
<div class="modal" id="shot" role="dialog" aria-modal="true" aria-labelledby="shot-t"><div class="card">
  <b id="shot-t">Developing the photo</b><p>Many frames, each a hair apart, averaged: soft shadows, contact shadows, clean edges.</p>
  <div class="meter"><i id="shot-bar"></i></div>
  <div class="row2"><span id="shot-n">0 / 0</span><button type="button" id="shot-x">Cancel</button></div>
</div></div>
<aside class="panel lab-ui" id="panel" aria-label="Customize the view"></aside>

<script src="../../shared/lab-ui.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/build/index.module.js",
  "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.25/build/index.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { herringbone, stoneTiles } from './floors.js?v=3';
import { buildKitchen } from './kitchen.js?v=3';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { WebGLPathTracer } from 'three-gpu-pathtracer';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';

// ---------- the flat: walls, openings, balconies, rooms, all in centimetres (tools/extract_plan.py) ----------
const A = await (await fetch('apartment.json')).json();
const H = A.height, M = .01;                                      // cm → m
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const all = [...A.floor.outer, ...A.balconies.flatMap(b => b.outer)];
const CX = (Math.min(...all.map(p => p[0])) + Math.max(...all.map(p => p[0]))) / 2, CZ = (Math.min(...all.map(p => p[1])) + Math.max(...all.map(p => p[1]))) / 2;
const wx = x => (x - CX) * M, wz = z => (z - CZ) * M;               // plan → world (metres, centred)
const px = x => x / M + CX, pz = z => z / M + CZ;                   // world → plan
const shoelace = ps => Math.abs(ps.reduce((s, p, i) => { const q = ps[(i + 1) % ps.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2;

// path tracing is experimental here (?pt=1): on the whole flat this version of the tracer mixes up some materials (the multi-material and
// vertex-coloured meshes) and converges slowly indoors; the preview is the reference
const PT_ON = new URLSearchParams(location.search).get('pt') === '1';
const S = { portal: 1.1, pt: PT_ON, bounces: 3, aisle: 0, fix: 'frame', paint: '#ded8cb', hb: 'window', cut: 255, plan: false, planOp: .75, labels: true, thick: true, eye: 165, speed: 1.4, fov: 72, ceiling: true, sun: 35, exposure: 1 };
const DEF = { ...S };
const AISLE0 = A.kitchen ? Math.round((A.kitchen.island.off - A.kitchen.island.d / 2 - 62) * 10) / 10 : 90;   // the aisle as A.04 draws it

// ---------- renderer, scene, light ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e8e5df');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .55;
if (new URLSearchParams(location.search).get('pt') === '1')    // the tracer needs an equirectangular sky: Lebombo, Poly Haven (CC0); the preview keeps the studio light
  new HDRLoader().load('assets/lebombo_1k.hdr', t => { t.mapping = THREE.EquirectangularReflectionMapping; scene.environment = t; ptScene(); });
const hemi = new THREE.HemisphereLight('#fffaf2', '#cbbfae', .55); scene.add(hemi);
RectAreaLightUniformsLib.init();
// window portals: a soft sky-coloured area light in every glazed opening, facing in. Indoors the traced light mostly comes through the windows;
// with a light there the tracer finds it at once (far less noise), and the preview gets the same soft window light
const portals = [];
const sun = new THREE.DirectionalLight('#fff1dc', 2.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004; sun.shadow.normalBias = .02;
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: .5, far: 60 });
scene.add(sun, sun.target);
function placeSun() {                                             // the sun comes in through the long facade; the slider turns it round
  const a = THREE.MathUtils.degToRad(S.sun), out = new THREE.Vector2(.7902, -.6128);   // the facade faces up and to the right on the drawing
  const d = new THREE.Vector3(out.x * Math.cos(a) - out.y * Math.sin(a), 0, out.x * Math.sin(a) + out.y * Math.cos(a)).normalize();
  sun.position.set(d.x * 18, 14, d.z * 18);
}

const camera = new THREE.PerspectiveCamera(40, 1, .05, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08; controls.maxPolarAngle = 1.35; controls.minDistance = 4; controls.maxDistance = 40;
controls.target.set(0, 0, 0);
camera.position.set(9.5, 17.5, 15);

// ---------- materials ----------
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), H * M);
const clip = { clippingPlanes: [cutPlane], clipShadows: true };
const mat = {
  wall: new THREE.MeshStandardMaterial({ color: '#ffffff', vertexColors: true, roughness: .92, ...clip }),   // inside faces in the paint, outside ones in the facade white (per vertex)
  paint: new THREE.MeshStandardMaterial({ color: '#ded8cb', roughness: .92, ...clip }),                        // Flügger FL8065 Oat, matt (the hidden doors are painted with the wall)
  skirting: new THREE.MeshStandardMaterial({ color: '#f5f5f2', roughness: .42, ...clip }),
  thick: new THREE.MeshStandardMaterial({ color: '#e6e0d7', roughness: .92, ...clip }),
  floor: new THREE.MeshStandardMaterial({ color: '#dccbb2', roughness: .78 }),
  balcony: new THREE.MeshStandardMaterial({ color: '#cfcac3', roughness: .9 }),
  ceiling: new THREE.MeshStandardMaterial({ color: '#fbfaf8', roughness: .95, side: THREE.DoubleSide }),
  frame: new THREE.MeshStandardMaterial({ color: '#3a3b40', roughness: .5, metalness: .2, ...clip }),
  cap: new THREE.MeshBasicMaterial({ color: '#1b1c20' }),
  capThin: new THREE.MeshBasicMaterial({ color: '#1b1c20' }),
  rail: new THREE.MeshStandardMaterial({ color: '#dfeef0', roughness: .05, transparent: true, opacity: .28, depthWrite: false, side: THREE.DoubleSide }),
  frosted: new THREE.MeshStandardMaterial({ color: '#f3f5f5', roughness: .85, transparent: true, opacity: .8, depthWrite: false, side: THREE.DoubleSide }),
