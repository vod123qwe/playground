<style>
  /* Figures in the manner of a technical plate, thin lines over quiet fills on a dotted ground, nothing written round them.
     Shelf: VHS tapes standing spine out; point at one and it slides out a little; take it (press and drag) and carry it along the
     shelf while the others part where you hold it; let go and it slides into the gap, the bookend closing up. A click without a drag
     pulls it half out, as if to read the spine. Carousel: audio cassettes standing one behind the other, a band running left to right across the page like a hero's slider; scroll (or drag them) and the row slides along, settling so that one stands in the middle, pulled up out of the row with its face to you. Everywhere: drag the empty ground to turn
     the view, the wheel (on the carousel with Ctrl or a pinch) or the − / + to zoom. Motion eases in without springs: nothing
     overshoots. three.js: every part a fill plus its hard edges as lines; the details drawn on the faces. */
  :root { --page: #17181b; --plate: #121314; --dot: rgba(255,255,255,.07); --morph: .55s cubic-bezier(.3,1.12,.4,1); --ease: cubic-bezier(.22,.61,.36,1); }
  body.light { --page: #fff; --plate: #f4f3ef; --dot: rgba(20,20,20,.09); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); font-family: var(--lab-font); overflow: hidden; transition: background .4s; }

  /* ---------- the plate: the whole screen, a dotted ground; while Customize is open a rounded box beside the card ---------- */
  .plate { position: fixed; inset: 0; border-radius: 0; overflow: hidden; touch-action: none; cursor: move; transition: inset var(--morph), border-radius var(--morph), background-color .4s;
    background: var(--plate); }   /* (no dots anywhere in this piece: Jarek) */

  body.tuning .plate { inset: 16px 368px 16px 16px; border-radius: 26px; }
  .plate canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- the chrome (as the other lab pieces): back, Light / Dark, Customize, the figures' pill, the view's − + ⟲ ---------- */
  .back, .tune, .mode { position: fixed; top: 16px; z-index: 6; }
  body.tuning .back, body.tuning .mode { top: 30px; } body.tuning .back { left: 30px; }
  .back { left: 16px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 999px; background: #1c1c1f; color: #f2f2f0; transition: top var(--morph), left var(--morph), translate .2s var(--ease); }
  .back:hover { translate: -2px 0; } .back svg { width: 20px; height: 20px; }
  .tune { right: 16px; display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 20px 0 16px; border: 0; border-radius: 999px; background: #1c1c1f; color: #f2f2f0; font: 600 14px var(--lab-font); cursor: pointer; transition: transform .2s var(--ease), opacity .2s; }
  .tune:hover { transform: translateY(-1px); } .tune svg { width: 19px; height: 19px; } body.tuning .tune { opacity: 0; pointer-events: none; }
  .mode { left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: #1c1c1f; font: 600 13px var(--lab-font); transition: top var(--morph), left var(--morph); }
  .mode button { height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,.5); font: inherit; cursor: pointer; }
  .mode button:hover { color: #fff; } .mode button[aria-checked=true] { color: #1b1c20; }
  .dock { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6; transform: translateX(-50%); transition: left var(--morph), bottom var(--morph); }
  .view { position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: #1c1c1f; transition: right var(--morph), bottom var(--morph); }
  .view button { display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,.7); cursor: pointer; transition: background .2s, color .2s, scale .3s cubic-bezier(.3,1.35,.45,1); }
  .view button:hover { background: rgba(255,255,255,.08); color: #fff; } .view button:active { scale: .92; } .view svg { width: 18px; height: 18px; }
  body.light .back, body.light .tune, body.light .mode, body.light .view { background: #fff; color: #1b1c20; }
  body.light .mode button { color: rgba(20,20,20,.55); } body.light .mode button:hover { color: #1b1c20; } body.light .mode button[aria-checked=true] { color: #fff; }
  body.light .view button { color: rgba(20,20,20,.65); } body.light .view button:hover { background: rgba(20,20,20,.06); color: #1b1c20; }
  body.bare .back, body.bare .tune, body.bare .mode, body.bare .panel, body.bare .dock, body.bare .view { display: none; }

  /* ---------- the panel: the lab's card ---------- */
  .panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 340px; z-index: 5; display: flex; flex-direction: column; overflow: auto; overscroll-behavior: contain; padding: 0 20px; --ui-pad: 20px;
    font-family: var(--lab-font); border-radius: 26px; border: 1px solid var(--ui-card-line, rgba(20,20,20,.08)); opacity: 0; translate: 24px 0; visibility: hidden;
    transition: translate var(--morph), opacity .3s, visibility 0s .55s; }

  @media (max-width: 760px) { .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 56vh; translate: 0 calc(100% + 16px); }
    body.tuning .panel { translate: 0 0; } body.tuning .plate { inset: 8px 8px calc(56vh + 16px) 8px; border-radius: 22px; } body.tuning .back, body.tuning .mode { top: 18px; } body.tuning .back { left: 18px; }
    body.tuning .dock, body.tuning .view { display: none; } }

// =============================================== Fig 5.1 · the shelf ===============================================

const shelfG = new THREE.Group(); scene.add(shelfG);

function makeTape(i) { const g = new THREE.Group(), body = new THREE.Group(), me = { g, i, name: `TAPE ${String(i + 1).padStart(2, '0')}`, lines: [], labels: [], fills: [],

  build: buildCranes,
  down() { const i = cellUnder(); if (i < 0) return false; const g = active(); if (human() && g && g.phase === 'ready' && !placed[i]) play(i); return true; },
  move() { const i = cellUnder(), g = active();
    if (g && g.phase === 'ready' && human() && i >= 0) { const c = cellAt(i); g.tx = c.x; g.tz = c.z; }             // (the crane goes over the square the pointer is on)
    const h = i >= 0 && !placed[i] && human() && !endState ? i : -1; if (h !== cellHover) { cellHover = h; plate.classList.toggle('over', h >= 0); paint(); } wake(); },
  up() { }, leave() { if (cellHover >= 0) { cellHover = -1; plate.classList.remove('over'); paint(); } },
  frame() { const now = performance.now(), k = reduce ? 1 : Math.min(.2, P.follow * .6); let busy = !!endState || puffs.length > 0;   // (calm: the bridge and the carriage glide, the head comes down slower still)
    for (const g of gantries) { const mz = ease(g.z, g.tz, k), mx = ease(g.x, g.tx, k), me = ease(g.ext, g.te, Math.min(1, k * .85)), mg = ease(g.grip, g.tg || 0, reduce ? 1 : .13); if (mz || mx || me || mg) busy = true;
      const there = !mz && !mx, down = !me, held = !mg;
      if (g.phase === 'fetch' && there && down) { g.tg = 1; g.phase = 'close'; }                                   // (down round the box: the fingers close on it)
      else if (g.phase === 'close' && held) { g.carry = g.stack.pop(); g.te = 0; g.phase = 'lift'; paint(); }
      else if (g.phase === 'lift' && down) { g.phase = 'ready'; paint(); if (!human()) setTimeout(aiMove, 350); else if (cellHover >= 0) { const c = cellAt(cellHover); g.tx = c.x; g.tz = c.z; } }
      else if (g.phase === 'go' && there) { g.te = placeExt(g); g.phase = 'lower'; }
      else if (g.phase === 'lower' && down) { const b = g.carry, c = cellAt(g.cell); g.carry = null; b.g.position.set(c.x, SOCK_Y + BOXS / 2, c.z); boxesOn[g.cell] = b; puff(c.x, SOCK_Y, c.z); g.tg = 0; g.phase = 'open'; paint(); }   // (set down: a little dust)
      else if (g.phase === 'open' && held) { g.te = 0; g.phase = 'raise'; }
      else if (g.phase === 'raise' && down) { g.tx = 0; g.tz = g.parkZ; g.phase = 'home'; }
      else if (g.phase === 'home' && there) { g.phase = 'idle'; const w = winner(placed);
        if (w || placed.every(Boolean)) endState = { t0: now, line: w || null }; else { turn = turn === 'X' ? 'O' : 'X'; startTurn(); }
        paint(); }
      if (g.phase !== 'idle' && g.phase !== 'ready') busy = true;
      g.g.position.z = g.z.p; g.car.position.x = g.x.p; g.head.position.y = -g.ext.p; g.tube.scale.y = g.tubeLen(g.ext.p);
      const fo = BOXS / 2 + .3 - g.grip.p * .23; for (const f of g.fingers) f.position.set(f.userData.s[0] * fo, 0, f.userData.s[1] * fo);
      if (g.carry) g.carry.g.position.set(g.x.p, g.gripY0 - g.ext.p - BOXS / 2 - .02, g.z.p); }
    stepPuffs(now);
    if (endState) { const t = (now - endState.t0) / 1000;
      if (endState.line && !winMesh) { const a = cellAt(endState.line[0]), b = cellAt(endState.line[2]), y = SOCK_Y + BOXS + .06, d = b.clone().sub(a).normalize().multiplyScalar(PG * .36);
        winMesh = segs([V(a.x - d.x, y, a.z - d.z), V(b.x + d.x, y, b.z + d.z)], ttG, M.hi); paint(); }
      if (t > (endState.line ? 1.4 : .8) && !fallers.length && boxesOn.some(Boolean)) { fallers = boxesOn.filter(Boolean); boxesOn = Array(9).fill(null); if (winMesh) { ttG.remove(winMesh); winMesh.geometry.dispose(); winMesh = null; } paint(); }
      for (const b of fallers) { b.vy -= .012; b.g.position.y += b.vy; }                                    // (they sink away into their sockets)
      if (t > 3.4) { for (const b of fallers) { ttG.remove(b.g); b.g.traverse(o => o.geometry?.dispose()); } fallers = [];
        for (const gt of gantries) while (gt.stack.length < STACK) { const kk = gt.stack.length, b = makeBox(gt.mark); b.g.position.set(bayX(kk), TOP + .2 + BOXS / 2, gt.parkZ); ttG.add(b.g); gt.stack.push(b); }
        placed = Array(9).fill(null); turn = 'X'; endState = null; startTurn(); } }
    return busy || !!endState; },   // (a game that has just ended keeps the frame going)
  panel(g, sl) { ctl.ai = LabUI.check(g, { label: 'The noughts crane plays itself', value: P.ai, onChange: v => { P.ai = v; save(); const a = active(); if (v && turn === 'O' && a && a.phase === 'ready') setTimeout(aiMove, 300); } }); } };
paints.push(c => { if (!gantries.length) return;
  for (const g of gantries) { const on = !endState && g.mark === turn; for (const l of g.lines) l.material = on ? M.hi : M.line; if (g.carry) for (const l of g.carry.lines) l.material = M.hi; for (const b of g.stack) for (const l of b.lines) l.material = M.line; }
  const wins = endState && endState.line ? endState.line : []; boxesOn.forEach((b, i) => { if (b) for (const l of b.lines) l.material = wins.includes(i) ? M.hi : M.line; });
  socketLines.forEach((l, i) => { l.material = i === cellHover ? M.hi : M.line; }); });

// ---------- which figure is on ----------
const FIGS = { Shelf: SHELF, Carousel: CAR, Cranes: CRANES };
let F = FIGS[P.fig];
function setFig(n, keep) { P.fig = n; if (!keep) save(); F = FIGS[n]; for (const f of Object.values(FIGS)) f.g.visible = f === F;
  $('nm').textContent = n; resetView(true); buildPanel(); paint(); wake(); }
const VARS = LabUI.variants($('vars'), { prev: $('prev'), next: $('next'), name: $('nm'), onStep: d => setFig(FIGS_ORDER[(FIGS_ORDER.indexOf(P.fig) + d + FIGS_ORDER.length) % FIGS_ORDER.length]),
  items: () => FIGS_ORDER, current: () => P.fig, onPick: n => setFig(n) });

// ---------- light and dark ----------
// (one palette for every figure: the colours of the lab's buttons, dark or light)
const PAL = { dark: { bg: '#0e0e10', fill: 0x1c1c1f, line: 0x3d3d42, hi: 0xf2f2f0 }, light: { bg: '#f3f2ee', fill: 0xffffff, line: 0xc4c1ba, hi: 0x1b1c20 } };
let mode = (() => { try { return localStorage.getItem(KEY + '.mode') || localStorage.getItem('lab.line-studio.v3.mode') || localStorage.getItem('lab.line-studio.v2.mode') || 'dark'; } catch { return 'dark'; } })();
function paint() { const c = PAL[mode]; M.fill.color.set(c.fill); M.line.color.set(c.line); M.hi.color.set(c.hi); for (const p of paints) p(c);
  plate.style.background = c.bg; }
function setMode(m) { mode = m; try { localStorage.setItem(KEY + '.mode', m); } catch { }
  document.body.classList.toggle('light', m === 'light'); document.body.classList.toggle('dark', m === 'dark');   // (dark too: the shared Light / Dark pill reads it)
  $('panel').classList.toggle('dark', m === 'dark'); $('vars').classList.toggle('dark', m === 'dark'); paint();
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.m === m)));
  document.querySelector('meta[name=theme-color]').content = m === 'dark' ? '#121314' : '#f4f3ef'; wake(); }
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => setMode(b.dataset.m));

// ---------- the view: turned by dragging the ground, zoomed by the wheel or − / +; the pointer leans it a hair ----------
const VIEW = { dAz: { p: 0 }, dEl: { p: 0 }, z: { p: 1 }, tAz: 0, tEl: 0, tz: 1, lAz: { p: 0 }, lEl: { p: 0 }, tlAz: 0, tlEl: 0 };
function resetView(now) { VIEW.tAz = VIEW.tEl = 0; VIEW.tz = 1; if (now) { VIEW.dAz.p = VIEW.dEl.p = 0; VIEW.z.p = 1; } wake(); }
const zoomBy = f => { VIEW.tz = Math.max(.45, Math.min(3, VIEW.tz * f)); wake(); };
$('zin').onclick = () => zoomBy(1.25); $('zout').onclick = () => zoomBy(1 / 1.25); $('zreset').onclick = () => resetView(false);
let W = 1, H = 1; new ResizeObserver(() => { W = plate.clientWidth || 1; H = plate.clientHeight || 1; renderer.setSize(W, H, false); wake(); }).observe(plate);
function placeCam() { const a = W / H, S = F.span(a) / VIEW.z.p, az = F.az + VIEW.dAz.p + VIEW.lAz.p, el = Math.max(.06, Math.min(1.4, F.el + VIEW.dEl.p + VIEW.lEl.p)), r = 80, cy = F.cy();
  cam.left = -S * a / 2; cam.right = S * a / 2; cam.top = S / 2; cam.bottom = -S / 2; cam.updateProjectionMatrix();
  cam.position.set(Math.sin(az) * Math.cos(el) * r, cy + Math.sin(el) * r, Math.cos(az) * Math.cos(el) * r); cam.lookAt(0, cy, 0); }

// ---------- the pointer: the figure gets it first (a tape, a cassette); the empty ground turns the view ----------
let orbit = null;
function setNdc(e) { const r = plate.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  ndc.set(px * 2 - 1, -(py * 2 - 1)); if (P.tilt && !orbit) { VIEW.tlAz = (px - .5) * .06; VIEW.tlEl = (py - .5) * -.04; } }
if (!DEMO) {
  plate.addEventListener('pointerdown', e => { if (e.button !== 0 && e.button !== 2) return; setNdc(e); placeCam();
    if (e.button === 0 && F.down(e)) { try { plate.setPointerCapture(e.pointerId); } catch { } return; }
    orbit = { x: e.clientX, y: e.clientY, az: VIEW.tAz, el: VIEW.tEl }; plate.classList.add('dragging'); try { plate.setPointerCapture(e.pointerId); } catch { } });
  plate.addEventListener('pointermove', e => { setNdc(e);
    if (orbit) { VIEW.tAz = orbit.az - (e.clientX - orbit.x) * .006; VIEW.tEl = Math.max(-.36, Math.min(.85, orbit.el + (e.clientY - orbit.y) * .004)); VIEW.dAz.p = VIEW.tAz; VIEW.dEl.p = VIEW.tEl; }
    else F.move(e); wake(); });
  const up = () => { if (orbit) { orbit = null; plate.classList.remove('dragging'); wake(); return; } F.up(); };
  plate.addEventListener('pointerup', up); plate.addEventListener('pointercancel', up);
  plate.addEventListener('pointerleave', () => { if (!orbit) { F.leave(); VIEW.tlAz = VIEW.tlEl = 0; wake(); } });
  plate.addEventListener('contextmenu', e => e.preventDefault());
  plate.addEventListener('wheel', e => { e.preventDefault(); if (e.ctrlKey || e.metaKey || !F.wheel) zoomBy(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015))); else F.wheel(e); }, { passive: false });
  addEventListener('keydown', e => { if (e.target.closest?.('input, .panel')) return; if (e.key === '+' || e.key === '=') zoomBy(1.25); if (e.key === '-') zoomBy(1 / 1.25); if (e.key === '0') resetView(false);
    if (F === CAR && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) CAR.nudge(e.key === 'ArrowLeft' ? -1 : 1); });
}

// ---------- the frame ----------
let raf = 0; const wake = () => { if (!raf) raf = requestAnimationFrame(frame); };
function frame() { raf = 0; let busy = F.frame();
  if (ease(VIEW.z, VIEW.tz, .14)) busy = true; if (!orbit) { if (ease(VIEW.dAz, VIEW.tAz, .1)) busy = true; if (ease(VIEW.dEl, VIEW.tEl, .1)) busy = true; }
  if (ease(VIEW.lAz, P.tilt ? VIEW.tlAz : 0, .05)) busy = true; if (ease(VIEW.lEl, P.tilt ? VIEW.tlEl : 0, .05)) busy = true;
  placeCam(); renderer.render(scene, cam); if (busy || orbit) wake(); }

// ---------- the panel ----------
const panel = $('panel'); let ctl = {};
function buildPanel() { panel.innerHTML = ''; ctl = {};
  const head = document.createElement('header'); head.className = 'ph'; head.innerHTML = '<div><h2></h2><p></p></div><button class="pc" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  head.querySelector('h2').textContent = P.fig; head.querySelector('p').textContent = { Shelf: 'VHS tapes on a shelf: take one out and put it where you want it.', Carousel: 'Cassettes in a row: scroll or drag along it; the one that comes to the middle faces you, the row never ends.', Cranes: 'Noughts and crosses with two gantry cranes on the rails: move over a square and the one whose turn it is goes there; click and it lowers the box. Three in a row and they all sink away.' }[P.fig];
  head.querySelector('.pc').onclick = () => openPanel(false); panel.appendChild(head);
  const set = (k, v, rebuild) => { P[k] = v; save(); if (rebuild) { F.build(); paint(); } wake(); };
  const sl = (g, k, label, min, max, st, unit, rebuild) => ctl[k] = LabUI.slider(g, { label, min, max, step: st, unit, value: P[k], def: DEF[k], onInput: v => set(k, v, rebuild) });
  const g = LabUI.group(panel, 'Figure', { key: KEY + '.g.fig' }); F.panel(g, sl); sl(g, 'follow', 'Speed', .04, .25, .005);
  ctl.tilt = LabUI.check(g, { label: 'Lean with the pointer', value: P.tilt, onChange: v => set('tilt', v) });
  const acts = document.createElement('div'); acts.className = 'acts'; acts.innerHTML = '<button type="button" data-a="reset">Reset all</button><button type="button" data-a="copy">Copy settings</button>'; panel.appendChild(acts);
  acts.querySelector('[data-a=reset]').onclick = () => { const fig = P.fig; P = { ...DEF, fig }; save(); SHELF.build(); CAR.build(); CRANES.build(); buildPanel(); resetView(false); paint(); };
  acts.querySelector('[data-a=copy]').onclick = e => { const d = {}; for (const k in P) if (P[k] !== DEF[k]) d[k] = P[k]; navigator.clipboard?.writeText(JSON.stringify(d, null, 2)); e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy settings', 1200); }; }
function openPanel(on) { VARS.close(true); document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('tuning')) openPanel(false); });

// ---------- start; the board's box: ?thumb=1 the still (&mode=light, &fig=Carousel), ?demo=1 the figure moving on its own ----------
if (BARE) { document.body.classList.add('bare'); const fig = FIGS_ORDER.includes(q.get('fig')) ? q.get('fig') : 'Shelf'; P = { ...DEF, fig }; mode = q.get('mode') === 'light' ? 'light' : 'dark'; }
SHELF.build(); CAR.build(); CRANES.build(); setMode(mode); setFig(P.fig, true);
document.fonts.ready.then(() => { for (const t of tapes) for (const l of t.labels) { l.material.map.dispose(); l.material.map = vhsLabel(t.name); }
  for (const c of cass) c.labels.forEach((l, j) => { l.material.map.dispose(); l.material.map = cassLabel(c.name, j ? 'B' : 'A'); }); wake(); });   // (the labels again once the type is in)
if (DEMO) setInterval(() => { if (F === CAR) CAR.nudge(1); else if (!drag && order.length > 2) { const t = order[Math.floor(Math.random() * order.length)], from = t.x.p; let to = order.indexOf(t);
    while (to === order.indexOf(t)) to = Math.floor(Math.random() * order.length); const toX = slotX(to), t0 = performance.now(); take(t);
    const stepFn = () => { const u = Math.min(1, (performance.now() - t0) / 1400), e = u < .5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2; carry(from + (toX - from) * e); if (u < 1) requestAnimationFrame(stepFn); else setTimeout(drop, 250); };
    requestAnimationFrame(stepFn); } }, 3200);
LabUI.segThumb($('mode'));
window.FIG = { THREE, shelfG, tapes: () => tapes, setFig, take, carry, drop, slotX, order: () => order, CAR, VIEW, s: () => cs.p, zoomBy, scene, cam, F: () => F, gantries: () => gantries, play, placed: () => placed };
</script>
</body>
