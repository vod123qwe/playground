const paints = [];                                          // (each figure's own repaint of its bright and quiet parts)

// =============================================== Fig 5.1 · the shelf ===============================================
const TW = 7.4, TH = 1, TD = 4.1, PITCH = TH + .07, B = .3, DS = TD + .7, HI = TW + 1.1;
const shelfG = new THREE.Group(); scene.add(shelfG);
const vhsLabel = name => tex(1040, 100, x => { x.font = `500 54px ${MONO}`; x.fillText(name, 18, 52); x.textAlign = 'right'; x.font = `400 40px ${MONO}`; x.fillText('E-180 · SP', 1022, 52); });
function makeTape(i) { const g = new THREE.Group(), body = new THREE.Group(), me = { g, i, name: `TAPE ${String(i + 1).padStart(2, '0')}`, lines: [], labels: [], fills: [],
    x: { p: 0 }, y: { p: 0 }, z: { p: 0 }, peek: false, bz: -(rnd(i * 3.7 + 1) * .35) };
  body.rotation.z = -Math.PI / 2; body.position.set(-TH / 2, TW / 2, 0); g.add(body);           // (built lying, stood on its end: window to the right, label up the spine)

function take(t) { drag = { tape: t, moved: false, sx: 0, sy: 0, x: t.x.p, ins: order.indexOf(t) }; }

// =============================================== sound: small, quiet, made on the spot ===============================================
// (no files: every sound is synthesised when it plays. A key's click is a short burst of noise through a band filter over a soft low

  acts.querySelector('[data-a=copy]').onclick = e => { const d = {}; for (const k in P) if (P[k] !== DEF[k]) d[k] = P[k]; navigator.clipboard?.writeText(JSON.stringify(d, null, 2)); e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy settings', 1200); }; }
function openPanel(on) { VARS.close(true); document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('tuning')) openPanel(false); });

// ---------- start; the board's box: ?thumb=1 the still (&mode=light, &fig=Carousel), ?demo=1 the figure moving on its own ----------
if (BARE) { document.body.classList.add('bare'); const fig = FIGS_ORDER.includes(q.get('fig')) ? q.get('fig') : 'Shelf'; P = { ...DEF, fig }; mode = q.get('mode') === 'light' ? 'light' : 'dark'; }
SHELF.build(); CAR.build(); CRANES.build(); for (const f of [BLOCKS, FAN, PILLARS]) f.build(); setMode(mode); setFig(P.fig, true);
document.fonts.ready.then(() => { for (const t of tapes) for (const l of t.labels) { l.material.map.dispose(); l.material.map = vhsLabel(t.name); }
  for (const c of cass) c.labels.forEach((l, j) => { l.material.map.dispose(); l.material.map = cassLabel(c.name, j ? 'B' : 'A'); }); wake(); });   // (the labels again once the type is in)
if (DEMO && F === PILLARS) { const t0 = performance.now();   // (the board's live box for Pillars: the pointer drifts over the field and the wave follows it)
  const run = () => { const t = (performance.now() - t0) / 1000, e = Math.min(1, t / 1.4), R = pilR * .62;
    pilP = t < .25 ? null : V(Math.sin(t * .55) * R * e, .4, Math.sin(t * .37 + 1.1) * R * .8 * e); wake(); requestAnimationFrame(run); }; requestAnimationFrame(run); }
if (DEMO && F === BLOCKS) { const t0 = performance.now(); let lastKey = 0;
  const run = () => { const t = (performance.now() - t0) / 1000, e = Math.min(1, t / 1.6), R = blkExt * .55;   // (the hill comes in softly from the still)
    blkP = V(Math.sin(t * .45) * R * e, 0, Math.sin(t * .31 + 1.2) * R * .7 * e); if (t < .25) blkP = null;
    if (t - lastKey > 3.2 && t > 1.6) { lastKey = t; let best = null, bd = 1e9; for (const b of blk) { const d = Math.hypot(b.x - blkP.x, b.z - blkP.z); if (d < bd) { bd = d; best = b; } } if (best) blkRings.push({ x: best.x, z: best.z, t0: performance.now(), key: best }); }
    wake(); requestAnimationFrame(run); }; requestAnimationFrame(run); }
if (DEMO) setInterval(() => { if (F === CAR) CAR.nudge(1); else if (F === SHELF && !drag && order.length > 2) { const t = order[Math.floor(Math.random() * order.length)], from = t.x.p; let to = order.indexOf(t);
    while (to === order.indexOf(t)) to = Math.floor(Math.random() * order.length); const toX = slotX(to), t0 = performance.now(); take(t);
    const stepFn = () => { const u = Math.min(1, (performance.now() - t0) / 1400), e = u < .5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2; carry(from + (toX - from) * e); if (u < 1) requestAnimationFrame(stepFn); else setTimeout(drop, 250); };
    requestAnimationFrame(stepFn); } }, 3200);
LabUI.segThumb($('mode'));
window.FIG = { THREE, shelfG, tapes: () => tapes, setFig, take, carry, drop, slotX, order: () => order, CAR, VIEW, s: () => cs.p, zoomBy, scene, cam, F: () => F, gantries: () => gantries, play, placed: () => placed,
  P: () => P, build: () => F.build(), fan: () => fan, sils: () => sils, snd: () => ({ state: SND.ctx && SND.ctx.state, time: SND.ctx && SND.ctx.currentTime, vol: P.vol, on: P.sound, ctx: SND.ctx, out: SND.out }), sfx: SFX,
  tick: () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } frame(); },   // (tests: one frame now, the figure stepped and drawn)
  win: () => { const g = gantries[0]; for (const i of [0, 4, 8]) { const b = g.stack.pop(), c = cellAt(i); b.g.position.set(c.x, SOCK_Y + BOXS / 2, c.z); boxesOn[i] = b; placed[i] = 'X'; } endState = { t0: performance.now(), line: [0, 4, 8] }; paint(); wake(); } };   // (tests: a won game, to watch the ending)
