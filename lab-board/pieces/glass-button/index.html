<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Button · lab</title>
<meta name="description" content="A button made of a convex slab of glass. It magnifies the print under it, folds a mirrored copy along its edge and throws a shadow with a bright caustic; the bead and the star inside are real 3D.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1b1c20; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.2,1.6,.4,1); }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{
    background:linear-gradient(135deg, #e7e8eb 0%, #c3c6cb 50%, #8f959c 100%);
    color:var(--ink); font-family:"Inter Tight", system-ui, sans-serif; overflow:hidden;
    -webkit-font-smoothing:antialiased; touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #gl{position:fixed; inset:0; width:100%; height:100%; display:block}
  .stage{position:fixed; inset:0; display:grid; place-items:center}
  .anchor{position:relative; font-size:clamp(20px, 3.4vw, 36px)}

  /* The DOM button is the real, accessible control. With WebGL it is invisible and only gives the
     canvas its geometry (pill, bead, label, chevron); the glass itself is drawn in the shader. */
  .btn{
    position:relative; display:inline-flex; align-items:center; gap:.62em;
    height:3.1em; padding:0 1.2em 0 .5em; border:0; border-radius:999px; cursor:pointer;
    font:inherit; font-weight:500; letter-spacing:-.01em; line-height:1; color:transparent; background:transparent;
    outline:none; -webkit-tap-highlight-color:transparent;
  }
  .btn:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 0 0 6px rgba(20,20,20,.3)}
  .btn .orb{flex:none; width:2.12em; height:2.12em; border-radius:50%}
  .btn .label{white-space:nowrap}
  .btn .chev{width:.66em; height:.66em; margin-left:.02em; stroke:transparent}
  /* fallback when WebGL is not there: a plain frosted pill */
  .no-gl .btn{color:var(--ink); background:rgba(255,255,255,.4); box-shadow:inset 0 1px 0 #fff, 0 .6em 1.2em -.6em rgba(0,0,0,.35); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px)}
  .no-gl .btn .orb{background:radial-gradient(circle at 40% 35%, #6a6e75, #1f2125)}
  .no-gl .btn .chev{stroke:currentColor}

  /* ---------- glass menu ---------- */
  .menu{
    position:absolute; left:0; top:calc(100% + .38em); min-width:100%; padding:.2em; margin:0; list-style:none;
    border-radius:.7em; font-size:.5em; color:var(--ink);
    background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.38));
    -webkit-backdrop-filter:blur(16px) saturate(1.4); backdrop-filter:blur(16px) saturate(1.4);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.4), 0 1.2em 2.4em -1.2em rgba(38,46,56,.45);
    transform-origin:1.4em 0; transform:scale(.92) translateY(-.3em); opacity:0; pointer-events:none;
    transition:transform .45s var(--spring), opacity .2s var(--ease);
  }
  .menu.open{transform:none; opacity:1; pointer-events:auto}
  .menu li{
    display:flex; align-items:center; gap:.7em; padding:.8em 1em; border-radius:.5em; cursor:pointer; outline:none;
    background:radial-gradient(6em 3em at var(--ix, 50%) 50%, rgba(255,255,255,var(--ia, 0)), transparent 70%);
  }
  .menu li:focus-visible{box-shadow:inset 0 0 0 2px rgba(20,20,20,.35)}
  .menu li .dot{width:.5em; height:.5em; border-radius:50%; flex:none}
  .menu li .k{margin-left:auto; opacity:.45; font-size:.86em}

  .meta{position:fixed; left:clamp(16px, 3vw, 32px); right:clamp(16px, 3vw, 32px); display:flex; justify-content:space-between; font-size:13px; color:rgba(20,20,20,.72); pointer-events:none; z-index:2}
  .meta a{color:inherit; pointer-events:auto}
  .meta.top{top:18px} .meta.bottom{bottom:18px}
  .meta b{font-weight:600; color:var(--ink)}
  body.bare .meta{display:none}
  @media (max-width:520px){ .meta.bottom{flex-direction:column; gap:4px} }
  @media (prefers-reduced-motion:reduce){ .menu{transition-duration:.01s} }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="meta top"><a href="../../">← lab</a><span><b>01</b> · glass button</span></div>
<main class="stage">
  <div class="anchor" id="anchor">
    <button class="btn" id="btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
      <span class="orb" id="orb" aria-hidden="true"></span>
      <span class="label" id="label">Ask agents</span>
      <svg class="chev" id="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
    </button>
    <ul class="menu" id="menu" role="menu" aria-label="Agents">
      <li role="menuitem" tabindex="-1"><span class="dot" style="background:#ff8a3b"></span>Research<span class="k">R</span></li>
      <li role="menuitem" tabindex="-1"><span class="dot" style="background:#3d86ff"></span>Design<span class="k">D</span></li>
      <li role="menuitem" tabindex="-1"><span class="dot" style="background:#35c27a"></span>Build<span class="k">B</span></li>
    </ul>
  </div>
</main>
<div class="meta bottom"><span>move · press · open</span><span>study after a shot found on <a href="https://recent.design" target="_blank" rel="noreferrer">recent.design</a></span></div>

<script>
// Glass Button v3: the whole scene is one fragment shader.
// Under the glass lies a "print": the page background, a faint grid, the label and the chevron (a 2D canvas
// texture) plus an analytic 3D bead with a puffy star. Over it sits a convex capsule of glass, M&M-like:
// its height is a circular arc across the short axis. Rays refract through it (three IORs for dispersion)
// down to the print, so the print is magnified in the middle, squeezed at the edge and folded into a mirrored
// copy along the rim. The glass throws a soft shadow with a bright caustic. The cursor is both the viewer and
// the light, so the refraction and the glints move with the mouse.
const q = new URLSearchParams(location.search);
const STILL = q.has('still');
if (q.has('bare')) document.body.classList.add('bare');
const btn = document.getElementById('btn'), anchor = document.getElementById('anchor'), menu = document.getElementById('menu');
const orbEl = document.getElementById('orb'), labelEl = document.getElementById('label'), chevEl = document.getElementById('chev');
const items = [...menu.querySelectorAll('li')];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- interaction state ----------
const s = { lx: -.35, ly: -.45, tlx: -.35, tly: -.45, hov: 0, thov: 0, press: 0, tpress: 0, jiggle: 0, seen: false, open: false };
function onMove(x, y) {
  s.seen = true;
  const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  s.tlx = Math.max(-1, Math.min(1, (x - cx) / (r.width * 0.9))); s.tly = Math.max(-1, Math.min(1, (y - cy) / (r.height * 2.2)));
  const dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom);
  s.thov = Math.max(0, 1 - Math.hypot(dx, dy) / 160);
}
window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY), { passive: true });
window.addEventListener('pointerleave', () => { s.seen = false; s.thov = 0; });
btn.addEventListener('pointerdown', e => { onMove(e.clientX, e.clientY); s.tpress = 1; s.jiggle = 1; });
window.addEventListener('pointerup', () => { s.tpress = 0; });
window.addEventListener('pointercancel', () => { s.tpress = 0; });

// ---------- menu ----------
function setMenu(open, focusFirst) {
  s.open = open; btn.setAttribute('aria-expanded', String(open)); menu.classList.toggle('open', open); drawPrint();
  if (open && focusFirst) items[0].focus(); if (!open) btn.focus({ preventScroll: true });
}
btn.addEventListener('click', () => setMenu(!s.open, false));
btn.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { e.preventDefault(); setMenu(true, true); } });
menu.addEventListener('keydown', e => {
  const i = items.indexOf(document.activeElement);
  if (e.key === 'Escape') setMenu(false);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(items[i]); }
});
items.forEach(li => {
  li.addEventListener('pointermove', e => { const r = li.getBoundingClientRect(); li.style.setProperty('--ix', `${((e.clientX - r.left) / r.width) * 100}%`); li.style.setProperty('--ia', '.6'); });
  li.addEventListener('pointerleave', () => li.style.setProperty('--ia', '0'));
  li.addEventListener('click', () => choose(li));
});
function choose(li) { labelEl.textContent = `Ask ${li.textContent.replace(/[A-Z]$/, '').trim().toLowerCase()}`; setMenu(false); s.jiggle = 1; }
document.addEventListener('pointerdown', e => { if (!anchor.contains(e.target)) { if (s.open) setMenu(false); } });

// ---------- the print under the glass (2D canvas → texture) ----------
const print = document.createElement('canvas'), pg = print.getContext('2d');
let W = 1, H = 1, DPR = 1, geo = null, printDirty = true;
function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  const b = btn.getBoundingClientRect(), o = orbEl.getBoundingClientRect(), l = labelEl.getBoundingClientRect(), c = chevEl.getBoundingClientRect();
  geo = { cx: b.left + b.width / 2, cy: b.top + b.height / 2, a: (b.width - b.height) / 2, R: b.height / 2,
          orb: [o.left + o.width / 2, o.top + o.height / 2, o.width / 2], label: l, chev: c,
          font: getComputedStyle(btn).fontSize };
}
function drawPrint() { printDirty = true; }
function paintPrint() {
  print.width = Math.round(W * DPR); print.height = Math.round(H * DPR);
  const g = pg; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = g.createLinearGradient(0, 0, W, H);                  // same gradient as the page
  bg.addColorStop(0, '#e7e8eb'); bg.addColorStop(0.5, '#c3c6cb'); bg.addColorStop(1, '#8f959c');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 1;          // a faint grid, so the glass has something to bend
  const step = Math.max(72, Math.round(Math.min(W, H) / 7));
  const ox = (geo.cx % step), oy = (geo.cy % step);
  g.beginPath();
  for (let x = ox - step * 0.5; x < W; x += step) { g.moveTo(Math.round(x) + 0.5, 0); g.lineTo(Math.round(x) + 0.5, H); }
  for (let y = oy - step * 0.5; y < H; y += step) { g.moveTo(0, Math.round(y) + 0.5); g.lineTo(W, Math.round(y) + 0.5); }
  g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.2;        // the rounded frame, like the window the button lives in
  g.beginPath(); g.roundRect(W * 0.09, H * 0.24, W * 1.2, H * 1.2, 72); g.stroke();
  // the print itself: dark ink, sits on the base under the glass
  const L = geo.label, C = geo.chev;
  g.fillStyle = '#1b1c20'; g.font = `500 ${geo.font} "Inter Tight", system-ui, sans-serif`; g.textBaseline = 'middle';
  g.fillText(labelEl.textContent, L.left, L.top + L.height / 2 + 1);
  g.save(); g.translate(C.left + C.width / 2, C.top + C.height / 2); if (s.open) g.rotate(Math.PI);
  const k = C.width / 24; g.strokeStyle = '#1b1c20'; g.lineWidth = 2.5 * k; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-7 * k, -3 * k); g.lineTo(0, 4 * k); g.lineTo(7 * k, -3 * k); g.stroke(); g.restore();
  // a soft contact shadow on the base right under the bead
  const [bx, by, br] = geo.orb, sh = g.createRadialGradient(bx + br * 0.12, by + br * 0.2, br * 0.6, bx + br * 0.12, by + br * 0.2, br * 1.25);
  sh.addColorStop(0, 'rgba(0,0,0,.35)'); sh.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = sh; g.beginPath(); g.arc(bx, by, br * 1.3, 0, 7); g.fill();
  printDirty = false; return true;
}

// ---------- WebGL ----------
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false });
const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
const FS = `precision highp float;
uniform sampler2D uPrint;
uniform vec2 uRes; uniform float uDpr, uTime;
uniform vec4 uPill;          // centre x, y (css px), half length of the straight part, radius
uniform vec3 uOrb;           // bead centre x, y and radius (css px)
uniform vec2 uLook;          // cursor relative to the button, -1..1: the viewer and the light
uniform float uHov, uPress, uJiggle, uWarm;

vec3 lightDir(){ return normalize(vec3(-0.45 + uLook.x * 0.9, -0.62 + uLook.y * 0.9, 0.75)); }   // x right, y down, z to viewer

// the bead: a dark glass sphere with a puffy four-point star floating in it
vec4 bead(vec2 p){
  vec2 d = (p - uOrb.xy) / uOrb.z; float r = length(d);
  if (r > 1.0) return vec4(0.0);
  vec3 n = vec3(d, sqrt(max(1.0 - r * r, 0.0)));
  vec3 L = lightDir(), V = vec3(0.0, 0.0, 1.0);
  float diff = max(dot(n, L), 0.0);
  vec3 col = vec3(0.10, 0.11, 0.13) * (0.5 + 0.7 * diff);
  col += vec3(0.12, 0.13, 0.16) * smoothstep(-0.2, 0.9, d.y) * (1.0 - r * 0.6);               // light gathered at the bottom, like thick glass
  // the star, refracted by the sphere and a little deeper than its surface (parallax with the view)
  vec2 sp = (d * (1.0 - 0.18 * n.z) - uLook * 0.07) / 0.56;
  float e = 0.62, f = pow(abs(sp.x), e) + pow(abs(sp.y), e);
  if (f < 1.06) {
    float h = 0.012;
    float fx = pow(abs(sp.x + h), e) - pow(abs(sp.x - h), e);
    float fy = pow(abs(sp.y + h), e) - pow(abs(sp.y - h), e);
    vec3 ns = normalize(vec3(fx / (2.0 * h) * 0.34, fy / (2.0 * h) * 0.34, 1.0));
    float t = clamp(0.5 + (sp.x + sp.y) * 0.75, 0.0, 1.0);                   // warm top-left, white middle, blue bottom-right
    vec3 warm = mix(vec3(1.0, 0.33, 0.2), vec3(1.0, 0.7, 0.22), uWarm);
    vec3 g = t < 0.5 ? mix(warm, vec3(1.0, 0.98, 0.95), t * 2.0) : mix(vec3(1.0, 0.98, 0.95), vec3(0.16, 0.46, 1.0), (t - 0.5) * 2.0);
    float sd = max(dot(ns, L), 0.0), ss = pow(max(dot(reflect(-L, ns), V), 0.0), 26.0);
    vec3 sc = g * (0.78 + 0.38 * sd) + vec3(1.0) * ss * 0.5;                     // mostly its own colour, shaded just enough to read as puffy
    float edge = 1.0 - smoothstep(0.97, 1.06, f);
    col = mix(col, sc, edge);
    col += g * 0.12 * (1.0 - smoothstep(0.9, 1.6, f));                                          // glow around it
  }
  float spec = pow(max(dot(reflect(-L, n), V), 0.0), 48.0);
  float fres = pow(1.0 - n.z, 3.0);
  col += vec3(1.0) * spec * 0.95 + vec3(0.75, 0.77, 0.82) * fres * 0.55;
  col = mix(col, vec3(0.9, 0.91, 0.94), smoothstep(0.88, 0.97, r) * (1.0 - smoothstep(0.975, 1.0, r)) * (0.5 + 0.5 * max(dot(normalize(vec3(d, 0.0) + 1e-5), L), 0.0)));
  return vec4(col, 1.0 - smoothstep(0.97, 1.0, r));
}
vec3 printAt(vec2 p, float bias){
  vec3 c = texture2D(uPrint, p / uRes, bias).rgb;
  vec4 b = bead(p);
  return mix(c, b.rgb, b.a);
}
float capsule(vec2 p, out vec2 dir){                 // signed depth inside the capsule (px, > 0 inside)
  vec2 q = p - uPill.xy; vec2 cl = vec2(clamp(q.x, -uPill.z, uPill.z), 0.0); vec2 dv = q - cl; float l = length(dv);
  dir = l > 1e-3 ? dv / l : vec2(0.0, 1.0);
  return uPill.w - l;
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uDpr - gl_FragCoord.y) / uDpr;     // css px, y down
  vec3 L = lightDir();
  vec3 col = texture2D(uPrint, p / uRes).rgb;
  float R = uPill.w;
  // shadow on the ground, thrown away from the light, with light focused into a caustic inside it
  vec2 so = -normalize(L.xy) * R * (0.42 + uPress * 0.08);
  vec2 dd; float ds = capsule(p - so, dd);
  float shadow = smoothstep(-R * 0.75, R * 0.45, ds) * 0.26 * (1.0 - uPress * 0.25);
  float caus = smoothstep(R * 0.12, R * 0.8, ds) * (0.3 + 0.25 * uHov);
  col = col * (1.0 - shadow) + vec3(1.0, 0.985, 0.95) * caus * 0.38;
  vec2 dir; float d = capsule(p, dir);
  if (d > -2.0) {
    float x = clamp(d / R, 0.0, 1.0);
    float Hm = R * (0.82 - uPress * 0.12);
    float arc = sqrt(max(2.0 * x - x * x, 0.0));                             // circular cross-section: an M&M, not a slab
    float h = Hm * arc;
    float dhdd = Hm * (1.0 - x) / max(arc, 0.03) / R;
    dhdd *= 1.0 + uJiggle * 0.18 * sin(d * 0.35 - uTime * 18.0);
    vec3 n = normalize(vec3(dir * dhdd, 1.0));
    vec3 V = normalize(vec3(uLook * 0.3, 1.0)), I = -V;
    // through the glass down to the print, one IOR per channel
    vec3 tr = refract(I, n, 1.0 / 1.475), tg = refract(I, n, 1.0 / 1.50), tb = refract(I, n, 1.0 / 1.527);
    float k = 0.95;                                                            // gentle magnification; dispersion shows at the rim, not on the letters
    vec2 orr = tr.xy / max(-tr.z, 0.3) * h * k, org = tg.xy / max(-tg.z, 0.3) * h * k, orb = tb.xy / max(-tb.z, 0.3) * h * k;
    float bias = (1.0 - x) * 1.1;                                              // crisp in the middle, a touch milky at the rim
    vec3 inner = vec3(printAt(p + orr, bias).r, printAt(p + org, bias).g, printAt(p + orb, bias).b);
    // along the rim the glass shows a folded, mirrored copy of what lies inside (like the physical pills)
    float band = smoothstep(0.42, 0.06, x);
    vec3 mir = printAt(p - dir * (d * 2.6 + R * 0.18), bias + 0.6);
    inner = mix(inner, mir, band * 0.42);
    inner = inner * 1.02 + 0.015;
    // the surface: a soft studio reflection that brightens at grazing angles, the key light, a tight glint
    vec3 rf = reflect(I, n);
    float fres = 0.04 + 0.96 * pow(1.0 - max(dot(n, V), 0.0), 5.0);
    vec3 env = vec3(0.96) * smoothstep(0.62, 0.04, abs(rf.z)) + vec3(0.25) * smoothstep(0.0, -0.9, rf.y);
    float key = pow(max(dot(rf, L), 0.0), 260.0) * (0.35 + uHov * 0.25), glint = pow(max(dot(rf, L), 0.0), 1400.0) * 1.1;
    vec3 glass = inner + env * fres * 0.9 + vec3(1.0) * (key + glint);
    // spectral sparks on the rim, where it faces the light
    float rimb = smoothstep(0.2, 0.015, x);
    float facing = pow(max(dot(dir, normalize(L.xy)), 0.0), 3.0);
    vec3 rainbow = 0.5 + 0.5 * cos(6.2831 * (vec3(0.0, 0.33, 0.67) + (p.x - uPill.x) / R * 0.09 + x * 4.0 + uTime * 0.025));
    glass = mix(glass, rainbow * 1.05, rimb * facing * (0.35 + 0.3 * uHov));
    glass += vec3(0.3) * (1.0 - smoothstep(0.0, 1.8, d));                    // the very edge catches light
    col = mix(col, glass, smoothstep(-1.2, 0.8, d));
  }
  gl_FragColor = vec4(col, 1.0);
}`;
let prog = null, U = {}, tex = null;
if (gl) {
  try {
    const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    for (const n of ['uPrint', 'uRes', 'uDpr', 'uTime', 'uPill', 'uOrb', 'uLook', 'uHov', 'uPress', 'uJiggle', 'uWarm']) U[n] = gl.getUniformLocation(prog, n);
    tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.uniform1i(U.uPrint, 0);
  } catch (err) { console.warn('glass off:', err); prog = null; }
}
if (!prog) document.body.classList.add('no-gl');

function upload() {
  if (!paintPrint() || !prog) return;
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, print);
  gl.generateMipmap(gl.TEXTURE_2D);
}
function resize() {
  layout(); printDirty = true;
  if (!prog) return;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); gl.viewport(0, 0, cv.width, cv.height);
}
new ResizeObserver(resize).observe(document.documentElement);
new ResizeObserver(() => { layout(); printDirty = true; }).observe(btn);
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); printDirty = true; });

let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min((t - last) / 1000, 1 / 20); last = t;
  const k = 1 - Math.pow(1 - .12, dt * 60);
  if (!s.seen && !reduce && !STILL) { const w = t / 1000; s.tlx = Math.sin(w * 0.45) * 0.55 - 0.1; s.tly = Math.cos(w * 0.33) * 0.4 - 0.35; }
  s.lx += (s.tlx - s.lx) * k; s.ly += (s.tly - s.ly) * k; s.hov += (s.thov - s.hov) * k;
  s.press += (s.tpress - s.press) * (1 - Math.pow(1 - .3, dt * 60)); s.jiggle *= Math.pow(0.9, dt * 60);

  if (printDirty) upload();
  gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uDpr, DPR); gl.uniform1f(U.uTime, reduce || STILL ? 2 : t / 1000);
  gl.uniform4f(U.uPill, geo.cx, geo.cy, geo.a, geo.R); gl.uniform3f(U.uOrb, geo.orb[0], geo.orb[1], geo.orb[2]);
  gl.uniform2f(U.uLook, s.lx, s.ly); gl.uniform1f(U.uHov, s.hov); gl.uniform1f(U.uPress, s.press); gl.uniform1f(U.uJiggle, s.jiggle);
  gl.uniform1f(U.uWarm, 0.5 + 0.5 * Math.sin(t / 2600));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
if (STILL) Object.assign(s, { hov: .5, thov: .5, seen: true });   // frozen light and time, the loop keeps the canvas painted
requestAnimationFrame(frame);
