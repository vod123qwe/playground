<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Button · lab</title>
<meta name="description" content="A button made of a real, ray-traced lens of glass. The label is printed on its surface, a dark glass bead with a puffy star is set into it, and you can orbit around it to study how it bends the light.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1b1c20; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.2,1.6,.4,1); }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{
    background:linear-gradient(135deg, #e7e8eb 0%, #c3c6cb 50%, #8f959c 100%);
    color:var(--ink); font-family:"Inter Tight", system-ui, sans-serif; overflow:hidden;
    -webkit-font-smoothing:antialiased; touch-action:none; user-select:none; -webkit-user-select:none;
  }
  body.orbiting{cursor:grabbing}
  #gl{position:fixed; inset:0; width:100%; height:100%; display:block}
  .stage{position:fixed; inset:0; display:grid; place-items:center}
  .anchor{position:relative; font-size:clamp(20px, 3.4vw, 36px)}

  /* The DOM button is the real, accessible control. With WebGL it is invisible and only gives the
     canvas its geometry (lens, bead, label, chevron); the glass itself is ray traced in the shader. */
  .btn{
    position:relative; display:inline-flex; align-items:center; gap:.62em;
    height:3.1em; padding:0 1.2em 0 .5em; border:0; border-radius:999px; cursor:pointer;
    font:inherit; font-weight:500; letter-spacing:-.01em; line-height:1; color:transparent; background:transparent;
    outline:none; -webkit-tap-highlight-color:transparent;
  }
  .btn:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 0 0 6px rgba(20,20,20,.3)}
  .btn .orb{flex:none; width:2.12em; height:2.12em; border-radius:50%}
  .btn .label{white-space:nowrap}
  .btn .chev{width:.66em; height:.66em; margin-left:.02em; stroke:transparent}
  /* fallback when WebGL 2 is not there: a plain frosted pill */
  .no-gl .btn{color:var(--ink); background:rgba(255,255,255,.4); box-shadow:inset 0 1px 0 #fff, 0 .6em 1.2em -.6em rgba(0,0,0,.35); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px)}
  .no-gl .btn .orb{background:radial-gradient(circle at 40% 35%, #6a6e75, #1f2125)}
  .no-gl .btn .chev{stroke:currentColor}
  .no-gl .chip{display:none}

  /* ---------- glass menu ---------- */
  .menu{
    position:absolute; left:0; top:calc(100% + .38em); min-width:100%; padding:.2em; margin:0; list-style:none;
    border-radius:.7em; font-size:.5em; color:var(--ink);
    background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.38));
    -webkit-backdrop-filter:blur(16px) saturate(1.4); backdrop-filter:blur(16px) saturate(1.4);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.4), 0 1.2em 2.4em -1.2em rgba(38,46,56,.45);
    transform-origin:1.4em 0; transform:scale(.92) translateY(-.3em); opacity:0; pointer-events:none;
    transition:transform .45s var(--spring), opacity .2s var(--ease);
  }
  .menu.open{transform:none; opacity:1; pointer-events:auto}
  .menu li{
    display:flex; align-items:center; gap:.7em; padding:.8em 1em; border-radius:.5em; cursor:pointer; outline:none;
    background:radial-gradient(6em 3em at var(--ix, 50%) 50%, rgba(255,255,255,var(--ia, 0)), transparent 70%);
  }
  .menu li:focus-visible{box-shadow:inset 0 0 0 2px rgba(20,20,20,.35)}
  .menu li .dot{width:.5em; height:.5em; border-radius:50%; flex:none}
  .menu li .k{margin-left:auto; opacity:.45; font-size:.86em}

  /* ---------- orbit hint / reset ---------- */
  .chip{
    position:fixed; left:50%; bottom:18px; z-index:3; transform:translateX(-50%);
    padding:7px 13px; border:0; border-radius:999px; font:inherit; font-size:12px; line-height:1; color:rgba(20,20,20,.72);
    background:rgba(255,255,255,.42); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 6px 16px -8px rgba(20,24,30,.4);
    opacity:0; pointer-events:none; transition:opacity .35s var(--ease); white-space:nowrap;
  }
  .chip.show{opacity:1}
  .chip.reset{pointer-events:auto; cursor:pointer; color:var(--ink)}
  .chip.reset:hover{background:rgba(255,255,255,.62)}
  .chip:focus-visible{outline:2px solid rgba(20,20,20,.4); outline-offset:2px}
  body.still .chip{display:none}

  .meta{position:fixed; left:clamp(16px, 3vw, 32px); right:clamp(16px, 3vw, 32px); display:flex; justify-content:space-between; font-size:13px; color:rgba(20,20,20,.72); pointer-events:none; z-index:2}
  .meta a{color:inherit; pointer-events:auto}
  .meta.top{top:18px} .meta.bottom{bottom:18px}
  .meta b{font-weight:600; color:var(--ink)}
  body.bare .meta{display:none}
  body:not(.bare) .chip{bottom:52px}
  @media (max-width:520px){ .meta.bottom{flex-direction:column; gap:4px} body:not(.bare) .chip{bottom:70px} }
  @media (prefers-reduced-motion:reduce){ .menu{transition-duration:.01s} }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="meta top"><a href="../../">← lab</a><span><b>01</b> · glass button</span></div>
<main class="stage">
  <div class="anchor" id="anchor">
    <button class="btn" id="btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
      <span class="orb" id="orb" aria-hidden="true"></span>
      <span class="label" id="label">Ask agents</span>
      <svg class="chev" id="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
    </button>
    <ul class="menu" id="menu" role="menu" aria-label="Agents">
      <li role="menuitem" tabindex="-1"><span class="dot" style="background:#ff8a3b"></span>Research<span class="k">R</span></li>
      <li role="menuitem" tabindex="-1"><span class="dot" style="background:#3d86ff"></span>Design<span class="k">D</span></li>
      <li role="menuitem" tabindex="-1"><span class="dot" style="background:#35c27a"></span>Build<span class="k">B</span></li>
    </ul>
  </div>
</main>
<button class="chip" id="chip" type="button" tabindex="-1"></button>
<div class="meta bottom"><span>move · press · open · orbit</span><span>study after a shot found on <a href="https://recent.design" target="_blank" rel="noreferrer">recent.design</a></span></div>

<script>
// Glass Button v4: a small ray tracer in one fragment shader.
// The button is a real solid: a lens shaped like an M&M (a capsule, domed on top, flatter underneath) resting on the
// page. Rays from the camera hit it, refract in (three IORs for dispersion), bounce inside when they hit the rim at a
// grazing angle, refract out and land on the page, so the grid and the shadow are magnified, bent and folded by the
// glass itself. The label and the chevron are printed on the top surface (a decal), crisp and above the refraction,
// like ink on acrylic. The bead is a dark glass sphere set into the lens with a puffy star floating in it.
// Hold the mouse wheel (or Alt) and drag, or use two fingers, to orbit around it.
const q = new URLSearchParams(location.search);
const STILL = q.has('still');
if (q.has('bare')) document.body.classList.add('bare');
if (STILL) document.body.classList.add('still');
const btn = document.getElementById('btn'), anchor = document.getElementById('anchor'), menu = document.getElementById('menu');
const orbEl = document.getElementById('orb'), labelEl = document.getElementById('label'), chevEl = document.getElementById('chev');
const chip = document.getElementById('chip');
const items = [...menu.querySelectorAll('li')];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

// ---------- interaction state ----------
const s = { lx: -.35, ly: -.45, tlx: -.35, tly: -.45, hov: 0, thov: 0, press: 0, tpress: 0, jiggle: 0, seen: false, open: false,
            yaw: 0, pitch: 0, tyaw: 0, tpitch: 0 };
function onMove(x, y) {
  s.seen = true;
  const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  s.tlx = Math.max(-1, Math.min(1, (x - cx) / (r.width * 0.9))); s.tly = Math.max(-1, Math.min(1, (y - cy) / (r.height * 2.2)));
  const dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom);
  s.thov = Math.max(0, 1 - Math.hypot(dx, dy) / 160);
}
window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY), { passive: true });
window.addEventListener('pointerleave', () => { s.seen = false; s.thov = 0; });
btn.addEventListener('pointerdown', e => { if (e.button !== 0 || e.altKey || touches.size > 1) return; onMove(e.clientX, e.clientY); s.tpress = 1; s.jiggle = 1; });
window.addEventListener('pointerup', () => { s.tpress = 0; });
window.addEventListener('pointercancel', () => { s.tpress = 0; });

// ---------- orbit: hold the wheel (or Alt) and drag, or two fingers ----------
const LIM = 1.35, SPEED = 0.0075;
const orbit = { id: null, x: 0, y: 0, moved: 0 };
const touches = new Map();
function turn(dx, dy) {
  s.tyaw = Math.max(-LIM, Math.min(LIM, s.tyaw - dx * SPEED));
  s.tpitch = Math.max(-LIM, Math.min(LIM, s.tpitch + dy * SPEED));
}
window.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });      // no autoscroll
window.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });
window.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') {
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) { s.tpress = 0; document.body.classList.add('orbiting'); }
    return;
  }
  if (e.button === 1 || (e.button === 0 && e.altKey)) {
    e.preventDefault();
    orbit.id = e.pointerId; orbit.x = e.clientX; orbit.y = e.clientY; orbit.moved = 0;
    try { document.documentElement.setPointerCapture(e.pointerId); } catch (err) {}
    document.body.classList.add('orbiting');
  }
});
window.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' && touches.has(e.pointerId)) {
    const t = touches.get(e.pointerId);
    if (touches.size === 2) turn((e.clientX - t.x) * 0.5, (e.clientY - t.y) * 0.5);   // each finger moves half of the centroid
    t.x = e.clientX; t.y = e.clientY; return;
  }
  if (e.pointerId !== orbit.id) return;
  turn(e.clientX - orbit.x, e.clientY - orbit.y);
  orbit.moved += Math.abs(e.clientX - orbit.x) + Math.abs(e.clientY - orbit.y);
  orbit.x = e.clientX; orbit.y = e.clientY;
});
function endPointer(e) {
  if (touches.delete(e.pointerId) && touches.size < 2) document.body.classList.remove('orbiting');
  if (e.pointerId === orbit.id) { orbit.id = null; document.body.classList.remove('orbiting'); }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
function resetView() { s.tyaw = 0; s.tpitch = 0; }
window.addEventListener('keydown', e => { if ((e.key === 'r' || e.key === 'R' || e.key === '0') && !menu.contains(document.activeElement)) resetView(); });
chip.addEventListener('click', () => { resetView(); btn.focus({ preventScroll: true }); });
chip.textContent = coarse ? 'two fingers to orbit' : 'hold the wheel and drag to orbit';
let hintUntil = performance.now() + 6000;

// ---------- menu ----------
function setMenu(open, focusFirst) {
  s.open = open; btn.setAttribute('aria-expanded', String(open)); menu.classList.toggle('open', open); labelDirty = true;
  if (open && focusFirst) items[0].focus(); if (!open) btn.focus({ preventScroll: true });
}
btn.addEventListener('click', e => { if (e.altKey) return; setMenu(!s.open, false); });
btn.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { e.preventDefault(); setMenu(true, true); } });
menu.addEventListener('keydown', e => {
  const i = items.indexOf(document.activeElement);
  if (e.key === 'Escape') setMenu(false);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(items[i]); }
});
items.forEach(li => {
  li.addEventListener('pointermove', e => { const r = li.getBoundingClientRect(); li.style.setProperty('--ix', `${((e.clientX - r.left) / r.width) * 100}%`); li.style.setProperty('--ia', '.6'); });
  li.addEventListener('pointerleave', () => li.style.setProperty('--ia', '0'));
  li.addEventListener('click', () => choose(li));
});
function choose(li) { labelEl.textContent = `Ask ${li.textContent.replace(/[A-Z]$/, '').trim().toLowerCase()}`; setMenu(false); s.jiggle = 1; }
document.addEventListener('pointerdown', e => { if (e.button === 0 && !e.altKey && !anchor.contains(e.target) && e.target !== chip) { if (s.open) setMenu(false); } });

// ---------- geometry from the DOM, and the print on the glass (label + chevron → a small mask texture) ----------
let W = 1, H = 1, RS = 1, geo = null, labelDirty = true;
function layout() {
  W = innerWidth; H = innerHeight; RS = Math.min(Math.max(devicePixelRatio || 1, 1.25), 2);
  const b = btn.getBoundingClientRect(), o = orbEl.getBoundingClientRect(), l = labelEl.getBoundingClientRect(), c = chevEl.getBoundingClientRect();
  geo = { cx: b.left + b.width / 2, cy: b.top + b.height / 2, a: (b.width - b.height) / 2, R: b.height / 2,
          orb: [o.left + o.width / 2, o.top + o.height / 2, o.width / 2], label: l, chev: c,
          font: getComputedStyle(btn).fontSize, rect: [0, 0, 1, 1] };
}
const lab = document.createElement('canvas'), lg = lab.getContext('2d');
function paintLabel() {
  const pad = 6, x0 = geo.cx - geo.a - geo.R - pad, y0 = geo.cy - geo.R - pad, w = (geo.a + geo.R) * 2 + pad * 2, h = geo.R * 2 + pad * 2;
  const sc = Math.min(4, RS * 2);
  lab.width = Math.ceil(w * sc); lab.height = Math.ceil(h * sc);
  const g = lg; g.setTransform(sc, 0, 0, sc, -x0 * sc, -y0 * sc); g.clearRect(x0, y0, w, h);
  const L = geo.label, C = geo.chev;
  g.fillStyle = '#fff'; g.font = `500 ${geo.font} "Inter Tight", system-ui, sans-serif`; g.textBaseline = 'middle';
  g.fillText(labelEl.textContent, L.left, L.top + L.height / 2 + 1);
  g.save(); g.translate(C.left + C.width / 2, C.top + C.height / 2); if (s.open) g.rotate(Math.PI);
  const k = C.width / 24; g.strokeStyle = '#fff'; g.lineWidth = 2.5 * k; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-7 * k, -3 * k); g.lineTo(0, 4 * k); g.lineTo(7 * k, -3 * k); g.stroke(); g.restore();
  geo.rect = [x0, y0, w, h];
  labelDirty = false;
}

// ---------- WebGL 2 ----------
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false });
const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uLabel;
uniform vec2 uRes;             // viewport, css px
uniform float uScale, uTime;   // canvas px per css px
uniform vec4 uPill;            // centre x, y (css px), half length of the straight part, radius
uniform vec3 uOrb;             // bead x, y, radius from the DOM
uniform vec4 uLabelRect;       // where the print texture lies on the button (css px)
uniform vec2 uLook;            // cursor relative to the button, -1..1: drives the light
uniform float uHov, uPress, uJiggle, uWarm, uGrid, uCamDist;
uniform vec3 uCamR, uCamD, uCamF;   // camera right, screen-down, forward (world: x right, y down, z up to the viewer)
out vec4 fragColor;

float ZC, HT, HB, BR; vec3 BC, L;   // lens centre plane, top and bottom heights, bead, light

// ---------- the page: gradient, faint grid, the rounded frame, shadows ----------
float lineA(float dist, float w, float fp){ fp = max(fp, 0.35); return clamp((w * 0.5 + fp * 0.5 - dist) / fp, 0.0, 1.0) * min(1.0, w / fp); }
float cap2(vec2 q){ vec2 d = q - uPill.xy; d.x -= clamp(d.x, -uPill.z, uPill.z); return uPill.w - length(d); }
vec3 sky(vec3 d){
  vec3 c = mix(vec3(0.86, 0.87, 0.9), vec3(0.97, 0.975, 0.985), smoothstep(-0.05, 0.7, d.z));
  c += vec3(1.0) * smoothstep(0.9, 0.985, dot(d, L)) * 0.7;                                     // the key softbox
  c += vec3(0.95, 0.97, 1.0) * smoothstep(0.16, 0.04, abs(d.y + 0.34)) * smoothstep(0.25, 0.55, d.z) * 0.35;   // a long strip light
  return c;
}
vec3 pageAt(vec2 q, float fp){
  float t = clamp((q.x / uRes.x + q.y / uRes.y) * 0.5, 0.0, 1.0);
  vec3 c = t < 0.5 ? mix(vec3(0.906, 0.910, 0.922), vec3(0.765, 0.776, 0.796), t * 2.0)
                   : mix(vec3(0.765, 0.776, 0.796), vec3(0.561, 0.584, 0.612), t * 2.0 - 1.0);
  vec2 f = fract((q - uPill.xy) / uGrid + 0.5), gd = min(f, 1.0 - f) * uGrid;
  float g = max(lineA(gd.x, 1.0, fp), lineA(gd.y, 1.0, fp)) * 0.3;
  vec2 fc = vec2(0.69, 0.84) * uRes, fh = vec2(0.6) * uRes; float fr = 72.0;
  vec2 fq = abs(q - fc) - fh + fr; float fd = abs(length(max(fq, 0.0)) + min(max(fq.x, fq.y), 0.0) - fr);
  g = max(g, lineA(fd, 1.2, fp) * 0.55);
  c = mix(c, vec3(1.0), g);
  // shadow thrown away from the light, with light focused into a caustic inside it
  float R = uPill.w;
  vec2 so = -normalize(L.xy) * R * (0.42 + uPress * 0.08);
  float ds = cap2(q - so);
  float shadow = smoothstep(-R * 0.75, R * 0.45, ds) * 0.2 * (1.0 - uPress * 0.25);
  float caus = smoothstep(R * 0.12, R * 0.8, ds) * (0.38 + 0.25 * uHov);
  float db = BR - length(q - BC.xy + normalize(L.xy) * BR * 0.7);
  shadow = max(shadow, smoothstep(-BR * 0.5, BR * 0.6, db) * 0.18);
  c = c * (1.0 - shadow) + vec3(1.0, 0.985, 0.95) * caus * 0.38;
  // far away the floor fades into the room
  float far = smoothstep(length(uRes) * 0.8, length(uRes) * 4.0, length(q - uPill.xy));
  return mix(c, sky(vec3(0.0, -0.3, 0.12)) * 0.93, far);
}
vec3 envAt(vec3 p, vec3 d){
  if (d.z < -1e-3) { float t = -p.z / d.z; return pageAt(p.xy + d.xy * t, 1.0 + t * 0.02); }
  return sky(d);
}

// ---------- the bead: a dark glass sphere with a puffy four-point star floating in it ----------
vec3 beadShade(vec3 P, vec3 rd){
  vec3 n = normalize(P - BC), lp = P - BC;
  float diff = max(dot(n, L), 0.0);
  vec3 col = vec3(0.10, 0.11, 0.13) * (0.5 + 0.7 * diff);
  col += vec3(0.12, 0.13, 0.16) * smoothstep(-0.2, 0.9, n.y) * (0.4 + 0.6 * max(n.z, 0.0));  // light gathered at the bottom
  vec3 t = refract(rd, n, 1.0 / 1.5);
  float tf = -2.0 * dot(lp, t);
  if (abs(t.z) > 1e-4) {
    float tp = -lp.z / t.z;                                   // the star lies on the plane through the centre
    if (tp > 0.0 && tp < tf) {
      vec2 sp = (lp.xy + t.xy * tp) / (BR * 0.6);
      float e = 0.62, f = pow(abs(sp.x), e) + pow(abs(sp.y), e);
      if (f < 1.6) {
        float h = 0.012;
        float fx = pow(abs(sp.x + h), e) - pow(abs(sp.x - h), e), fy = pow(abs(sp.y + h), e) - pow(abs(sp.y - h), e);
        vec3 ns = normalize(vec3(fx / (2.0 * h) * 0.34, fy / (2.0 * h) * 0.34, 1.0));
        float g0 = clamp(0.5 + (sp.x + sp.y) * 0.75, 0.0, 1.0);          // warm top-left, white middle, blue bottom-right
        vec3 warm = mix(vec3(1.0, 0.33, 0.2), vec3(1.0, 0.7, 0.22), uWarm);
        vec3 g = g0 < 0.5 ? mix(warm, vec3(1.0, 0.98, 0.95), g0 * 2.0) : mix(vec3(1.0, 0.98, 0.95), vec3(0.16, 0.46, 1.0), (g0 - 0.5) * 2.0);
        float sd = max(dot(ns, L), 0.0), ss = pow(max(dot(reflect(-L, ns), -t), 0.0), 26.0);
        vec3 sc = g * (0.78 + 0.38 * sd) + vec3(1.0) * ss * 0.5;
        col = mix(col, sc, 1.0 - smoothstep(0.97, 1.06, f));
        col += g * 0.12 * (1.0 - smoothstep(0.9, 1.6, f));
      }
    }
  }
  vec3 rf = reflect(rd, n);
  float F = 0.04 + 0.96 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
  col = mix(col, envAt(P, rf), F * 0.85);
  col += vec3(1.0) * pow(max(dot(rf, L), 0.0), 48.0) * 0.95;
  return col;
}

// ---------- the lens: an M&M capsule, exact ray intersection ----------
vec2 capInt(vec3 ro, vec3 rd, float a, float R){        // capsule along x through the origin; (near, far), empty if near > far
  float tn = 1e9, tf = -1e9;
  float A = dot(rd.yz, rd.yz), B = dot(ro.yz, rd.yz), C = dot(ro.yz, ro.yz) - R * R;
  if (A > 1e-9) {
    float h = B * B - A * C;
    if (h > 0.0) {
      h = sqrt(h); float t0 = (-B - h) / A, t1 = (-B + h) / A;
      if (abs(rd.x) > 1e-9) { float s0 = (-a - ro.x) / rd.x, s1 = (a - ro.x) / rd.x; t0 = max(t0, min(s0, s1)); t1 = min(t1, max(s0, s1)); }
