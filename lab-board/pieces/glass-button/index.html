<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Button · lab</title>
<meta name="description" content="A button made of a real, ray-traced solid of glass with a tuning panel: shape, dome or dish, refraction, light, label and layout. The label is printed on its surface and a clear glass bead with a holographic star is set into it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Inter+Tight:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1b1c20; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.2,1.6,.4,1); }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{
    background:linear-gradient(135deg, #e7e8eb 0%, #c3c6cb 50%, #8f959c 100%);
    color:var(--ink); font-family:"Inter Tight", system-ui, sans-serif; overflow:hidden;
    -webkit-font-smoothing:antialiased; touch-action:none; user-select:none; -webkit-user-select:none;
  }
  body.dark{background:linear-gradient(135deg, #2a2c31 0%, #1c1d21 50%, #111215 100%)}
  body.orbiting{cursor:grabbing}
  #gl{position:fixed; inset:0; width:100%; height:100%; display:block}
  .stage{position:fixed; inset:0; display:grid; place-items:center; transition:right .45s var(--ease), bottom .45s var(--ease)}
  .anchor{position:relative; font-size:calc(clamp(20px, 3.4vw, 36px) * var(--scale, 1))}

  /* The DOM button is the real, accessible control and the layout engine: its size hugs the label (auto layout),
     and the canvas reads its geometry every frame. With WebGL it is invisible; the solid is ray traced in the shader. */
  .btn{
    position:relative; display:inline-flex; align-items:center; gap:var(--gap, .62em);
    height:var(--h, 3.1em); padding:0 var(--pr, 1.2em) 0 var(--pl, .5em); border:0; border-radius:var(--rad, 999px); cursor:pointer;
    font:inherit; font-weight:var(--fw, 500); letter-spacing:-.01em; line-height:1; color:transparent; background:transparent;
    outline:none; -webkit-tap-highlight-color:transparent;
  }
  .btn:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 0 0 6px rgba(20,20,20,.3)}
  .btn .orb{flex:none; width:var(--orb, 2.12em); height:var(--orb, 2.12em); border-radius:50%}
  .btn .label{white-space:nowrap}
  .btn .chev{width:.66em; height:.66em; margin-left:.02em; stroke:transparent; flex:none}
  .btn.no-bead .orb, .btn.no-chev .chev{display:none}
  /* fallback when WebGL 2 is not there: a plain frosted pill */
  .no-gl .btn{color:var(--ink); background:rgba(255,255,255,.4); box-shadow:inset 0 1px 0 #fff, 0 .6em 1.2em -.6em rgba(0,0,0,.35); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px)}
  .no-gl .btn .orb{background:radial-gradient(circle at 40% 35%, #6a6e75, #1f2125)}
  .no-gl .btn .chev{stroke:currentColor}
  .no-gl .chip, .no-gl .tune, .no-gl .panel{display:none}
  .no-gl #gl{visibility:hidden}

  /* ---------- glass menu ---------- */
  .menu{
    position:absolute; left:0; top:calc(100% + .38em); min-width:100%; padding:.55em; margin:0; list-style:none;
    display:flex; flex-direction:column; gap:.3em;
    border-radius:.7em; font-size:.5em; color:var(--ink);
    background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.38));
    -webkit-backdrop-filter:blur(16px) saturate(1.4); backdrop-filter:blur(16px) saturate(1.4);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.4), 0 1.2em 2.4em -1.2em rgba(38,46,56,.45);
    transform-origin:1.4em 0; transform:scale(.92) translateY(-.3em); opacity:0; pointer-events:none;
    transition:transform .45s var(--spring), opacity .2s var(--ease);
  }
  .menu.open{transform:none; opacity:1; pointer-events:auto}
  .menu li{
    display:flex; align-items:center; gap:.95em; padding:1.4em 1.75em; border-radius:.5em; cursor:pointer; outline:none;
    background:radial-gradient(6em 3em at var(--ix, 50%) 50%, rgba(255,255,255,var(--ia, 0)), transparent 70%);
  }
  .menu li:focus-visible{box-shadow:inset 0 0 0 2px rgba(20,20,20,.35)}
  .menu li .dot{width:.8em; height:.8em; border-radius:50%; flex:none}
  .menu li .nm{font-size:1.14em; font-weight:600; letter-spacing:-.01em}
  .menu li .tx{display:flex; flex-direction:column; gap:.22em; line-height:1.1}
  .menu li .ds{font-size:.76em; opacity:.55}
  .menu li .k{margin-left:auto; padding:.18em .5em; border:1px solid rgba(20,20,20,.25); border-radius:.35em; font:inherit; font-size:.8em; opacity:.7}
  .menu{min-width:max(100%, 15em)}
  /* with WebGL the menu is drawn as part of the glass; the DOM list stays for focus, keys and screen readers */
  .gl .menu{background:none; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; color:transparent; transform:none; transition:opacity 0s}
  .gl .menu li{background:none} .gl .menu li .dot{visibility:hidden} .gl .menu li:focus-visible{box-shadow:none} .gl .menu li .k{border-color:transparent}

  /* ---------- orbit hint / reset ---------- */
  /* hints: two small mouse icons instead of words (click and hold · hold the wheel and drag) */
  .hints{position:fixed; left:clamp(16px, 3vw, 32px); bottom:18px; z-index:2; display:flex; gap:14px; color:rgba(20,20,20,.55); pointer-events:auto}
  .hint-i{display:grid; place-items:center; height:28px}
  .hint-i:first-child svg{width:25px; height:25px} .hint-i:last-child svg{width:37px; height:25px}
  body.dark .hints{color:rgba(255,255,255,.55)}
  body.still .hints{display:none}
  @media (pointer:coarse){ .hints{display:none} }
  /* the motion prompt on phones (iOS asks for permission only after a tap) */
  .tilt{position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:8; display:grid; grid-template-columns:auto 1fr; gap:10px 14px; align-items:center;
        padding:18px; color:var(--ink); background:rgba(250,250,251,.96); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
        box-shadow:0 0 0 1px rgba(20,20,20,.1), 0 24px 50px -28px rgba(20,24,30,.5); font-size:13px}
  .tilt[hidden]{display:none}
  .tilt-i{width:32px; height:32px}
  .tilt-x b{font-weight:600} .tilt-x p{margin:4px 0 0; color:rgba(20,20,20,.55); line-height:1.4}
  .tilt-b{grid-column:1 / -1; display:flex; gap:8px}
  .tilt-b button{flex:1; padding:11px 12px; border:0; font:inherit; font-weight:500; cursor:pointer; color:var(--ink); background:transparent; box-shadow:inset 0 0 0 1px rgba(20,20,20,.14)}
  .tilt-b #tilt-yes{background:var(--ink); color:#fff; box-shadow:none}
  body.still .tilt{display:none}
  .chip{
    position:fixed; left:50%; bottom:18px; z-index:3; transform:translateX(-50%);
    padding:7px 13px; border:0; border-radius:999px; font:inherit; font-size:12px; line-height:1; color:rgba(20,20,20,.72);
    background:rgba(255,255,255,.42); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 6px 16px -8px rgba(20,24,30,.4);
    opacity:0; pointer-events:none; transition:opacity .35s var(--ease), left .45s var(--ease); white-space:nowrap;
  }
  .chip.show{opacity:1}
  .chip.reset{pointer-events:auto; cursor:pointer; color:var(--ink)}
  .chip.reset:hover{background:rgba(255,255,255,.62)}
  .chip:focus-visible{outline:2px solid rgba(20,20,20,.4); outline-offset:2px}

  /* ---------- tuning panel ---------- */
  .tune{
    position:fixed; top:12px; right:12px; z-index:6; display:flex; align-items:center; gap:7px; height:32px; padding:0 13px 0 11px;
    border:0; border-radius:999px; font:inherit; font-size:12px; font-weight:500; color:var(--ink); cursor:pointer;
    background:rgba(255,255,255,.5); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 6px 16px -8px rgba(20,24,30,.4);
  }
  .tune:hover{background:rgba(255,255,255,.7)}
  .tune:focus-visible{outline:2px solid rgba(20,20,20,.4); outline-offset:2px}
  .tune svg{width:15px; height:15px}
  .panel{
    position:fixed; top:54px; right:12px; bottom:12px; width:328px; z-index:5; overflow:auto; overscroll-behavior:contain;
    padding:0 18px; border-radius:16px; font-size:12.5px; color:var(--ink); scroll-behavior:smooth; scrollbar-gutter:stable;
    background:rgba(248,248,250,.82); -webkit-backdrop-filter:blur(18px) saturate(1.3); backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 20px 50px -24px rgba(20,24,30,.5);
    transform:translateX(calc(100% + 24px)); visibility:hidden; transition:transform .45s var(--ease), visibility 0s .45s;
    touch-action:pan-y; scrollbar-width:thin; scrollbar-color:rgba(20,20,20,.18) transparent;
  }
  body.tuning .panel{transform:none; visibility:visible; transition:transform .45s var(--ease)}
  .panel::-webkit-scrollbar{width:10px}
  .panel::-webkit-scrollbar-thumb{border:3px solid transparent; border-radius:10px; background:rgba(20,20,20,.16) padding-box}
  .panel::-webkit-scrollbar-thumb:hover{background:rgba(20,20,20,.3) padding-box}
  .panel::-webkit-scrollbar-track{background:transparent}
  .grp{margin:0 -18px; padding:0 18px}
  .grp + .grp{border-top:1px solid rgba(20,20,20,.1)}               /* full-width dividers between the main groups */
  .gh{
    position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; width:calc(100% + 36px); margin:0 -18px;
    height:46px; padding:0 18px; border:0; font:inherit; font-size:13px; font-weight:600; letter-spacing:-.005em; color:var(--ink); cursor:pointer;
    background:rgba(247,247,249,.94); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .gh:hover{color:#000}
  .gh svg{width:16px; height:16px; opacity:.45; transition:transform .3s var(--ease)}
  .grp.open .gh svg{transform:rotate(180deg)}
  .gh:focus-visible{outline:2px solid rgba(20,20,20,.35); outline-offset:-2px}
  .gb{display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s var(--ease)}
  .grp.open .gb{grid-template-rows:1fr}
  .gi{overflow:hidden; min-height:0}
  .grp.open .gi{padding-bottom:14px}
  .row{display:grid; grid-template-columns:1fr auto; align-items:center; gap:2px 10px; padding:7px 0; color:rgba(20,20,20,.82)}
  .row[hidden]{display:none}
  .row .v{display:flex; align-items:center; gap:3px; font-variant-numeric:tabular-nums; color:rgba(20,20,20,.5); font-size:12px}
  .row .v .num{width:52px; padding:2px 5px; margin:0 -5px 0 0; border:0; border-radius:5px; font:inherit; font-size:inherit; color:inherit; text-align:right; background:transparent; box-shadow:none;
               user-select:text; -webkit-user-select:text; outline:none; cursor:text}
  .row .v .num:hover{background:rgba(20,20,20,.06)}
  .row .v .num:focus{background:#fff; color:var(--ink); box-shadow:inset 0 0 0 1.5px rgba(20,20,20,.4); margin-right:0}
  .row .v .unit:empty, .row .v .pre:empty{display:none}
  .row .full{grid-column:1 / -1}
  .row input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:18px; margin:2px 0 0; background:transparent; cursor:pointer;
    --p:50%;
  }
  .row input[type=range]::-webkit-slider-runnable-track{height:2px; border-radius:2px; background:linear-gradient(to right, var(--ink) var(--p), rgba(20,20,20,.16) var(--p))}
  .row input[type=range]::-moz-range-track{height:2px; border-radius:2px; background:rgba(20,20,20,.16)}
  .row input[type=range]::-moz-range-progress{height:2px; border-radius:2px; background:var(--ink)}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:14px; height:14px; margin-top:-6px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.22), 0 2px 5px rgba(0,0,0,.2)}
  .row input[type=range]::-moz-range-thumb{width:14px; height:14px; border:0; border-radius:50%; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.22), 0 2px 5px rgba(0,0,0,.2)}
  .row input[type=range]:focus-visible{outline:2px solid rgba(20,20,20,.35); outline-offset:2px; border-radius:4px}
  .row input[type=checkbox]{width:15px; height:15px; margin:0; accent-color:#1b1c20; cursor:pointer}
  .row input[type=color]{width:34px; height:22px; padding:0; border:0; border-radius:6px; background:none; cursor:pointer}
  .row input[type=color]::-webkit-color-swatch-wrapper{padding:0} .row input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.15); border-radius:6px}
  .row input[type=text]{
    width:100%; margin-top:4px; padding:7px 9px; border:0; border-radius:8px; font:inherit; font-size:13px; color:var(--ink);
    background:rgba(255,255,255,.75); box-shadow:inset 0 0 0 1px rgba(20,20,20,.12); user-select:text; -webkit-user-select:text; outline:none;
  }
  .row input[type=text]:focus{box-shadow:inset 0 0 0 1.5px rgba(20,20,20,.45)}
  .seg{display:flex; gap:2px; padding:2px; border-radius:8px; background:rgba(20,20,20,.07)}
  .row.wide .seg{margin-top:6px} .row.wide .seg button{flex:1; padding:7px 0}
  .seg button{border:0; padding:4px 10px; border-radius:6px; font:inherit; font-size:11.5px; color:rgba(20,20,20,.65); background:transparent; cursor:pointer}
  .seg button[aria-pressed=true]{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .bgs{display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:6px}
  .bgs button{position:relative; padding:0; border:0; border-radius:8px; overflow:hidden; cursor:pointer; background:#ddd; aspect-ratio:16 / 10; box-shadow:inset 0 0 0 1px rgba(20,20,20,.12)}
  .bgs button canvas, .bgs button img{display:block; width:100%; height:100%; object-fit:cover}
  .bgs button span{position:absolute; left:4px; bottom:3px; font-size:9.5px; line-height:1.2; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.7); pointer-events:none}
  .bgs button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
  .bgs button.up{display:grid; place-items:center; background:rgba(255,255,255,.75); font:inherit; font-size:11px; color:var(--ink)}
  .bgs button.up svg{width:16px; height:16px; margin-bottom:2px}
  .hint{margin:6px 0 0; font-size:11px; color:rgba(20,20,20,.5)}
  .drop{position:fixed; inset:10px; z-index:9; display:grid; place-items:center; border:2px dashed rgba(20,20,20,.35); border-radius:18px;
        background:rgba(255,255,255,.35); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); font-size:15px; font-weight:500; color:var(--ink);
        opacity:0; pointer-events:none; transition:opacity .2s var(--ease)}
  body.dragging .drop{opacity:1}
  .presets{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px}
  .row .act{margin-top:4px; padding:7px 10px; border:0; border-radius:8px; font:inherit; font-size:11.5px; color:var(--ink); cursor:pointer;
    background:rgba(255,255,255,.75); box-shadow:inset 0 0 0 1px rgba(20,20,20,.1)}
  .row .act:hover{background:#fff}
  .presets button, .acts button{
    border:0; padding:6px 10px; border-radius:999px; font:inherit; font-size:11.5px; color:var(--ink); cursor:pointer;
    background:rgba(255,255,255,.75); box-shadow:inset 0 0 0 1px rgba(20,20,20,.1);
  }
  .presets button:hover, .acts button:hover{background:#fff}
  .presets button[aria-pressed=true]{background:var(--ink); color:#fff; box-shadow:none}
  .panel button:focus-visible{outline:2px solid rgba(20,20,20,.4); outline-offset:1px}
  .acts{position:sticky; bottom:0; z-index:2; display:flex; gap:8px; margin:0 -18px; padding:12px 18px 16px;
        background:rgba(247,247,249,.94); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border-top:1px solid rgba(20,20,20,.07)}
  .acts button{flex:1}
  @media (min-width:761px){
    body.tuning .stage{right:352px}
    body.tuning .chip{left:calc(50% - 176px)}
  }
  @media (max-width:760px){
    .panel{top:auto; left:8px; right:8px; bottom:8px; width:auto; max-height:50vh; transform:translateY(calc(100% + 16px))}
    body.tuning .stage{bottom:50vh}
    body.tuning .chip{display:none}
  }

  .meta{position:fixed; left:clamp(16px, 3vw, 32px); right:clamp(16px, 3vw, 32px); display:flex; justify-content:space-between; font-size:13px; color:rgba(20,20,20,.72); pointer-events:none; z-index:2}
  .meta a{color:inherit; pointer-events:auto}
  .meta.top{top:18px; right:112px} .meta.bottom{bottom:18px}
  .meta b{font-weight:600; color:var(--ink)}
  body.dark .meta{color:rgba(255,255,255,.62)} body.dark .meta b{color:#fff}
  body.bare .meta{display:none}
  body.still .chip, body.still .tune, body.still .panel{display:none}

  @media (max-width:520px){ .meta.bottom{flex-direction:column; gap:4px} }
  @media (prefers-reduced-motion:reduce){ .menu, .panel, .stage{transition-duration:.01s} }

  /* ---------- the chrome: Inter semibold, white pills, no borders ---------- */
  .panel, .tune, .chip, .tilt, .hints, .meta{font-family:"Inter", system-ui, sans-serif}
  .panel{font-weight:600} .panel .hint, .panel .ph p, .row .v, .row .v .num{font-weight:500}
  .meta.top{top:16px; left:16px; right:auto}
  .meta a.back{display:grid; place-items:center; width:46px; height:46px; border-radius:999px; background:#fff; color:#1b1c20;
               box-shadow:none; transition:transform .2s var(--ease)}
  .meta a.back:hover{transform:translateX(-2px)} .meta a.back svg{width:20px; height:20px}
  .meta a.back:focus-visible{outline:2px solid rgba(20,20,20,.4); outline-offset:3px}
  .tune{top:16px; right:16px; height:46px; gap:9px; padding:0 20px 0 16px; border-radius:999px; font-size:14px; font-weight:600;
        color:#1b1c20; background:#fff; -webkit-backdrop-filter:none; backdrop-filter:none; box-shadow:none}
  .tune:hover{background:#fff; transform:translateY(-1px)} .tune svg{width:19px; height:19px}
  .chip{padding:13px 22px; border-radius:999px; font-size:13.5px; font-weight:600; color:#1b1c20; background:#fff;
        -webkit-backdrop-filter:none; backdrop-filter:none; box-shadow:none; bottom:20px}
  .chip.reset{color:#1b1c20} .chip.reset:hover{background:#fff; transform:translateX(-50%) translateY(-1px)}
  .hints{bottom:20px; left:16px; gap:10px; padding:9px 16px; border-radius:999px; background:#fff; color:#1b1c20; box-shadow:none}
  body.dark .hints{color:#1b1c20}
  .hint-i{height:26px} .hint-i:first-child svg{width:24px; height:24px} .hint-i:last-child svg{width:32px; height:24px}

  .dock{position:fixed; left:50%; bottom:20px; z-index:3; display:flex; align-items:center; gap:8px; transform:translateX(-50%); transition:left .45s var(--ease)}
  .tune{top:auto; right:16px; bottom:20px; z-index:4}
  body.tuning .tune{opacity:0; pointer-events:none}                                   /* the panel has its own close */
  .bl{position:fixed; left:16px; bottom:20px; z-index:3; display:flex; align-items:center; gap:8px}
  .bl .hints{position:static; left:auto; bottom:auto; height:46px; box-sizing:border-box}
  .bl .chip{position:static; left:auto; bottom:auto; transform:none; height:46px; padding:0 22px}
  .bl .chip:not(.show){display:none}
  .bl .chip.reset:hover{transform:translateY(-1px)}
  /* secondary: the mouse hints without a background, reset view as an outline button */
  .bl .hints{background:transparent; box-shadow:none; padding:0 4px; align-items:center; color:rgba(20,20,20,.72)}
  .bl .chip{background:transparent; color:#1b1c20; box-shadow:inset 0 0 0 1.5px rgba(20,20,20,.3)}
  .bl .chip.reset:hover{background:rgba(20,20,20,.05)}
  body.dark .bl .hints{color:rgba(255,255,255,.8)}
  body.dark .bl .chip{color:#fff; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
  body.dark .bl .chip.reset:hover{background:rgba(255,255,255,.08)}
  body.still .bl{display:none}
  .vars{touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; will-change:transform}
  .vars.dragging{cursor:grabbing}
  .vars .vn{display:inline-block}
  .vars{display:flex; align-items:center; gap:2px; height:46px; padding:0 5px; border-radius:999px; background:#fff; color:#1b1c20;
        font-family:"Inter", system-ui, sans-serif; font-size:13.5px; font-weight:600; box-shadow:none}
  .vars button{display:grid; place-items:center; width:36px; height:36px; padding:0; border:0; border-radius:999px; background:transparent; color:inherit; cursor:pointer}
  .vars button:hover{background:rgba(20,20,20,.06)} .vars button svg{width:18px; height:18px}
  .vars button:focus-visible{outline:2px solid rgba(20,20,20,.35); outline-offset:1px}
  .vars .vn{min-width:76px; padding:0 4px; text-align:center; white-space:nowrap}
  body.still .dock{display:none}
  @media (min-width:761px){ body.tuning .dock{left:calc(50% - 192px)} }
  @media (max-width:760px){ body.tuning .dock{display:none} }

  /* ---------- the panel: edge to edge, minimal, roomy ---------- */
  .panel{top:0; right:0; bottom:0; width:384px; padding:0 28px; font-size:13px;
         background:#fff; box-shadow:-1px 0 0 rgba(20,20,20,.08), -40px 0 80px -60px rgba(20,24,30,.45)}
