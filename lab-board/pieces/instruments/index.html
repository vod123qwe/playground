  /* Three instruments in a light studio, one at a time (the pill at the bottom): a drum kit you build up piece by piece, a wooden

     The saxophone has three ways in: keys like a piano, a tune played note by note (any key or tap), or your breath into the

    if (n.len > .12) { const ye = yOf(n.t + n.len); if (ye < hitY) { c.globalAlpha = n.j === 'miss' ? .2 : .45; c.fillStyle = l.color; rr(c, l.x + l.w / 2 - 5, Math.max(topY, ye), 10, Math.min(y, hitY) - Math.max(topY, ye), 5); c.fill(); } }
    if (hit || y > hitY + 20) { c.globalAlpha = 1; continue; }
    const near = clamp(1 - Math.abs(n.t - now) / .25, 0, 1), sw = (l.w - 14) * (1 + near * .08), h = 16 + near * 2, x = l.x + (l.w - sw) / 2;
    c.globalAlpha = n.j === 'miss' ? .25 : 1; c.fillStyle = l.color; rr(c, x, y - h / 2, sw, h, h / 2); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; rr(c, x + 3, y - h / 2 + 2, sw - 6, h * .38, h * .2); c.fill(); c.globalAlpha = 1; }

  for (const m of G.marks) { const l = byId.get(m.lane); if (!l) continue; const a = 1 - (tn - m.t) / 900, cx = l.x + l.w / 2; c.globalAlpha = a;
    if (m.kind === 'stray') { c.strokeStyle = 'rgba(20,20,20,.45)'; c.lineWidth = 2; c.beginPath(); c.moveTo(cx - 6, hitY - 6); c.lineTo(cx + 6, hitY + 6); c.moveTo(cx + 6, hitY - 6); c.lineTo(cx - 6, hitY + 6); c.stroke(); c.globalAlpha = 1; continue; }
    const y = hitY + clamp(m.dt / HIT.good, -1, 1) * 26, col = m.kind === 'perfect' ? '#1f9d55' : '#c98a1b'; c.fillStyle = col; rr(c, l.x + 8, y - 2, l.w - 16, 4, 2); c.fill();
    c.font = '600 10px Geist, system-ui, sans-serif'; c.textAlign = 'center'; c.fillText(Math.abs(m.dt) < .012 ? 'on time' : `${m.dt < 0 ? 'early' : 'late'} ${Math.round(Math.abs(m.dt) * 1000)} ms`, cx, hitY - 16); c.globalAlpha = 1; }
  G.fx = G.fx.filter(f => tn - f.t < 600);
  for (const f of G.fx) { const l = byId.get(f.lane); if (!l) continue; const k = (tn - f.t) / 600; c.globalAlpha = 1 - k; c.fillStyle = f.kind === 'perfect' ? '#1f9d55' : f.kind === 'good' ? '#c98a1b' : '#b23b3b';
    c.font = `700 ${f.kind === 'perfect' ? 14 : 13}px Geist, system-ui, sans-serif`; c.textAlign = 'center'; c.fillText(f.kind === 'perfect' ? 'Perfect' : f.kind === 'good' ? 'Good' : 'Miss', l.x + l.w / 2, hitY - 38 - k * 26); c.globalAlpha = 1; }
  // the timing bar under the score: the Perfect zone in the middle; each hit a dot, early to the left, late to the right, fading over 4 s
  const mw = Math.min(240, x1 - x0 - 20), mx = W / 2 - mw / 2, my = Math.max(92, topY - 20); G.meter = G.meter.filter(m => tn - m.t < 4000);
  c.fillStyle = 'rgba(20,20,20,.08)'; rr(c, mx, my - 2, mw, 4, 2); c.fill(); c.fillStyle = 'rgba(31,157,85,.25)'; const pz = mw * HIT.perfect / HIT.good / 2; rr(c, W / 2 - pz, my - 3, pz * 2, 6, 3); c.fill();
  c.fillStyle = '#1b1c20'; c.fillRect(W / 2 - .5, my - 7, 1, 14);
  for (const m of G.meter) { c.globalAlpha = 1 - (tn - m.t) / 4000; c.fillStyle = m.kind === 'perfect' ? '#1f9d55' : '#c98a1b'; c.beginPath(); c.arc(W / 2 + clamp(m.dt / HIT.good, -1, 1) * mw / 2, my, 3.5, 0, 7); c.fill(); }
  c.globalAlpha = 1; c.font = '600 10px Geist, system-ui, sans-serif'; c.fillStyle = 'rgba(20,20,20,.4)'; c.textAlign = 'left'; c.fillText('early', mx, my + 16); c.textAlign = 'right'; c.fillText('late', mx + mw, my + 16);
  const done = G.notes.filter(n => n.j).length;
  hud.hidden = false; hud.innerHTML = `<b>${G.score.toLocaleString('en')}</b><span>${G.combo > 1 ? `${G.combo} combo · ×${Math.min(4, 1 + Math.floor(G.combo / 10))}` : `${done} / ${G.notes.length}`}</span>`;
  if (now > G.end) finish(); }
function finish() { G.state = 'done'; caps.hidden = true; hud.hidden = true; hctx.clearRect(0, 0, hwy.width, hwy.height); saxOff();
  const tot = G.notes.length, acc = (G.n.perfect + G.n.good * .6) / tot, stars = acc >= .95 ? 3 : acc >= .8 ? 2 : acc >= .5 ? 1 : 0, id = P.look + ':' + G.song.id + ':' + G.speed;
  const ts = G.meter.length ? G.meter : [], avg = ts.length ? ts.reduce((a, m) => a + m.dt, 0) / ts.length : 0, lean = Math.abs(avg) < .015 ? 'right on the beat' : avg < 0 ? `a touch early (${Math.round(-avg * 1000)} ms)` : `a touch late (${Math.round(avg * 1000)} ms)`;
  let best = bestOf(id), isNew = false; if (!best || G.score > best.score) { isNew = true; best = { score: G.score, stars }; try { const all = JSON.parse(localStorage.getItem(BEST_KEY) || '{}'); all[id] = best; localStorage.setItem(BEST_KEY, JSON.stringify(all)); } catch { } }
  result.innerHTML = `<p class="rs">${starsHtml(stars)}</p><h3>${G.song.name}</h3><p class="rm">${Math.round(G.speed * 100)}% tempo</p>
    <div class="rg"><div><b>${G.score.toLocaleString('en')}</b><span>${isNew ? 'new best' : 'best ' + best.score.toLocaleString('en')}</span></div><div><b>${Math.round(acc * 100)}%</b><span>accuracy</span></div><div><b>${G.maxCombo}</b><span>best combo</span></div></div>
    <p class="rc">${G.n.perfect} perfect · ${G.n.good} good · ${G.n.miss} missed<br>On average ${lean}</p><div class="rb"><button type="button" data-r="again">Again</button><button type="button" data-r="songs">Other songs</button><button type="button" data-r="close">Done</button></div>`;
  result.hidden = false; result.querySelector('[data-r=again]').onclick = () => gameStart(G.song); result.querySelector('[data-r=songs]').onclick = () => { result.hidden = true; openSongs(); }; result.querySelector('[data-r=close]').onclick = gameStop;
  renderTools(); }
function renderGameTools() { const list = SONGS[P.look];
  if (G.state === 'pick') { tools.innerHTML = `<div class="tb songs" role="radiogroup" aria-label="Song">${list.map(s => { const b = bestOf(P.look + ':' + s.id + ':' + pickSpeed); return `<button type="button" data-song="${s.id}">${s.name}${b ? ` <i class="st">${'★'.repeat(b.stars) || '·'}</i>` : ''}</button>`; }).join('')}</div>`
      + `<div class="tb lab-seg" role="radiogroup" aria-label="Tempo">${[.5, .75, 1].map(v => `<button type="button" role="radio" aria-checked="${pickSpeed === v}" data-sp="${v}">${v * 100}%</button>`).join('')}</div><div class="tb"><button type="button" id="songX" aria-label="Close the songs">×</button></div>`;
    tools.querySelectorAll('[data-song]').forEach(b => b.onclick = () => gameStart(list.find(s => s.id === b.dataset.song)));
    tools.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { pickSpeed = +b.dataset.sp; renderTools(); });
    $('songX').onclick = () => { G.state = 'off'; renderTools(); updateHint(); }; return true; }
  if (G.state === 'play' || G.state === 'done') { tools.innerHTML = `<div class="tb"><span class="tl">${G.song.name} · ${Math.round(G.speed * 100)}%</span><button type="button" id="songStop">${G.state === 'play' ? 'Stop' : 'Close'}</button></div>`;
    $('songStop').onclick = gameStop; return true; }
  return false; }

// ---------- the panel ----------
const panel = $('panel'), ctl = {};
function buildPanel() { panel.innerHTML = '';
  const head = document.createElement('header'); head.className = 'ph'; head.innerHTML = '<div><h2>Tune</h2><p>The sound, the letters, and how the instruments look.</p></div><button class="pc" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  head.querySelector('.pc').onclick = () => openPanel(false); panel.appendChild(head);
  const set = (k, v, then) => { P[k] = v; save(); then && then(); };
  const g0 = LabUI.group(panel, 'Sound', { key: KEY + '.g.sound', open: true });
  ctl.vol = LabUI.slider(g0, { label: 'Volume', min: 0, max: 1, step: .01, unit: '', value: P.vol, def: DEF.vol, onInput: v => set('vol', v, () => master.gain.setTargetAtTime(v, ctx.currentTime, .02)) });
  ctl.room = LabUI.slider(g0, { label: 'Room', min: 0, max: .8, step: .01, unit: '', value: P.room, def: DEF.room, onInput: v => set('room', v, () => send.gain.setTargetAtTime(v, ctx.currentTime, .02)) });
  ctl.keys = LabUI.check(g0, { label: 'Show the keyboard letters', value: P.keys, onChange: v => set('keys', v, () => document.body.classList.toggle('nokeys', !v)) });
  const g1 = LabUI.group(panel, 'Look', { key: KEY + '.g.look' });
  ctl.shell = LabUI.seg(g1, { label: 'Drums', options: [['wine', 'Wine'], ['black', 'Black'], ['ocean', 'Ocean'], ['green', 'Green'], ['pearl', 'Pearl']], value: P.shell, onChange: v => set('shell', v, () => setShell(v)) });
  ctl.sax = LabUI.seg(g1, { label: 'Saxophone', options: [['gold', 'Gold'], ['silver', 'Silver'], ['black', 'Black']], value: P.sax, onChange: v => set('sax', v, () => setSax(v)) });
  ctl.light = LabUI.slider(g1, { label: 'Light', min: .5, max: 5, step: .05, unit: '', value: P.light, def: DEF.light, onInput: v => set('light', v, applyLight) });
  ctl.warmth = LabUI.slider(g1, { label: 'Cool to warm', min: 0, max: 1, step: .01, unit: '', value: P.warmth, def: DEF.warmth, onInput: v => set('warmth', v, applyLight) });
  const cr = document.createElement('p'); cr.className = 'credit'; cr.innerHTML = 'Recordings: <a href="https://github.com/sgossner/VCSL" target="_blank" rel="noopener">Versilian Community Sample Library</a> (CC0). Models and surfaces made in code.'; panel.appendChild(cr); }
function openPanel(on) { document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('tuning')) openPanel(false); });

// ---------- the loop ----------
let last = 0, demoT = 0, demoStep = 0;
const GROOVE = { kick: [0, 7, 8, 10], snare: [4, 12], hihat: [0, 2, 4, 6, 8, 10, 12, 14], tom: [13], floor: [14, 15] };
function frame(now) { requestAnimationFrame(frame); const dt = last ? Math.min(.05, (now - last) / 1000) : .016; last = now; if (THUMB) return;
  if (DEMO) { demoT += dt; const s = Math.floor(demoT / .15); while (demoStep <= s) { const k = demoStep % 16; for (const id in GROOVE) if (GROOVE[id].includes(k) && STATE[id]) { const st = STATE[id]; st.t = 0; st.amp = .9; } demoStep++; } }
  animKit(dt); animXylo(dt); animSax(dt); animBreath(dt); placeCam(); renderer.render(scene, camera); placeLabels(); gameFrame(); }

// ---------- start; the board's box: ?thumb=1 all three in one still, ?demo=1 the drums playing a groove (silent) ----------

if (THUMB) { buildKit(6); KIT.visible = XY.visible = SX.visible = true; KIT.position.set(-.92, 0, -.4); KIT.rotation.y = .32; XY.position.set(1.02, 0, -.1); XY.rotation.y = -.42; SX.position.set(.12, 0, .55); SX.rotation.y = -.15;
  for (const id in STATE) STATE[id].born = 9; animKit(0); animXylo(9); animSax(0);
  view.t.set(.05, .6, 0); view.tt.copy(view.t); view.az = view.taz = 0; view.el = view.tel = .3; view.d = view.td = 4.45; resize(); placeCam(); renderer.render(scene, camera); document.body.classList.add('ready'); }
else { buildKit(BARE ? 5 : P.kit); if (!BARE) { buildPanel(); LabUI.variants($('vars'), { prev: $('prev'), next: $('next'), name: $('nm'), onStep: stepLook, items: () => LOOKS, current: () => P.look, onPick: n => applyLook(n) }); }
  applyLook(BARE ? 'Drums' : P.look, true); resize(); placeCam(); document.body.classList.add('ready'); requestAnimationFrame(frame); }
window.INSTR = { get P() { return P; }, G, SONGS, gameStart, gameStop, gameInput, camera, KIT, applyLook, hitPiece, hitBar, BARS, PIECES, STATE, BUF, ctx, saxOn, saxOff };
