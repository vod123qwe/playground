const NET = { peer: null, conn: null, host: false, code: '', offset: 0, partner: null, live: null, final: null, ready: false };
const room = $('room');
const BAND = () => SONGS.Drums.filter(s => s.band);
const loadPeer = () => window.Peer ? Promise.resolve() : new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'; sc.onload = res; sc.onerror = () => rej(new Error('peerjs')); document.head.appendChild(sc); });
const tx = m => { try { if (NET.conn?.open) NET.conn.send(m); } catch { } };
const roomLink = () => location.origin + location.pathname + '?join=' + NET.code;
async function openRoom(joinCode) { room.hidden = false; renderRoom('Connecting…');
  try { await loadPeer(); } catch { renderRoom('Could not load the connection library. Check the network and try again.'); return; }
  if (NET.peer) { renderRoom(); return; }
  if (joinCode) { NET.host = false; NET.code = joinCode; NET.peer = new Peer(); NET.peer.on('open', () => { const c = NET.peer.connect('lab-instr-' + joinCode, { reliable: true }); wire(c); }); }
  else { NET.host = true; NET.code = Math.random().toString(36).slice(2, 8); NET.peer = new Peer('lab-instr-' + NET.code); NET.peer.on('open', () => renderRoom()); NET.peer.on('connection', c => { if (NET.conn?.open) { c.close(); return; } wire(c); }); }
  NET.peer.on('error', e => renderRoom(e.type === 'peer-unavailable' ? 'That room is closed (the host left or the link is old).' : 'The connection failed: ' + (e.type || 'unknown') + '.')); }
function wire(c) { NET.conn = c;
  c.on('open', () => { tx({ t: 'hello', look: P.look, guitar: P.guitar }); if (!NET.host) syncClock(); load(PIECES.flatMap(p => p.sounds).concat(['hhopen']).concat(XYLO.map(x => x.name), SAX.map(x => x.name))); renderRoom(); });
  c.on('data', onData); c.on('close', () => { NET.partner = null; NET.conn = null; NET.ready = false; renderRoom('Your partner left.'); }); }
// (the clock: five pings; the one with the shortest round trip says how far the host's clock is from ours)
let pings = [];
function syncClock() { pings = []; for (let i = 0; i < 5; i++) setTimeout(() => tx({ t: 'ping', a: performance.now() }), i * 150); }
function onData(m) {
  if (m.t === 'hello') { NET.partner = { look: m.look, guitar: m.guitar }; renderRoom(); }
  else if (m.t === 'ping') tx({ t: 'pong', a: m.a, h: performance.now() });
  else if (m.t === 'pong') { const now = performance.now(), rtt = now - m.a; pings.push({ rtt, off: m.h + rtt / 2 - now }); if (pings.length === 5) { const b = pings.sort((x, y) => x.rtt - y.rtt)[0]; NET.offset = b.off; NET.rtt = b.rtt; NET.ready = true; tx({ t: 'synced', rtt: b.rtt }); renderRoom(); } }
  else if (m.t === 'synced') { NET.ready = true; NET.rtt = m.rtt; renderRoom(); }
  else if (m.t === 'start') { const song = SONGS[P.look]?.find(s => s.id === m.song); if (!song) { renderRoom('This song has no part for your instrument.'); return; } pickSpeed = m.speed; room.hidden = true; NET.live = null; NET.final = null; gameStart(song, { at: m.at - NET.offset }); }
  else if (m.t === 'stop') { if (G.state === 'play') gameStop(); }
  else if (m.t === 'hit') remoteHit(m);
  else if (m.t === 'live') NET.live = m;
  else if (m.t === 'final') { NET.final = m; showPartnerResult(); } }
// (the partner's sound, played here: a drum's recording, or a strum on their kind of guitar)
function remoteHit(m) { unlock();
  if (m.look === 'Drums') { const p = PIECES.find(q => q.id === m.id); if (!p) return; if (P.look === 'Drums' && STATE[p.id]) { const st = STATE[p.id]; st.t = 0; st.amp = .8; }
    const name = p.id === 'hihat' && m.open ? 'hhopen' : (p.tiers ? p.tiers[1][0] : p.sounds[0]); play(name, { rate: p.rate || 1, gain: (p.gain || 1) * .85, pan: -.25, out: DK.inp }); }
  else if (m.look === 'Xylophone') { const s2 = nearest(XYLO, m.m); play(s2.name, { rate: Math.pow(2, (m.m - s2.midi) / 12), gain: .75, pan: .25 }); }
  else if (m.look === 'Saxophone') { if (rsax) { fadeOut(rsax, .06); rsax = null; } if (m.on != null) { const s2 = nearest(SAX, m.on), b = BUF[s2.name]; if (!b) { load([s2.name]); return; }
      const src = ctx.createBufferSource(), g = ctx.createGain(), t = ctx.currentTime; src.buffer = b; src.playbackRate.value = Math.pow(2, (m.on - s2.midi) / 12); src.loop = true; src.loopStart = .7; src.loopEnd = Math.max(1, b.duration - .5);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.75, t + .035); src.connect(g); g.connect(bus); src.start(); rsax = { s: src, g }; } }
  else if (m.look === 'Guitar') { const kind = m.kind || 'electric', was = P.guitar; P.guitar = kind; if (m.chord) chordNotes(m.chord, kind).forEach((n, i, a) => pluck(n, i * .01, .8, 6 - a.length + i)); else if (m.note) pluck(m.note, 0, .8, clamp(Math.floor((m.note - 40) / 5), 0, 5)); P.guitar = was; } }
let rsax = null;   // (the partner's saxophone voice)
// (our own hits go out as they happen)
function shareHit(m) { if (NET.conn?.open) tx({ t: 'hit', ...m }); }
function startTogether(id) { if (!NET.host || !NET.ready) return; const at = performance.now() + 2600; tx({ t: 'start', song: id, speed: pickSpeed, at }); room.hidden = true; NET.live = null; NET.final = null; gameStart(SONGS[P.look].find(s => s.id === id), { at }); }
function renderRoom(note) { if (room.hidden) return; const linked = !!NET.conn?.open, mine = true;
  const who = NET.partner ? `Your partner plays the <b>${NET.partner.look === 'Guitar' ? (NET.partner.guitar || 'electric') + ' guitar' : NET.partner.look.toLowerCase()}</b>` : NET.host ? 'Waiting for someone to open the link…' : 'Joining…';
  room.innerHTML = `<h3>Play together</h3>
    ${NET.host && NET.code && NET.peer?.open ? `<p class="rm">Send this link; it works while this page stays open.</p><div class="rl"><input readonly value="${roomLink()}" aria-label="Room link"><button type="button" data-r="copy">Copy</button></div>` : ''}
    <p class="rw">${note ? note : who}${linked && NET.ready ? ` · ${Math.round(NET.rtt || 0)} ms between you` : ''}</p>
    ${!mine ? `<p class="rm">The band songs are for the drums and the guitar.</p><div class="rb"><button type="button" data-r="drums">Drums</button><button type="button" data-r="guitar">Guitar</button></div>` : ''}
    ${NET.host && linked && NET.ready && mine ? `<p class="rm">You play the ${P.look === 'Guitar' ? P.guitar + ' guitar' : P.look.toLowerCase()} · ${(LEVELS.find(l => l[0] === P.level) || [])[1]}. Pick the song:</p><div class="rsongs">${BAND().map(s => `<button type="button" data-song="${s.id}">${s.name}</button>`).join('')}</div>
      <div class="rb">${[.5, .75, 1].map(v => `<button type="button" data-sp="${v}" class="${pickSpeed === v ? 'on' : ''}">${v * 100}%</button>`).join('')}</div>` : ''}
    ${!NET.host && linked && mine ? `<p class="rm">You play the ${P.look === 'Guitar' ? P.guitar + ' guitar' : P.look.toLowerCase()}; the host starts the song.</p>` : ''}
    <div class="rb"><button type="button" data-r="leave">${linked ? 'Leave' : 'Close'}</button></div>`;
  room.querySelector('[data-r=copy]')?.addEventListener('click', e => { navigator.clipboard?.writeText(roomLink()); e.target.textContent = 'Copied'; });
  room.querySelector('[data-r=drums]')?.addEventListener('click', () => applyLook('Drums'));
  room.querySelector('[data-r=guitar]')?.addEventListener('click', () => applyLook('Guitar'));
  room.querySelectorAll('[data-song]').forEach(b => b.onclick = () => startTogether(b.dataset.song));
  room.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { pickSpeed = +b.dataset.sp; renderRoom(); });
  room.querySelector('[data-r=leave]').onclick = leaveRoom; }
function leaveRoom() { try { NET.conn?.close(); NET.peer?.destroy(); } catch { } Object.assign(NET, { peer: null, conn: null, partner: null, ready: false, live: null, final: null }); room.hidden = true; renderTools(); }
function showPartnerResult() { const el = result.querySelector('.rp'); if (!el || !NET.final) return; const f = NET.final;
  el.innerHTML = `<b>Your partner</b> (${f.look.toLowerCase()}): ${f.score.toLocaleString('en')} · ${f.acc}% · ${'★'.repeat(f.stars)}${'☆'.repeat(3 - f.stars)}${G.score > f.score ? ' · you win this one' : G.score < f.score ? ' · they win this one' : ' · a draw'}`; }
setInterval(() => { if (NET.conn?.open && G.state === 'play') tx({ t: 'live', score: G.score, combo: G.combo }); }, 500);

// ---------- the panel ----------
const panel = $('panel'), ctl = {};
function buildPanel() { panel.innerHTML = '';
  const head = document.createElement('header'); head.className = 'ph'; head.innerHTML = '<div><h2>Tune</h2><p>The sound, the letters, and how the instruments look.</p></div><button class="pc" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  head.querySelector('.pc').onclick = () => openPanel(false); panel.appendChild(head);
  const set = (k, v, then) => { P[k] = v; save(); then && then(); };
  const g0 = LabUI.group(panel, 'Sound', { key: KEY + '.g.sound', open: true });
  ctl.vol = LabUI.slider(g0, { label: 'Volume', min: 0, max: 1, step: .01, unit: '', value: P.vol, def: DEF.vol, onInput: v => set('vol', v, () => master.gain.setTargetAtTime(v, ctx.currentTime, .02)) });
  ctl.room = LabUI.slider(g0, { label: 'Room', min: 0, max: .8, step: .01, unit: '', value: P.room, def: DEF.room, onInput: v => set('room', v, () => send.gain.setTargetAtTime(v, ctx.currentTime, .02)) });
  ctl.keys = LabUI.check(g0, { label: 'Show the keyboard letters', value: P.keys, onChange: v => set('keys', v, () => document.body.classList.toggle('nokeys', !v)) });
  const g1 = LabUI.group(panel, 'Look', { key: KEY + '.g.look' });
  ctl.shell = LabUI.seg(g1, { label: 'Drums', options: [['wine', 'Wine'], ['black', 'Black'], ['ocean', 'Ocean'], ['green', 'Green'], ['pearl', 'Pearl']], value: P.shell, onChange: v => set('shell', v, () => setShell(v)) });
  ctl.sax = LabUI.seg(g1, { label: 'Saxophone', options: [['gold', 'Gold'], ['silver', 'Silver'], ['black', 'Black']], value: P.sax, onChange: v => set('sax', v, () => setSax(v)) });
  ctl.light = LabUI.slider(g1, { label: 'Light', min: .5, max: 5, step: .05, unit: '', value: P.light, def: DEF.light, onInput: v => set('light', v, applyLight) });
  ctl.warmth = LabUI.slider(g1, { label: 'Cool to warm', min: 0, max: 1, step: .01, unit: '', value: P.warmth, def: DEF.warmth, onInput: v => set('warmth', v, applyLight) });
  const cr = document.createElement('p'); cr.className = 'credit'; cr.innerHTML = 'Recordings: <a href="https://github.com/sgossner/VCSL" target="_blank" rel="noopener">Versilian Community Sample Library</a> (CC0) and <a href="https://tildesounds.gumroad.com/l/openstringguitar" target="_blank" rel="noopener">Open String Guitar</a> by tildesounds (CC0). Models and surfaces made in code.'; panel.appendChild(cr); }
function openPanel(on) { document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('tuning')) openPanel(false); });

// ---------- the loop ----------
let last = 0, demoT = 0, demoStep = 0;
const GROOVE = { kick: [0, 7, 8, 10], snare: [4, 12], hihat: [0, 2, 4, 6, 8, 10, 12, 14], tom: [13], floor: [14, 15] };
function frame(now) { requestAnimationFrame(frame); const dt = last ? Math.min(.05, (now - last) / 1000) : .016; last = now; if (THUMB) return;
  if (DEMO) { demoT += dt; const s = Math.floor(demoT / .15); while (demoStep <= s) { const k = demoStep % 16; for (const id in GROOVE) if (GROOVE[id].includes(k) && STATE[id]) { const st = STATE[id]; st.t = 0; st.amp = .9; } demoStep++; } }
  animKit(dt); animXylo(dt); animSax(dt); animGuitar(dt); animBreath(dt); placeCam(); renderer.render(scene, camera); placeLabels(); gameFrame(); }

// ---------- start; the board's box: ?thumb=1 all three in one still, ?demo=1 the drums playing a groove (silent) ----------
setShell(P.shell); setSax(P.sax); setGuitar(P.guitar); setKit(P.drumKit); applyLight(); document.body.classList.toggle('nokeys', !P.keys);
if (THUMB) { buildKit(6); KIT.visible = XY.visible = SX.visible = GT.visible = true; KIT.position.set(-1.0, 0, -.45); KIT.rotation.y = .32; XY.position.set(1.08, 0, -.15); XY.rotation.y = -.42; SX.position.set(-.08, 0, .55); SX.rotation.y = -.15; GT.position.set(.36, 0, .5); GT.rotation.y = -.35;
  for (const id in STATE) STATE[id].born = 9; animKit(0); animXylo(9); animSax(0);
  view.t.set(.05, .6, 0); view.tt.copy(view.t); view.az = view.taz = 0; view.el = view.tel = .3; view.d = view.td = 4.45; resize(); placeCam(); renderer.render(scene, camera); document.body.classList.add('ready'); }
else { buildKit(BARE ? 5 : P.kit); if (!BARE) { buildPanel(); LabUI.variants($('vars'), { prev: $('prev'), next: $('next'), name: $('nm'), onStep: stepLook, items: () => LOOKS, current: () => P.look, onPick: n => applyLook(n) }); }
  applyLook(BARE ? 'Drums' : P.look, true); resize(); placeCam(); document.body.classList.add('ready'); requestAnimationFrame(frame);
  if (!BARE && q.has('join')) openRoom(q.get('join')); }
window.INSTR = { get P() { return P; }, NET, openRoom, onData, remoteHit, strum, pickNote, GT, chordNotes, G, SONGS, gameStart, gameStop, gameInput, camera, KIT, applyLook, hitPiece, hitBar, BARS, PIECES, STATE, BUF, ctx, saxOn, saxOff };
</script>
