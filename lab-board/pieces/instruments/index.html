  /* Two instruments in a light studio, one at a time (the pill at the bottom): a drum kit you build up piece by piece, from three

     xylophone. Tap or click what you want to hear, or play from the keyboard (the letters sit on the instrument).
     Real recordings (VCSL and Freesound, CC0), a touch of room on them; the models are built in code, their surfaces drawn in canvas. */
  :root { --bg: #eeede9; --ink: #141414; --muted: rgba(20,20,20,.5); --ease: cubic-bezier(.22,.61,.36,1); --page: #fff; --boxbg: #eeede9; --morph: .55s cubic-bezier(.3,1.12,.4,1); }

  .tb button { height: 38px; min-width: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: rgba(20,20,20,.62); font: inherit; cursor: pointer; white-space: nowrap; transition: background .2s, color .2s; }
  .tb button:hover { color: #1b1c20; background: rgba(20,20,20,.05); }

  .credit { margin: 6px 0 22px; font-size: 12px; line-height: 1.5; color: var(--ui-muted); } .credit a { color: inherit; }

const SHELLS = { wine: '#6e1420', black: '#141416', ocean: '#16466e', pearl: '#e9e3d6', green: '#1f4a35' };
const M = {

  steel: new THREE.MeshStandardMaterial({ color: '#2b2b2f', metalness: .7, roughness: .4 }),

  birch: new THREE.MeshStandardMaterial({ map: woodTex('#d9bc8c', '#a9875a', '#f1dcb4', 64, 512), roughness: .5 }),
  felt: new THREE.MeshStandardMaterial({ color: '#7a1f22', roughness: 1 }),
  resonator: new THREE.MeshStandardMaterial({ color: '#c09752', metalness: 1, roughness: .32 }),

const master = ctx.createGain(); master.gain.value = P.vol;

    for (const p of line) { const pin = cyl(.0025, .0025, .03, M.chrome, 6); pin.position.copy(p).add(new THREE.Vector3(0, .01, 0)); XY.add(pin); } }
  const xl = xOf[LOW] - .09, xr = xOf[HIGH] + .09;
  for (const [x, z] of [[xl, .2], [xl, -.3], [xr, .14], [xr, -.24]]) { XY.add(rod(new THREE.Vector3(x, .83, z), new THREE.Vector3(x, .02, z), .014, M.steel)); const w = cyl(.022, .022, .03, M.rubber, 14); w.position.set(x, .02, z); XY.add(w); }
  XY.add(rod(new THREE.Vector3(xl, .2, -.05), new THREE.Vector3(xr, .2, -.05), .012, M.steel));
  for (const x of [xl, xr]) { const end = new THREE.Mesh(new RoundedBoxGeometry(.03, .06, .58, 2, .01), M.walnut); end.position.set(x, .84, -.04); XY.add(end); }
})();
// (two mallets: birch sticks, wound heads; the nearer one swings down to the bar it plays)
const MALLETS = [-1, 1].map(s => { const g = new THREE.Group(), head = new THREE.Mesh(new THREE.SphereGeometry(.018, 20, 14), M.malletHead), stick = rod(new THREE.Vector3(0, 0, 0), new THREE.Vector3(s * .05, .1, .33), .0045, M.birch); g.add(head, stick);
  const rest = new THREE.Vector3(s * .16, 1.02, .34); g.position.copy(rest); XY.add(g); return { g, rest, from: rest.clone(), to: rest.clone(), t: 9 }; });
shadow(XY);
function hitBar(bar, vel = 1) { const m = bar.userData.midi, s = nearest(XYLO, m); unlock(); play(s.name, { rate: Math.pow(2, (m - s.midi) / 12), gain: .9 * vel, pan: clamp(bar.position.x * 1.2, -.7, .7) });
  bar.userData.t = 0; const mal = bar.position.x < 0 ? MALLETS[0] : MALLETS[1]; mal.from.copy(mal.g.position); mal.to.set(bar.position.x, bar.userData.y + .03, bar.position.z + .03); mal.t = 0;
  const lab = labelFor('x' + m); if (lab) { lab.classList.add('hit'); setTimeout(() => lab.classList.remove('hit'), 110); } }
function animXylo(dt) { for (const b of BARS) { b.userData.t = (b.userData.t ?? 9) + dt; const t = b.userData.t; b.position.y = b.userData.y - .004 * Math.exp(-t * 30) * Math.cos(t * 50); }
  for (const m of MALLETS) { m.t += dt; const t = m.t; if (t < .045) m.g.position.lerpVectors(m.from, m.to, t / .045); else if (t < .5) { const k = (t - .045) / .455, e = 1 - Math.pow(1 - k, 3); m.g.position.lerpVectors(m.to, m.rest, e); } else m.g.position.copy(m.rest); } }

// ---------- the view: each instrument its own frame; a drag looks round a little, the wheel comes closer ----------
const VIEWS = { Drums: { t: [0, .42, -.15], d: 2.95, el: .26, az: 0, pf: 1.3 }, Xylophone: { t: [0, .74, .02], d: 2.35, el: .6, az: 0 } };   // (pf: how much it steps back on a tall screen)
const view = { az: 0, el: .3, d: 3.5, t: new THREE.Vector3(0, .62, 0), taz: 0, tel: .3, td: 3.5, tt: new THREE.Vector3(0, .62, 0) };
// (the kit grows: the frame steps back and up to keep every piece in it; the gong behind lifts it a little more)
const kitFit = () => clamp((Object.keys(STATE).length - 3) / (PIECES.length - 3), 0, 1);
function frameView(name, now) { const v = VIEWS[name] || VIEWS.Drums, k = name === 'Drums' ? kitFit() : 0, gong = name === 'Drums' && STATE.gong ? 1 : 0;
  view.taz = v.az; view.tel = v.el + k * .04; view.td = v.d * (1 + k * 1.05 + gong * .08); view.tt.set(v.t[0], v.t[1] + k * .2 + gong * .08, v.t[2] - k * .25);
  if (name === 'Drums') { const xs = Object.values(STATE).map(st => st.obj.position.x); if (xs.length) view.tt.x = (Math.min(...xs) + Math.max(...xs)) / 2; }   // (the kit's middle, as it grows)
  if (now) { view.az = view.taz; view.el = view.tel; view.d = view.td; view.t.copy(view.tt); } }
function placeCam() { const a = stage.clientWidth / stage.clientHeight, pf = (VIEWS[P.look] || {}).pf ?? 1, fit = a < 1 ? 1 + (Math.min(1.9, .95 / a) - 1) * (THUMB ? 1 : pf) : 1;
  view.az += (view.taz - view.az) * .1; view.el += (view.tel - view.el) * .1; view.d += (view.td - view.d) * .1; view.t.lerp(view.tt, .1);
  const d = view.d * fit; camera.position.set(view.t.x + Math.sin(view.az) * Math.cos(view.el) * d, view.t.y + Math.sin(view.el) * d, view.t.z + Math.cos(view.az) * Math.cos(view.el) * d); camera.lookAt(view.t); camera.updateMatrixWorld(); }
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);

// ---------- the letters on the instrument ----------
const labelsEl = $('labels'), LABELS = new Map();   // id → { el, pos (world), obj }
function refreshLabels() { labelsEl.innerHTML = ''; LABELS.clear(); if (BARE) return;
  const add = (id, text, pos, obj) => { const el = document.createElement('span'); el.textContent = text; labelsEl.appendChild(el); LABELS.set(id, { el, pos, obj }); };
  if (P.look === 'Drums') for (const p of PIECES) { const st = STATE[p.id]; if (!st) continue; if (p.zones) st.obj.userData.labels.forEach((pos, i) => add(p.id + ':' + i, p.keys[i], pos, null)); else add(p.id, p.key, st.obj.userData.label, null); }
  if (P.look === 'Xylophone') for (const b of BARS) { const k = KEYMAP_INV[b.userData.midi - LOW]; if (k) add('x' + b.userData.midi, k.toUpperCase(), null, b); } }
const labelFor = id => LABELS.get(id)?.el;
const V3 = new THREE.Vector3();
function placeLabels() { if (!LABELS.size || document.body.classList.contains('nokeys')) return; const w = stage.clientWidth, h = stage.clientHeight, r = stage.getBoundingClientRect();
  for (const [, L] of LABELS) { if (L.obj) V3.copy(L.obj.position).add(new THREE.Vector3(0, .03, L.obj.userData.len / 2 - .03)).applyMatrix4(XY.matrixWorld); else V3.copy(L.pos).applyMatrix4(KIT.matrixWorld);
    V3.project(camera); L.el.style.transform = `translate(${(r.left + (V3.x + 1) / 2 * w - L.el.offsetWidth / 2).toFixed(1)}px, ${(r.top + (1 - V3.y) / 2 * h - 10).toFixed(1)}px)`; } }

// ---------- the keyboard: the drums by letter (1–4 the octobans); the xylophone on two piano rows (Z… and Q…) ----------
const KEYMAP = { z: 0, s: 1, x: 2, d: 3, c: 4, v: 5, g: 6, b: 7, h: 8, n: 9, j: 10, m: 11, ',': 12, l: 13, '.': 14, q: 12, 2: 13, w: 14, 3: 15, e: 16, r: 17, 5: 18, t: 19, 6: 20, y: 21, 7: 22, u: 23, i: 24 };
const KEYMAP_INV = {}; for (const k of ['z', 's', 'x', 'd', 'c', 'v', 'g', 'b', 'h', 'n', 'j', 'm', 'q', '2', 'w', '3', 'e', 'r', '5', 't', '6', 'y', '7', 'u', 'i']) if (!(KEYMAP[k] in KEYMAP_INV)) KEYMAP_INV[KEYMAP[k]] = k;
addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey || e.repeat || e.target.closest?.('input, .panel')) return; const k = /^Digit\d$/.test(e.code) ? e.code.slice(5) : e.key.toLowerCase();
  if (k === 'arrowright') return stepLook(1); if (k === 'arrowleft') return stepLook(-1);
  if (P.look === 'Drums') { for (const p of PIECES) { if (!STATE[p.id]) continue; const i = p.keys.findIndex(x => x.toLowerCase() === k || (x === 'Space' && e.code === 'Space')); if (i < 0) continue;
      e.preventDefault(); hitPiece(p, e.shiftKey ? 1 : .8, p.id === 'hihat' && k === 'g', p.zones ? i : 0); return; } return; }
  if (P.look === 'Xylophone' && k in KEYMAP) { const bar = BARS.find(b => b.userData.midi === LOW + KEYMAP[k]); if (bar) hitBar(bar, .95); } });

// ---------- the bottom bar: for the drums, a piece more or a piece less ----------
const tools = $('tools');
function renderTools() { tools.innerHTML = ''; if (BARE || P.look !== 'Drums') return; const n = Object.keys(STATE).length, next = PIECES[n], lastP = PIECES[n - 1];
  tools.innerHTML = `<div class="tb"><button type="button" id="kMinus" aria-label="Take away the ${lastP.name.toLowerCase()}"${n <= 3 ? ' disabled' : ''}>−</button><span class="tl">${n} of ${PIECES.length} pieces</span><button type="button" id="kPlus"${!next ? ' disabled' : ''}>${next ? '+ ' + next.name : 'Full kit'}</button></div>`;
  $('kMinus').onclick = () => { P.kit = Math.max(3, n - 1); save(); buildKit(P.kit); renderTools(); frameView('Drums'); };
  $('kPlus').onclick = () => { P.kit = Math.min(PIECES.length, n + 1); save(); buildKit(P.kit); renderTools(); frameView('Drums'); const p = PIECES[n]; if (p) { load(p.sounds); say(`${p.name}: ${p.zones ? p.keys.join(' ') : p.key === '␣' ? 'Space' : p.key} on the keyboard`); } }; }

// ---------- the hand on the stage: a tap on a part plays it; a drag on the room looks round; the wheel comes closer ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e) { const r = stage.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height * 2 - 1)); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(P.look === 'Drums' ? KIT : XY, true); if (!hits.length) return null;
  if (P.look === 'Xylophone') { const h = hits.find(h => BARS.includes(h.object)); return h ? { bar: h.object } : null; }
  let o = hits[0].object, zone = 0; while (o && !o.userData.piece) { if (o.userData.zone != null) zone = o.userData.zone; o = o.parent; } return o ? { piece: o.userData.piece, zone } : null; }
let drag = null;
if (!BARE) {
  stage.addEventListener('pointerdown', e => { unlock(); const h = pick(e);
    if (h?.piece) { const p = h.piece; hitPiece(p, .8 + Math.random() * .2, p.id === 'hihat' && e.shiftKey, h.zone); return; }
    if (h?.bar) { hitBar(h.bar, .85 + Math.random() * .15); return; }
    drag = { x: e.clientX, y: e.clientY, az: view.taz, el: view.tel }; stage.classList.add('dragging'); try { stage.setPointerCapture(e.pointerId); } catch { } });
  stage.addEventListener('pointermove', e => { if (drag) { view.taz = clamp(drag.az - (e.clientX - drag.x) * .005, VIEWS[P.look].az - .9, VIEWS[P.look].az + .9); view.tel = clamp(drag.el + (e.clientY - drag.y) * .004, .02, 1.25); return; }
    if (!coarse) stage.classList.toggle('over', !!pick(e)); });
  const up = () => { drag = null; stage.classList.remove('dragging'); };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => { e.preventDefault(); view.td = clamp(view.td * (1 + e.deltaY * .001), VIEWS[P.look].d * .6, VIEWS[P.look].d * 2.6); }, { passive: false });
  stage.addEventListener('dblclick', () => frameView(P.look));
}

// ---------- the looks: one instrument at a time ----------
const LOOKS = ['Drums', 'Xylophone'];
const SOUNDS = { Drums: () => PIECES.slice(0, P.kit).flatMap(p => p.sounds).concat(['hhopen']), Xylophone: () => XYLO.map(s => s.name) };
function updateHint() { const H = { Drums: coarse ? 'Tap a drum or a cymbal' : 'Click a drum, or play the letters · Shift = a harder hit · G opens the hi-hat', Xylophone: coarse ? 'Tap the bars' : 'Click the bars, or play Z…M and Q…I like a piano' };
  $('hint').textContent = H[P.look] || ''; }
function applyLook(name, now) { if (!LOOKS.includes(name)) name = 'Drums'; P.look = name; if (!BARE) save();
  KIT.visible = name === 'Drums'; XY.visible = name === 'Xylophone'; frameView(name, now); $('nm').textContent = name;
  load(SOUNDS[name]()); renderTools(); refreshLabels(); updateHint(); }
const stepLook = d => applyLook(LOOKS[(LOOKS.indexOf(P.look) + d + LOOKS.length) % LOOKS.length]);
let msgT = 0; function say(t) { const m = $('msg'); m.textContent = t; m.classList.add('show'); clearTimeout(msgT); msgT = setTimeout(() => m.classList.remove('show'), 2600); }

// ---------- the panel ----------
const panel = $('panel'), ctl = {};
function buildPanel() { panel.innerHTML = '';
  const head = document.createElement('header'); head.className = 'ph'; head.innerHTML = '<div><h2>Tune</h2><p>The sound, the letters, and how the instruments look.</p></div><button class="pc" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  head.querySelector('.pc').onclick = () => openPanel(false); panel.appendChild(head);
  const set = (k, v, then) => { P[k] = v; save(); then && then(); };
  const g0 = LabUI.group(panel, 'Sound', { key: KEY + '.g.sound', open: true });
  ctl.vol = LabUI.slider(g0, { label: 'Volume', min: 0, max: 1, step: .01, unit: '', value: P.vol, def: DEF.vol, onInput: v => set('vol', v, () => master.gain.setTargetAtTime(v, ctx.currentTime, .02)) });
  ctl.room = LabUI.slider(g0, { label: 'Room', min: 0, max: .8, step: .01, unit: '', value: P.room, def: DEF.room, onInput: v => set('room', v, () => send.gain.setTargetAtTime(v, ctx.currentTime, .02)) });
  ctl.keys = LabUI.check(g0, { label: 'Show the keyboard letters', value: P.keys, onChange: v => set('keys', v, () => document.body.classList.toggle('nokeys', !v)) });
  const g1 = LabUI.group(panel, 'Look', { key: KEY + '.g.look' });
  ctl.shell = LabUI.seg(g1, { label: 'Drums', options: [['wine', 'Wine'], ['black', 'Black'], ['ocean', 'Ocean'], ['green', 'Green'], ['pearl', 'Pearl']], value: P.shell, onChange: v => set('shell', v, () => setShell(v)) });
  ctl.light = LabUI.slider(g1, { label: 'Light', min: .5, max: 5, step: .05, unit: '', value: P.light, def: DEF.light, onInput: v => set('light', v, applyLight) });
  ctl.warmth = LabUI.slider(g1, { label: 'Cool to warm', min: 0, max: 1, step: .01, unit: '', value: P.warmth, def: DEF.warmth, onInput: v => set('warmth', v, applyLight) });
  const cr = document.createElement('p'); cr.className = 'credit'; cr.innerHTML = 'Recordings: <a href="https://github.com/sgossner/VCSL" target="_blank" rel="noopener">Versilian Community Sample Library</a> (CC0); the china by <a href="https://freesound.org/people/RytmenPinnen/sounds/102031/" target="_blank" rel="noopener">RytmenPinnen</a> and the splash by <a href="https://freesound.org/people/pjcohen/sounds/46647/" target="_blank" rel="noopener">pjcohen</a> on Freesound (CC0). Models and surfaces made in code.'; panel.appendChild(cr); }
function openPanel(on) { document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('tuning')) openPanel(false); });

// ---------- the loop ----------
let last = 0, demoT = 0, demoStep = 0;
const GROOVE = { kick: [0, 7, 8, 10], kick2: [3, 11], snare: [4, 12], hihat: [0, 2, 4, 6, 8, 10, 12, 14], tom1: [13], tom2: [14], floor1: [15] };
function frame(now) { requestAnimationFrame(frame); const dt = last ? Math.min(.05, (now - last) / 1000) : .016; last = now; if (THUMB) return;
  if (DEMO) { demoT += dt; const s = Math.floor(demoT / .15); while (demoStep <= s) { const k = demoStep % 16; for (const id in GROOVE) if (GROOVE[id].includes(k) && STATE[id]) { const st = STATE[id]; st.t = 0; st.amp = .9; } demoStep++; } }
  animKit(dt); animXylo(dt); placeCam(); renderer.render(scene, camera); placeLabels(); }

// ---------- start; the board's box: ?thumb=1 the full kit and the xylophone in one still, ?demo=1 the drums playing a groove (silent) ----------
setShell(P.shell); setKit(); applyLight(); document.body.classList.toggle('nokeys', !P.keys);
if (THUMB) { buildKit(PIECES.length); KIT.visible = XY.visible = true; KIT.position.set(-.5, 0, -.35); KIT.rotation.y = .2; XY.position.set(1.3, 0, .5); XY.rotation.y = -.6;
  for (const id in STATE) STATE[id].born = 9; animKit(0); animXylo(9);
  view.t.set(.12, .74, -.25); view.tt.copy(view.t); view.az = view.taz = 0; view.el = view.tel = .3; view.d = view.td = 6.5; resize(); placeCam(); renderer.render(scene, camera); document.body.classList.add('ready'); }
else { buildKit(BARE ? PIECES.length : P.kit); if (!BARE) { buildPanel(); LabUI.variants($('vars'), { prev: $('prev'), next: $('next'), name: $('nm'), onStep: stepLook, items: () => LOOKS, current: () => P.look, onPick: n => applyLook(n) }); }
  applyLook(BARE ? 'Drums' : P.look, true); resize(); placeCam(); document.body.classList.add('ready'); requestAnimationFrame(frame); }
window.INSTR = { get P() { return P; }, camera, KIT, XY, view, applyLook, frameView, buildKit, hitPiece, hitBar, BARS, PIECES, STATE, BUF, ctx };
</script>
</body>
</html>
