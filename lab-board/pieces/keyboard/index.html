    else if (kind === 'mod' || kind === 'modr') { x.font = f(22); x.textAlign = kind === 'mod' ? 'right' : 'left'; x.fillText(alt, kind === 'mod' ? W - pad : pad, pad + 14); x.font = f(15); x.textAlign = kind === 'mod' ? 'left' : 'right'; x.fillText(main, kind === 'mod' ? pad : W - pad, Hh - pad - 8); }
    else if (kind === 'arrow') { x.font = f(18); x.textAlign = 'center'; x.fillText(main, W / 2, Hh / 2 + 1); }
    else if (kind === 'power') { x.strokeStyle = '#fff'; x.lineWidth = 2.5; x.beginPath(); x.arc(W / 2, Hh / 2, Hh * .26, 0, Math.PI * 2); x.stroke(); } }); }
function build() { for (const o of [...KB.children]) { KB.remove(o); o.traverse(c => { c.geometry?.dispose(); if (c.material?.map) c.material.map.dispose(); }); } sils = []; kbKeys = []; kbHover = kbHeld = null;
  const rowsH = KB_ROWS.reduce((a, r) => a + r.h, 0), BW = 15 * KB_U + .36, BD = rowsH * KB_U + .36, base = prism(BW, BD, KB_BASE, .26, KB); base.g.position.y = -KB_BASE;
  let z = -rowsH * KB_U / 2;
  const add = (spec, x, zc, w, h) => { const g = new THREE.Group(); g.position.set(x, 0, zc); KB.add(g); const cw = w * KB_U - KB_GAP, cd = h * KB_U - KB_GAP;
    const pr = prism(cw, cd, KB_T, Math.min(.055, cw / 2 - .001, cd / 2 - .001), g);
    const k = { g, pr, m: pr.m, spec, code: spec[2], w, h, big: w >= 1.5 || spec[3] === 'space', d: { p: 0 }, down: false, lines: pr.lines };
    const lm = new THREE.MeshBasicMaterial({ map: kbLegend(k), transparent: true, depthWrite: false }), lg = new THREE.Mesh(new THREE.PlaneGeometry(cw * .94, cd * .94).rotateX(-Math.PI / 2), lm); lg.position.y = KB_T + .002; pr.g.add(lg); k.legend = lg;
    kbKeys.push(k); return k; };
  for (const row of KB_ROWS) { let x = -15 * KB_U / 2; const zc = z + row.h * KB_U / 2;
    for (const spec of row.keys) { const w = spec[1];
      if (spec[0] === 'ARROWS') { const hz = KB_U / 4; add(['◀', 1, 'ArrowLeft', 'arrow'], x + KB_U / 2, zc + hz, 1, .5); add(['▲', 1, 'ArrowUp', 'arrow'], x + KB_U * 1.5, zc - hz, 1, .5); add(['▼', 1, 'ArrowDown', 'arrow'], x + KB_U * 1.5, zc + hz, 1, .5); add(['▶', 1, 'ArrowRight', 'arrow'], x + KB_U * 2.5, zc + hz, 1, .5); x += 3 * KB_U; continue; }
      add(spec, x + w * KB_U / 2, zc, w, row.h); x += w * KB_U; }
    z += row.h * KB_U; }
  paint(); }
// (a key goes down with a click and comes back with a softer one; the cap gives at the top, its foot stays on the slab, so the line
// where it meets the slab is always drawn. No sound for the pointer passing over: the click is the sound)
function kbPress(k, on) { if (!k || k.down === on) return; k.down = on; if (!BARE) SFX.key(k.big, !on); paint(); wake(); }
function paint() { const c = PAL[mode]; M.fill.color.set(c.fill); M.line.color.set(c.line); M.hi.color.set(c.hi); plate.style.background = c.bg;
  for (const k of kbKeys) { const on = k === kbHover || k.down; for (const l of k.lines) l.material = on ? M.hi : M.line; k.legend.material.color.set(c.hi); k.legend.material.opacity = on ? 1 : .55; } wake(); }

// ---------- light and dark ----------
let mode = BARE ? (q.get('mode') === 'dark' ? 'dark' : 'light') : (() => { try { return localStorage.getItem(KEY + '.mode') || 'light'; } catch { return 'light'; } })();
function setMode(m) { mode = m; if (!BARE) try { localStorage.setItem(KEY + '.mode', m); } catch { }
  document.body.classList.toggle('light', m === 'light'); document.body.classList.toggle('dark', m === 'dark'); $('panel').classList.toggle('dark', m === 'dark');
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.m === m))); document.querySelector('meta[name=theme-color]').content = m === 'dark' ? '#121314' : '#f4f3ef'; paint(); }
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => setMode(b.dataset.m));

// ---------- the view ----------
const VIEW = { az: .22, el: .78, dAz: { p: 0 }, dEl: { p: 0 }, tAz: 0, tEl: 0, z: { p: 1 }, tz: 1 };
const zoomBy = f => { VIEW.tz = Math.max(.45, Math.min(3, VIEW.tz * f)); wake(); };
$('zin').onclick = () => zoomBy(1.25); $('zout').onclick = () => zoomBy(1 / 1.25); $('zreset').onclick = () => { VIEW.tAz = VIEW.tEl = 0; VIEW.tz = 1; wake(); };
// (on the board, the live box draws into the still's own frame, cropped to the box the way the still's picture is covered into it)
let W = 1, H = 1; const FRAME = 450 / 240;
new ResizeObserver(() => { W = plate.clientWidth || 1; H = plate.clientHeight || 1;
  if (BARE) { const sw = W, sh = H; if (W / H > FRAME) H = W / FRAME; else W = H * FRAME; Object.assign(renderer.domElement.style, { inset: 'auto', width: W + 'px', height: H + 'px', left: (sw - W) / 2 + 'px', top: (sh - H) / 2 + 'px' }); }
  renderer.setSize(W, H, false); wake(); }).observe(plate);
function placeCam() { const a = W / H, S = Math.max(4.6, 9.2 / a) / VIEW.z.p, az = VIEW.az + VIEW.dAz.p, el = Math.max(.06, Math.min(1.45, VIEW.el + VIEW.dEl.p));
  cam.left = -S * a / 2; cam.right = S * a / 2; cam.top = S / 2; cam.bottom = -S / 2; cam.updateProjectionMatrix();
  cam.position.set(Math.sin(az) * Math.cos(el) * 80, Math.sin(el) * 80, Math.cos(az) * Math.cos(el) * 80); cam.lookAt(0, 0, 0); }

// ---------- the pointer and your own keyboard ----------
let orbit = null;
const setNdc = e => { const r = plate.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height * 2 - 1)); };
if (!DEMO) {
  plate.addEventListener('pointerdown', e => { if (e.button !== 0) return; setNdc(e); const h = hitOf(kbKeys.map(k => k.m)); try { plate.setPointerCapture(e.pointerId); } catch { }
    if (h) { kbHeld = kbKeys.find(k => k.m === h.object); kbPress(kbHeld, true); return; }
    orbit = { x: e.clientX, y: e.clientY, az: VIEW.tAz, el: VIEW.tEl }; plate.classList.add('dragging'); });
  plate.addEventListener('pointermove', e => { setNdc(e);
    if (orbit) { VIEW.tAz = orbit.az - (e.clientX - orbit.x) * .006; VIEW.tEl = Math.max(-.6, Math.min(.7, orbit.el + (e.clientY - orbit.y) * .004)); VIEW.dAz.p = VIEW.tAz; VIEW.dEl.p = VIEW.tEl; wake(); return; }
    const h = hitOf(kbKeys.map(k => k.m)), k = h ? kbKeys.find(q => q.m === h.object) : null; if (k !== kbHover) { kbHover = k; paint(); } plate.classList.toggle('over', !!k); });
  const up = () => { if (kbHeld) { kbPress(kbHeld, false); kbHeld = null; } orbit = null; plate.classList.remove('dragging'); }; plate.addEventListener('pointerup', up); plate.addEventListener('pointercancel', up);
  plate.addEventListener('pointerleave', () => { if (!orbit && kbHover) { kbHover = null; plate.classList.remove('over'); paint(); } });
  plate.addEventListener('wheel', e => { e.preventDefault(); zoomBy(Math.exp(-e.deltaY * .0015)); }, { passive: false });
  addEventListener('keydown', e => { if (e.target.closest?.('input, .panel')) return; if (e.key === 'Escape' && document.body.classList.contains('tuning')) { openPanel(false); return; }
    const k = kbKeys.find(q => q.code === e.code); if (!k) return; if (!['F5', 'F11', 'F12'].includes(e.code) && !(e.metaKey && e.code !== 'MetaLeft' && e.code !== 'MetaRight')) e.preventDefault(); if (!e.repeat) kbPress(k, true); }, true);
  addEventListener('keyup', e => { const k = kbKeys.find(q => q.code === e.code); if (k) kbPress(k, false); }, true);
  addEventListener('blur', () => { for (const k of kbKeys) if (k.down) kbPress(k, false); });
}

// ---------- the frame ----------
let raf = 0; const wake = () => { if (!raf) raf = requestAnimationFrame(frame); };
function frame() { raf = 0; let busy = false;
  for (const k of kbKeys) { if (ease(k.d, k.down ? 1 : 0, k.down ? .55 : .3)) busy = true; k.pr.g.scale.y = 1 - k.d.p * P.travel; }
  if (ease(VIEW.z, VIEW.tz, .14)) busy = true; if (!orbit) { if (ease(VIEW.dAz, VIEW.tAz, .1)) busy = true; if (ease(VIEW.dEl, VIEW.tEl, .1)) busy = true; }
  placeCam(); updateSils(); renderer.render(scene, cam); if (busy || orbit) wake(); }

// ---------- the panel ----------
const panel = $('panel'); let ctl = {};
function buildPanel() { panel.innerHTML = ''; ctl = {};
  const head = document.createElement('header'); head.className = 'ph'; head.innerHTML = '<div><h2>Keyboard</h2><p>A flat low-profile keyboard: click a key, or type on your own; each key goes down with a soft click.</p></div><button class="pc" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  head.querySelector('.pc').onclick = () => openPanel(false); panel.appendChild(head);
  const set = (k, v) => { P[k] = v; save(); wake(); };
  const sl = (g, k, label, min, max, st, unit) => ctl[k] = LabUI.slider(g, { label, min, max, step: st, unit, value: P[k], def: DEF[k], onInput: v => set(k, v) });
  const g0 = LabUI.group(panel, 'Keys', { key: KEY + '.g.keys' }); sl(g0, 'travel', 'Travel', .2, .8, .05);
  const gs = LabUI.group(panel, 'Sound', { key: KEY + '.g.sound' }); ctl.sound = LabUI.check(gs, { label: 'Sound', value: P.sound, onChange: v => set('sound', v) }); sl(gs, 'vol', 'Volume', 0, 1, .05);
  ctl.click = LabUI.seg(gs, { label: 'Click', options: [['soft', 'Soft'], ['thock', 'Thock'], ['crisp', 'Crisp']], value: P.click, onChange: v => { set('click', v); SFX.key(false); setTimeout(() => SFX.key(false, true), 90); } });
  { const r = document.createElement('div'); r.className = 'ui-row'; r.innerHTML = '<span class="ui-label">Hear it</span><button type="button" class="play-intro">Test</button>'; gs.appendChild(r); r.querySelector('button').onclick = () => { SFX.key(false); setTimeout(() => SFX.key(false, true), 90); }; }
  const acts = document.createElement('div'); acts.className = 'acts'; acts.innerHTML = '<button type="button" data-a="reset">Reset all</button>'; panel.appendChild(acts);
  acts.querySelector('[data-a=reset]').onclick = () => { P = { ...DEF }; save(); buildPanel(); wake(); }; }
function openPanel(on) { document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);

// ---------- start; the board's box: ?thumb=1 the still, ?demo=1 the keys typing a few words on their own ----------
if (BARE) document.body.classList.add('bare');
setMode(mode); build(); buildPanel(); LabUI.segThumb($('mode'));
document.fonts.ready.then(() => { for (const k of kbKeys) { k.legend.material.map.dispose(); k.legend.material.map = kbLegend(k); } wake(); });   // (the legends again once the type is in)
if (DEMO) { const words = ['hello lab', 'line style', 'soft keys'], codeOf = ch => ch === ' ' ? 'Space' : 'Key' + ch.toUpperCase(); let w = 0;
  const type = async () => { await new Promise(r => setTimeout(r, 900)); for (;;) { for (const ch of words[w++ % words.length]) { const k = kbKeys.find(q => q.code === codeOf(ch)); kbPress(k, true); await new Promise(r => setTimeout(r, 110)); kbPress(k, false); await new Promise(r => setTimeout(r, 70 + Math.random() * 90)); }
    const r = kbKeys.find(q => q.code === 'Enter'); kbPress(r, true); await new Promise(res => setTimeout(res, 140)); kbPress(r, false); await new Promise(res => setTimeout(res, 1300)); } }; type(); }
window.KEYS = { P: () => P, keys: () => kbKeys, press: kbPress, sfx: SFX };
</script>
