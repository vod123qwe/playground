  /* A flat Mac keyboard drawn like Line Interactions: low keys in an aluminium slab, thin lines over quiet fills, every key a rounded

     on your own keyboard, and it goes down with a soft click and comes back up (the click synthesised on the spot, Soft, Thock or Crisp).

<script type="module">

    pos.setXYZ(k * 2, x, 0, z); pos.setXYZ(k * 2 + 1, x, s.h, z); }); pos.needsUpdate = true; s.sil.geometry.computeBoundingSphere(); } }

  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; t.colorSpace = THREE.SRGBColorSpace; return t; }
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const hitOf = meshes => { ray.setFromCamera(ndc, cam); return ray.intersectObjects(meshes, false)[0] || null; };
const KB = new THREE.Group(); scene.add(KB);

// =============================================== sound: small, quiet, made on the spot ===============================================
// (no files: every sound is synthesised when it plays. A key's click is a short burst of noise through a band filter over a soft low
// knock; a tick (moving from one thing to the next under the pointer) a tiny sine blip, its pitch from a pentatonic scale; a thud a low

// (three characters of key, picked in the panel: Soft (the default: a muffled tap, low-passed noise and a round low knock), Thock (deeper

  soft:  { down: [[1500, .7, .32, .022, 'lowpass']], knock: [210, 'sine', .2, .04, 150], up: [[1900, .7, .12, .014, 'lowpass']] },
  thock: { down: [[900, .7, .3, .03, 'lowpass']], knock: [140, 'sine', .32, .07, 95], up: [[1300, .7, .1, .018, 'lowpass']] },
  crisp: { down: [[2600, .9, .38, .02, 'bandpass'], [900, .6, .12, .015, 'bandpass']], knock: [260, 'triangle', .14, .035, 180], up: [[3200, 1, .14, .012, 'bandpass']] } };
const SFX = {
  key(big, up) { const c = snd(); if (!c) return; const t = c.currentTime, v = .92 + Math.random() * .16, K = CLICKS[P.click] || CLICKS.soft;

    for (const [f, q, pk, d, ty] of K.down) burst(c, t, f * v * (big ? .8 : 1), q, pk * (big ? 1.1 : 1), d * (big ? 1.25 : 1), ty);

  if (overlay && now >= overlay.until) { overlay = null; scr.dirty = true; } if (overlay) busy = true;
  if (scr.dirty) { scr.dirty = false; drawScreen(); }
  if (ease(VIEW.z, VIEW.tz, .14)) busy = true; if (ease(VIEW.dAz, VIEW.tAz, orbit ? .3 : .1)) busy = true; if (ease(VIEW.dEl, VIEW.tEl, orbit ? .3 : .1)) busy = true;
  placeCam(); updateSils(); renderer.render(scene, cam); if (busy || knobDrag) wake(); }

// ---------- the panel ----------
const panel = $('panel'); let ctl = {};
function buildPanel() { panel.innerHTML = ''; ctl = {};
  const head = document.createElement('header'); head.className = 'ph'; head.innerHTML = '<div><h2>Keyboard</h2><p>A flat low-profile keyboard with a control strip: the slide mutes it, the knob turns the volume, the small screen shows what you type, the round buttons change the screen and the click; a slide on the right side switches light and dark.</p></div><button class="pc" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  head.querySelector('.pc').onclick = () => openPanel(false); panel.appendChild(head);
  const set = (k, v) => { P[k] = v; save(); paint(); wake(); };
  const sl = (g, k, label, min, max, st, unit, on) => ctl[k] = LabUI.slider(g, { label, min, max, step: st, unit, value: P[k], def: DEF[k], onInput: on || (v => set(k, v)) });
  const g0 = LabUI.group(panel, 'Keys', { key: KEY + '.g.keys' }); sl(g0, 'travel', 'Travel', .2, .8, .05); ctl.light = LabUI.check(g0, { label: 'Light that answers the keys', value: P.light, onChange: v => set('light', v) });
  const gs = LabUI.group(panel, 'Sound', { key: KEY + '.g.sound' }); ctl.sound = LabUI.check(gs, { label: 'Sound', value: P.sound, onChange: v => setSound(v) }); sl(gs, 'vol', 'Volume', 0, 1, .05, '', v => setVol(v));
  ctl.click = LabUI.seg(gs, { label: 'Click', options: [['soft', 'Soft'], ['thock', 'Thock'], ['crisp', 'Crisp']], value: P.click, onChange: v => { set('click', v); SFX.key(false); setTimeout(() => SFX.key(false, true), 90); } });
  { const r = document.createElement('div'); r.className = 'ui-row'; r.innerHTML = '<span class="ui-label">Hear it</span><button type="button" class="play-intro">Test</button>'; gs.appendChild(r); r.querySelector('button').onclick = () => { SFX.key(false); setTimeout(() => SFX.key(false, true), 90); }; }
  const acts = document.createElement('div'); acts.className = 'acts'; acts.innerHTML = '<button type="button" data-a="reset">Reset all</button>'; panel.appendChild(acts);
  acts.querySelector('[data-a=reset]').onclick = () => { P = { ...DEF }; save(); buildPanel(); paint(); }; }
function openPanel(on) { document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);

// ---------- start; the board's box: ?thumb=1 the still, ?demo=1 the keys typing a few words on their own ----------
if (BARE) document.body.classList.add('bare');
setMode(mode, true); build(); buildPanel(); LabUI.segThumb($('mode'));
if (BARE) { typed = 'hello lab'; scr.dirty = true; }
document.fonts.ready.then(() => { for (const k of kbKeys) { k.legend.material.map.dispose(); k.legend.material.map = kbLegend(k); } scr.dirty = true; wake(); });   // (the legends again once the type is in)
if (DEMO) { const words = ['line style', 'soft keys', 'hello lab'], codeOf = ch => ch === ' ' ? 'Space' : 'Key' + ch.toUpperCase(); let w = 0;
  const type = async () => { await new Promise(r => setTimeout(r, 1200)); typed = ''; for (;;) { for (const ch of words[w++ % words.length]) { const k = kbKeys.find(q => q.code === codeOf(ch)); kbPress(k, true); await new Promise(r => setTimeout(r, 110)); kbPress(k, false); await new Promise(r => setTimeout(r, 70 + Math.random() * 90)); }
    await new Promise(res => setTimeout(res, 900)); const r = kbKeys.find(q => q.code === 'Enter'); kbPress(r, true); await new Promise(res => setTimeout(res, 140)); kbPress(r, false); await new Promise(res => setTimeout(res, 600)); } }; type(); }
window.KEYS = { P: () => P, keys: () => kbKeys, press: kbPress, sfx: SFX, strip: () => strip, setVol, setSound };
</script>
