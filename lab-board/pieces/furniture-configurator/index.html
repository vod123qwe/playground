<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Furniture Configurator · lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/lab-ui.css">
<style>
  :root{ --ink:#1b1c20; --muted:rgba(20,20,20,.5); --line:rgba(20,20,20,.1); --ease:cubic-bezier(.22,.61,.36,1); }
  *{box-sizing:border-box}
  html, body{margin:0; height:100%; overflow:hidden; background:#e8e5df; color:var(--ink); font:500 13.5px/1.4 "Inter", system-ui, sans-serif; -webkit-font-smoothing:antialiased}
  #gl{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none}
  button{font:inherit; color:inherit}

  /* chrome: white pills, no borders, no shadows (same family as the glass button) */
  .pill{display:flex; align-items:center; gap:9px; height:46px; padding:0 20px 0 16px; border:0; border-radius:999px; background:#fff; color:var(--ink); font-weight:600; cursor:pointer}
  .pill svg{width:19px; height:19px}
  .pill:focus-visible, .icon:focus-visible{outline:2px solid rgba(20,20,20,.35); outline-offset:2px}
  .icon{display:grid; place-items:center; width:46px; height:46px; border:0; border-radius:999px; background:#fff; color:var(--ink); cursor:pointer}
  .icon svg{width:20px; height:20px}
  .back{position:fixed; top:16px; left:16px; z-index:5; text-decoration:none}
  .tr{position:fixed; top:16px; right:16px; z-index:5; display:flex; gap:8px; transition:right .45s var(--ease)}
  body.tuning .tr .tune{display:none}
  @media (min-width:761px){ body.tuning .tr{right:400px} }

  /* export menu: a quiet fade, no spring */
  .exp{position:relative}
  .xmenu{position:absolute; right:0; top:calc(100% + 8px); min-width:250px; margin:0; padding:6px; list-style:none; border-radius:18px; background:#fff; box-shadow:0 0 0 1px var(--line);
         opacity:0; visibility:hidden; transform:translateY(-6px) scale(.985); transform-origin:top right; pointer-events:none;
         transition:opacity .34s cubic-bezier(.25,.1,.25,1), transform .42s var(--ease), visibility 0s linear .42s}
  .xmenu.open{opacity:1; visibility:visible; transform:none; pointer-events:auto; transition:opacity .34s cubic-bezier(.25,.1,.25,1), transform .42s var(--ease), visibility 0s}
  .xmenu button{display:grid; grid-template-columns:22px 1fr; gap:2px 10px; width:100%; padding:10px 12px; border:0; border-radius:12px; background:transparent; text-align:left; cursor:pointer}
  .xmenu button:hover, .xmenu button:focus-visible{background:rgba(20,20,20,.06); outline:none}
  .xmenu svg{grid-row:span 2; width:20px; height:20px; margin-top:1px}
  .xmenu b{font-weight:600} .xmenu small{color:var(--muted); font-size:12px}

  /* variants at the bottom centre */
  .dock{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:4; transform:translateX(-50%); transition:left .45s var(--ease)}
  @media (min-width:761px){ body.tuning .dock{left:calc(50% - 192px)} }
  .vars{display:flex; align-items:center; gap:2px; height:46px; padding:0 5px; border-radius:999px; background:#fff; font-weight:600}
  .vars button{display:grid; place-items:center; width:36px; height:36px; border:0; border-radius:999px; background:transparent; cursor:pointer}
  .vars button:hover{background:rgba(20,20,20,.06)} .vars svg{width:18px; height:18px}
  .vars .vn{display:inline-block; min-width:120px; text-align:center; white-space:nowrap}
  .vars{touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; will-change:transform} .vars.dragging{cursor:grabbing}

  /* status of the render, bottom left */
  .status{position:fixed; left:16px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:4; display:flex; align-items:center; gap:8px; height:46px; padding:0 16px;
          border-radius:999px; box-shadow:inset 0 0 0 1.5px rgba(20,20,20,.18); color:rgba(20,20,20,.7); font-size:12.5px; font-weight:600}
  .status i{width:8px; height:8px; border-radius:50%; background:#c9a15a; transition:background .3s}
  .status.done i{background:#3fae6a}
  @media (max-width:760px){ .status{bottom:calc(76px + env(safe-area-inset-bottom))} }

  /* handles and dimensions over the canvas */
  .overlay{position:fixed; inset:0; z-index:3; pointer-events:none}
  .hd{position:absolute; left:0; top:0; width:28px; height:28px; margin:-14px 0 0 -14px; display:grid; place-items:center; border-radius:50%; background:#fff;
      box-shadow:0 0 0 1px rgba(20,20,20,.14); pointer-events:auto; touch-action:none; transition:transform .25s var(--ease), background .2s}
  .hd svg{width:16px; height:16px; stroke:var(--ink)}
  .hd.x{cursor:ew-resize} .hd.y{cursor:ns-resize} .hd.add{cursor:pointer}
  .hd:hover, .hd.on{scale:1.15}                          /* scale, not transform: the position lives in the inline transform */ .hd.on{background:var(--ink)} .hd.on svg{stroke:#fff}
  .lbl{position:absolute; left:0; top:0; transform:translate(-50%, -50%); padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.86); color:var(--ink);
       font-size:11.5px; font-weight:600; white-space:nowrap; pointer-events:none; font-variant-numeric:tabular-nums}
  .lbl.big{font-size:12.5px; padding:4px 10px}
  .lbl{transition:background .25s ease, color .25s ease, box-shadow .25s ease}
  .lbl.hl{background:var(--ink); color:#fff; box-shadow:0 0 0 4px rgba(27,28,32,.12)}
  body.hdrag, body.hdrag *{cursor:none !important}
  body.hdrag .hd:not(.on){opacity:.25 !important}
  body.nodims .lbl{display:none}
  body.busy .hd{pointer-events:none; opacity:.5}
  .hd{transition:background .2s, scale .25s var(--ease)}
  .overlay{transition:opacity .6s ease} body.calm .overlay{opacity:0} body.calm .hd{pointer-events:none}

  /* the bay toolbar: what this segment is */
  .bar{position:fixed; left:0; top:0; z-index:4; display:flex; align-items:center; gap:4px; padding:5px; border-radius:18px; background:#fff; box-shadow:0 0 0 1px var(--line);
       transform:translate(-50%, -100%); opacity:0; visibility:hidden; transition:opacity .3s ease, visibility 0s linear .3s; white-space:nowrap}
  .bar.open{opacity:1; visibility:visible; transition:opacity .3s ease, visibility 0s}
  .bar button{height:36px; padding:0 12px; border:0; border-radius:12px; background:transparent; font-weight:600; cursor:pointer; color:rgba(20,20,20,.6)}
  .bar button:hover{background:rgba(20,20,20,.05); color:var(--ink)}
  .bar button[aria-pressed=true]{background:var(--ink); color:#fff}
  .bar .sep{width:1px; height:22px; background:var(--line); margin:0 4px}
  .bar .step{display:flex; align-items:center; gap:2px}
  .bar .step button{width:32px; padding:0} .bar .step span{min-width:18px; text-align:center; font-weight:600}
  .bar .del{color:#b3462f}

  /* the panel: edge to edge, sharp, roomy */
  .panel{--ui-pad:28px; position:fixed; top:0; right:0; bottom:0; z-index:6; width:384px; overflow:auto; padding:0 28px 28px; background:#fff; box-shadow:-1px 0 0 var(--line);
         transform:translateX(100%); visibility:hidden; transition:transform .45s var(--ease), visibility 0s linear .45s; overscroll-behavior:contain}
  body.tuning .panel{transform:none; visibility:visible; transition:transform .45s var(--ease)}
  @media (max-width:760px){ .panel{top:auto; left:0; width:auto; height:62vh; transform:translateY(100%)} }
  .ph{position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:flex-start; margin:0 -28px; padding:28px 28px 20px; background:#fff; border-bottom:1px solid var(--line)}
  .ph h2{margin:0; font-size:20px; font-weight:600} .ph p{margin:4px 0 0; color:var(--muted); font-size:12.5px}
  .ph button{width:32px; height:32px; border:0; background:transparent; cursor:pointer; display:grid; place-items:center} .ph svg{width:20px; height:20px}
  .grp{border-bottom:1px solid var(--line); margin:0 -28px; padding:18px 28px}
  .grp h3{margin:0 0 12px; font-size:13px; font-weight:600}
  .row{display:grid; grid-template-columns:1fr auto; align-items:center; gap:6px 12px; margin:12px 0}
  .row label{color:rgba(20,20,20,.75)} .row .v{font-variant-numeric:tabular-nums; color:var(--muted); font-size:12.5px}
  .row input[type=range]{grid-column:1 / -1; width:100%; accent-color:var(--ink); margin:0}
  .row input[type=checkbox]{width:18px; height:18px; accent-color:var(--ink); margin:0}
  .seg{grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:6px}
  .seg button{padding:7px 12px; border:0; background:rgba(20,20,20,.05); cursor:pointer; font-weight:600; color:rgba(20,20,20,.7)}
  .seg button[aria-pressed=true]{background:var(--ink); color:#fff}
  .note{color:var(--muted); font-size:12px; margin:8px 0 0}

  /* export progress */
  .modal{position:fixed; inset:0; z-index:9; display:grid; place-items:center; background:rgba(232,229,223,.6); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
         opacity:0; visibility:hidden; transition:opacity .3s ease, visibility 0s linear .3s}
  .modal.open{opacity:1; visibility:visible; transition:opacity .3s ease, visibility 0s}
  .card{width:min(360px, calc(100vw - 32px)); padding:24px; border-radius:22px; background:#fff; box-shadow:0 0 0 1px var(--line)}
  .card b{display:block; font-size:15px; font-weight:600} .card p{margin:6px 0 16px; color:var(--muted)}
  .meter{height:6px; border-radius:6px; background:rgba(20,20,20,.08); overflow:hidden} .meter i{display:block; height:100%; width:0; background:var(--ink); transition:width .2s linear}
  .card .row2{display:flex; justify-content:space-between; align-items:center; margin-top:14px}
  .card .row2 span{color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums}
  .card button{height:36px; padding:0 14px; border:0; border-radius:999px; background:rgba(20,20,20,.06); font-weight:600; cursor:pointer}
  .loading{position:fixed; inset:0; z-index:8; display:grid; place-items:center; pointer-events:none; color:var(--muted); font-weight:600; transition:opacity .5s ease}
  body.ready .loading{opacity:0}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
<script src="../../shared/lab-ui.js"></script>

<body>
<canvas id="gl" aria-label="The sideboard in 3D"></canvas>
<div class="loading" id="loading">Loading the workshop…</div>
<div class="overlay" id="overlay"></div>

<a class="icon back" href="../../" aria-label="Back to the lab" title="Back to the lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></a>

<div class="tr">
  <div class="exp">
    <button class="pill" id="exp-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="exp-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg><span>Export</span>
    </button>
    <ul class="xmenu" id="exp-menu" role="menu" aria-hidden="true">
      <li><button type="button" role="menuitem" id="x-render"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5.5-5.5L7 19"/></svg><b>Render · 4K</b><small>Path traced PNG, 3840 × 2160</small></button></li>
      <li><button type="button" role="menuitem" id="x-plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7M9 9h2"/></svg><b>Plan for the joiner</b><small>Drawings, cut list, hardware · print or PDF</small></button></li>
      <li><button type="button" role="menuitem" id="x-csv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></svg><b>Cut list · CSV</b><small>For a spreadsheet or a panel saw</small></button></li>
    </ul>
  </div>
  <button class="pill tune" id="tune" type="button" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Customize</span>
  </button>
</div>

<div class="dock"><div class="vars" role="group" aria-label="Variants">
  <button type="button" id="v-prev" aria-label="Previous variant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  <span class="vn" id="v-name" aria-live="polite"></span>
  <button type="button" id="v-next" aria-label="Next variant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</div></div>

<div class="status" id="status" aria-live="polite"><i></i><span>Live preview</span></div>
<div class="bar" id="bar" role="toolbar" aria-label="This segment"></div>
<aside class="panel lab-ui" id="panel" aria-label="Customize the furniture"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-t"><div class="card">
  <b id="m-t">Rendering</b><p id="m-p">Tracing light through the scene.</p>
  <div class="meter"><i id="m-bar"></i></div>
  <div class="row2"><span id="m-n">0 / 0</span><button type="button" id="m-x">Cancel</button></div>
</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { WebGLPathTracer } from 'three-gpu-pathtracer';

const Q = new URLSearchParams(location.search), STILL = Q.has('still');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const snap = (v, st = 5) => Math.round(v / st) * st;

// ---------- the furniture, in cm: an outline (width, cuts between segments) and what each segment holds ----------
const T = 1.8, BACK = 0.8, GAP = 0.3, LIP = 1.4;      // board, back panel, gap around fronts, height of the top rail
const LOOKS = {
  'Sideboard 200': { W: 200, H: 50, D: 40, leg: 18, cuts: [50, 100], bays: [{ type: 'door' }, { type: 'door' }, { type: 'niche', n: 2, split: .55 }] },
  'Media 160': { W: 160, H: 45, D: 42, leg: 20, cuts: [55, 105], bays: [{ type: 'drawers', n: 2 }, { type: 'open', n: 1 }, { type: 'drawers', n: 2 }] },
  'Wide 260': { W: 260, H: 55, D: 45, leg: 16, cuts: [65, 130, 195], bays: [{ type: 'door' }, { type: 'drawers', n: 3 }, { type: 'drawers', n: 3 }, { type: 'door' }] },
};
const STYLE_DEF = { legs: 'frame', handles: 'bar', lip: true, wood: 'natural', tone: 1, gloss: .14, wall: true, grid: .5, exposure: 1, dims: true, pt: true, bounces: 5, peek: true };
let C = structuredClone(LOOKS['Sideboard 200']);      // the build
let S = { ...STYLE_DEF };                              // the look and the scene
let lookName = 'Sideboard 200';
const bayDefaults = t => t === 'drawers' ? { type: t, n: 2 } : t === 'open' ? { type: t, n: 1 } : t === 'niche' ? { type: t, n: 1, split: .5 } : { type: t };

// ---------- renderer, camera, light ----------
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e8e5df');
const camera = new THREE.PerspectiveCamera(30, 1, 5, 6000);
const HOME = { pos: new THREE.Vector3(-70, 120, 360), target: new THREE.Vector3(0, 36, 0) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME.target); controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 110; controls.maxDistance = 1200; controls.maxPolarAngle = Math.PI * .485; controls.minPolarAngle = .12; controls.enablePan = false;
controls.update();

const sun = new THREE.DirectionalLight('#ffe6c4', 2.6);            // a warm window light from the front left, low enough to throw a shadow on the wall
sun.position.set(-260, 230, 300); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -260, right: 260, top: 220, bottom: -120, near: 10, far: 1200 });
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 5; sun.shadow.bias = -0.0005; sun.shadow.normalBias = .8;
scene.add(sun);
new HDRLoader().load('assets/lebombo_1k.hdr', t => { t.mapping = THREE.EquirectangularReflectionMapping; scene.environment = t; scene.environmentIntensity = .55; ptScene(); });

// ---------- materials: photo oak (Poly Haven, CC0), black powder-coated steel, a pale floor and wall ----------
const tl = new THREE.TextureLoader(), ANISO = renderer.capabilities.getMaxAnisotropy();
// the finishes of one oak veneer: a colour multiplied over the photo (brighter for white oak, deeper for smoked)
const WOODS = {
  natural: { name: 'Natural oak', tint: [1, 1, 1] },
  white: { name: 'White oak', tint: [1.18, 1.14, 1.08] },
  honey: { name: 'Honey oak', tint: [1.05, .88, .66] },
  smoked: { name: 'Smoked oak', tint: [.62, .52, .43] },
  dark: { name: 'Dark oak', tint: [.36, .29, .24] },
};
function paintWood(c, tint) {                            // a round sample: the real veneer, in that finish
  const img = oak && oak.map && oak.map.image, g = c.getContext('2d');
  if (!img || !img.width) { g.fillStyle = `rgb(${tint.map(t => Math.min(255, 150 * t)).join(',')})`; g.fillRect(0, 0, c.width, c.height); return; }
  g.drawImage(img, img.width * .3, img.height * .3, img.width * .12, img.height * .12, 0, 0, c.width, c.height);
  const mul = tint.map(t => Math.min(255, Math.round(255 * Math.min(t, 1)))), add = tint.map(t => Math.round(255 * Math.max(0, t - 1) * 1.4));
  g.globalCompositeOperation = 'multiply'; g.fillStyle = `rgb(${mul.join(',')})`; g.fillRect(0, 0, c.width, c.height);
  if (add.some(v => v > 0)) { g.globalCompositeOperation = 'screen'; g.fillStyle = `rgb(${add.join(',')})`; g.fillRect(0, 0, c.width, c.height); }
  g.globalCompositeOperation = 'source-over';
}
const tex = (u, srgb) => { const t = tl.load(u, () => { ptScene(); if (u.includes('diff') && ctl.wood) ctl.wood.repaint(); }); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = ANISO; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
const oak = new THREE.MeshPhysicalMaterial({ map: tex('assets/oak_diff.jpg', true), normalMap: tex('assets/oak_nor.jpg'), roughnessMap: tex('assets/oak_rough.jpg'),
  normalScale: new THREE.Vector2(.35, .35), roughness: 1, clearcoat: .14, clearcoatRoughness: .5 });
const steel = new THREE.MeshPhysicalMaterial({ color: '#151515', metalness: .55, roughness: .42, clearcoat: .25, clearcoatRoughness: .4 });
function gridTexture(a) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#e9e6e0'; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = `rgba(70,62,52,${.18 * a})`; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 1); g.lineTo(512, 1); g.moveTo(1, 0); g.lineTo(1, 512); g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(60, 60); t.anisotropy = ANISO; return t;
}
const floorMat = new THREE.MeshStandardMaterial({ map: gridTexture(S.grid), roughness: .88 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), floorMat);   // one tile = 50 cm
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(3000, 900), new THREE.MeshStandardMaterial({ color: '#efebe4', roughness: .95 }));
wall.position.set(0, 450, -60); wall.receiveShadow = true; scene.add(wall);
const skirt = new THREE.Mesh(new THREE.BoxGeometry(3000, 9, 1.6), new THREE.MeshStandardMaterial({ color: '#f4f1ea', roughness: .6 }));
skirt.position.set(0, 4.5, -59); skirt.castShadow = skirt.receiveShadow = true; scene.add(skirt);

// a box of oak whose grain runs along one axis, in true scale (the veneer photo covers 183 cm), offset per part
const TILE = 140;                                       // the veneer photo covers 183 cm; a little finer reads closer to real oak fronts

${rows.map(r => `<tr><td>${r.name}</td><td class="n">${r.qty}</td><td class="n">${r.L.toFixed(1)}</td><td class="n">${r.W.toFixed(1)}</td><td class="n">${(r.t * 10).toFixed(0)} mm</td><td>${r.mat}</td><td>${r.edge}</td></tr>`).join('')}</table>
<h2>Hardware</h2><table><tr><th>Item</th><th class="n">Qty</th></tr>${hw.map(([n, q]) => `<tr><td>${n}</td><td class="n">${q}</td></tr>`).join('')}</table>
<p class="sub">Generated by the lab's furniture configurator. Check every size on site before cutting; fronts are drawn with a 3 mm gap all round.</p></body></html>`;
  const win = window.open('', '_blank');
  if (win) { win.document.open(); win.document.write(html); win.document.close(); }
  else saveBlob(new Blob([html], { type: 'text/html' }), `sideboard-${stamp()}-plan.html`);
}
$('x-plan').addEventListener('click', exportPlan);
$('x-csv').addEventListener('click', () => {
  xOpen(false); const { rows, hw } = cutList();
  const esc = v => `"${String(v).replace(/"/g, '""')}"`;
  const csv = ['Part,Qty,Length (cm),Width (cm),Thickness (mm),Material,Edge banding', ...rows.map(r => [r.name, r.qty, r.L.toFixed(1), r.W.toFixed(1), (r.t * 10).toFixed(0), r.mat, r.edge].map(esc).join(',')),
    '', 'Hardware,Qty', ...hw.map(([n, q]) => [n, q].map(esc).join(','))].join('\n');
  saveBlob(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), `sideboard-${stamp()}-cutlist.csv`);
});

// ---------- start ----------
buildPanel(); resize(); styleChanged(); changed(true);
document.body.classList.add('ready');
if (STILL) { S.dims = false; document.body.classList.add('nodims'); }
requestAnimationFrame(frame);
window.FC = { C: () => C, S: () => S, pt, exportRender, cutList, planSvg, select: i => { sel = i; renderBar(); }, changed };
</script>
