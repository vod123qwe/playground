<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multiselect · lab</title>
<meta name="theme-color" content="#f3f2ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<link rel="stylesheet" href="../../shared/lab-ui.css?v=21">
<style>
  /* A multiselect with pills: what you tick in the list flies into the field as a pill. One line: what doesn't fit hides behind
     a "+N" chip, and the pills slide left and right under the finger, with a glide when let go and a soft give at the ends. A pill
     goes out with its x (it hops and falls off the screen) or by hand: grab it, throw it down. Everything moves on springs. */
  :root { --font: var(--lab-font); --bg: #f3f2ee; --ink: #1b1c20; --muted: rgba(20,20,20,.5); --field: #fff; --line: rgba(20,20,20,.07); --pill: #f2f1ed; --menu: #fff;
    --hover: rgba(20,20,20,.045); --red: #e5484d; --ease: cubic-bezier(.22,.61,.36,1); --soft: cubic-bezier(.3,1.25,.45,1); --page: #fff; --box: var(--bg); --morph: .55s cubic-bezier(.3,1.12,.4,1); }
  body.dark { --bg: #121214; --ink: #f2f2f0; --muted: rgba(255,255,255,.5); --field: #1c1c1f; --line: rgba(255,255,255,.07); --pill: #2a2a2e; --menu: #1c1c1f; --hover: rgba(255,255,255,.06); --page: #17181b; --box: #121214; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; transition: background .4s; }
  body.tuning { background: var(--page); }
  .stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); transition: inset var(--morph), border-radius var(--morph), background .4s; }
  body.tuning .stage { background: var(--box); border-radius: 26px; }

  /* ---------- the multiselect ---------- */
  .ms { position: absolute; left: 50%; top: max(96px, 24vh); width: min(var(--w, 400px), calc(100% - 32px)); translate: -50% 0; }
  .ms-top { display: flex; align-items: baseline; justify-content: space-between; margin: 0 6px 8px; font-size: 13px; }
  .ms-label { font-weight: 600; } .ms-count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ms-field { position: relative; display: flex; height: 52px; border-radius: 18px; background: var(--field); box-shadow: 0 0 0 1px var(--line); overflow: hidden; cursor: pointer; outline: none; transition: box-shadow .25s, background .4s; }
  .ms-field:focus-visible { box-shadow: 0 0 0 1px var(--line), 0 0 0 4px color-mix(in srgb, var(--ink) 7%, transparent); }
  .ms-box { position: relative; }
  .ms-field { transition: box-shadow .35s, background .4s; }
  .ms.open .ms-field { box-shadow: 0 0 0 1px var(--line), 0 14px 34px -22px rgba(0,0,0,.28); }
  .ms-view { position: relative; flex: 1; min-width: 0; touch-action: none; --fl: 0px; --fr: 0px;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent); mask-image: linear-gradient(to right, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent); }
  .ms-ph { position: absolute; left: 16px; top: 16px; color: var(--muted); font-size: 15px; line-height: 20px; pointer-events: none; transition: opacity .2s; }
  .ms-ph.off { opacity: 0; }
  .ms-pill, .fly .ms-pill { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 5px 0 8px; border-radius: 999px; background: var(--pill); color: var(--ink);
    font: 500 14px/1 var(--font); white-space: nowrap; user-select: none; -webkit-user-select: none; will-change: transform; cursor: grab; transition: background .2s, box-shadow .25s; }
  .ms-pill .fi { width: 18px; height: 18px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .ms-x { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; transition: background .2s, color .2s; }
  .ms-x:hover { background: var(--hover); color: var(--ink); } .ms-x svg { width: 13px; height: 13px; }
  .ms-x:focus-visible { outline: 2px solid color-mix(in srgb, var(--ink) 40%, transparent); outline-offset: 0; }
  .fly { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
  .fly .ms-pill { box-shadow: 0 10px 26px -10px rgba(0,0,0,.28), 0 0 0 1px var(--line); background: var(--field); }
  .fly .ms-pill.lifted { cursor: grabbing; }
  .fly .ms-pill.out { background: color-mix(in srgb, var(--red) 12%, var(--field)); } .fly .ms-pill.out .ms-x { color: var(--red); }
  .fly .ms-pill.falling { box-shadow: 0 6px 18px -8px rgba(0,0,0,.22); }
  .fly .ms-pill.ghost { background: var(--pill); box-shadow: none; }
  .fx { position: fixed; inset: 0; z-index: 31; width: 100%; height: 100%; pointer-events: none; }
  .dock { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 4; transform: translateX(-50%); transition: left var(--morph), bottom var(--morph); }
  .ms-more { flex: none; align-self: center; width: 0; height: 30px; margin: 0; padding: 0; border: 0; border-radius: 999px; overflow: hidden; background: var(--ink); color: var(--field); font: 600 12.5px/30px var(--font);
    font-variant-numeric: tabular-nums; text-align: center; opacity: 0; cursor: pointer; transition: width .45s var(--soft), margin .45s var(--soft), opacity .2s, scale .35s var(--soft); }
  .ms-more.on { width: 44px; margin: 0 2px 0 0; opacity: 1; }
  .ms-more.bump { scale: 1.12; transition: scale .08s; }
  .ms-chev { flex: none; width: 44px; height: 52px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .ms-chev svg { width: 18px; height: 18px; transition: rotate .45s var(--soft); } .ms.open .ms-chev svg { rotate: 180deg; } .ms-chev:hover { color: var(--ink); }
  .ms-hint { margin: 14px 0 0; text-align: center; color: var(--muted); font-size: 13px; transition: opacity .5s; } .ms-hint.gone { opacity: 0; }
  /* the list: a card under the field, opening with a soft spring */
  .ms-menu { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; display: grid; grid-template-rows: 0fr; border-radius: 18px; background: var(--menu);
    box-shadow: 0 0 0 1px var(--line), 0 24px 44px -20px rgba(0,0,0,.24); opacity: 0; translate: 0 -6px; visibility: hidden;
    transition: grid-template-rows .34s cubic-bezier(.4,0,.6,1), translate .34s var(--ease), opacity .2s .12s, visibility 0s .34s; }
  .ms.open .ms-menu { grid-template-rows: 1fr; opacity: 1; translate: 0 0; visibility: visible; transition: grid-template-rows .62s cubic-bezier(.2,.9,.22,1), translate .62s var(--soft), opacity .14s; }
  .ms-in { min-height: 0; overflow: hidden; padding: 0 6px; }
  .ms-in > :first-child { margin-top: 6px; } .ms-in > :last-child { margin-bottom: 6px; }
  .ms-search, .ms-opt { opacity: 0; translate: 0 -8px; }
  .ms.open .ms-search, .ms.open .ms-opt { opacity: 1; translate: 0 0; transition: opacity .3s var(--d, 0s), translate .55s var(--soft) var(--d, 0s), background .15s; }
  .ms-search { position: relative; display: block; margin-bottom: 4px; --d: 40ms; transition: opacity .15s, translate .15s; }
  .ms-search svg { position: absolute; left: 12px; top: 11px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .ms-search input { width: 100%; height: 40px; padding: 0 12px 0 38px; border: 0; border-radius: 14px; background: var(--hover); color: var(--ink); font: 500 14px var(--font); outline: none; }
  .ms-search input::placeholder { color: var(--muted); }
  .ms-list { max-height: 264px; margin: 0; padding: 0; overflow: auto; overscroll-behavior: contain; list-style: none; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--ink) 18%, transparent) transparent; }
  .ms-opt { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 13px; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s, translate .15s, background .15s; }
  .ms-opt:hover, .ms-opt.act { background: var(--hover); }
  .ms-opt .fi { width: 22px; height: 22px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .ms-opt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-check { display: grid; place-items: center; width: 20px; height: 20px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 22%, transparent); color: var(--field); transition: background .2s, box-shadow .2s; }
  .ms-check svg { width: 12px; height: 12px; scale: 0; transition: scale .35s var(--soft); }
  .ms-opt[aria-selected=true] .ms-check { background: var(--ink); box-shadow: none; } .ms-opt[aria-selected=true] .ms-check svg { scale: 1; }
  .ms-empty { padding: 14px 12px; color: var(--muted); font-size: 14px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- the page's chrome (as the other lab pieces) ---------- */
  .back { position: fixed; top: 16px; left: 16px; z-index: 6; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 999px; background: #fff; color: #1b1c20; transition: top var(--morph), left var(--morph), translate .2s var(--ease); }
  .back:hover { translate: -2px 0; } .back svg { width: 20px; height: 20px; }
  .tune { position: fixed; top: 16px; right: 16px; z-index: 6; display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 20px 0 16px; border: 0; border-radius: 999px; background: #fff; color: #1b1c20;
    font: 600 14px var(--font); cursor: pointer; transition: transform .2s var(--ease), opacity .2s; }
  .tune:hover { transform: translateY(-1px); } .tune svg { width: 19px; height: 19px; } body.tuning .tune { opacity: 0; pointer-events: none; }
  body.dark .back, body.dark .tune { background: #1c1c1f; color: #f2f2f0; }
  body.tuning .back { top: 30px; left: 30px; }
  body.thumb .ms { top: 50px; } body.thumb .ms-list { max-height: 132px; }
  body.bare .back, body.bare .tune, body.bare .panel, body.bare .ms-hint, body.bare .dock { display: none !important; }
  /* the panel: a card beside the stage (lab-ui soft) */
  .panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 340px; z-index: 5; display: flex; flex-direction: column; overflow: auto; overscroll-behavior: contain; padding: 0 20px; --ui-pad: 20px;
    font-family: var(--font); border-radius: 26px; border: 1px solid var(--ui-card-line, rgba(20,20,20,.08)); opacity: 0; translate: 24px 0; visibility: hidden; transition: translate var(--morph), opacity .3s, visibility 0s .55s; }
  body.tuning .panel { opacity: 1; translate: 0 0; visibility: visible; transition: translate var(--morph), opacity .35s .08s; }
  .panel::-webkit-scrollbar { width: 0; }
  .ph { position: sticky; top: 0; z-index: 3; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 0 -20px; padding: 22px 20px 12px; background: var(--ui-bg); }
  .ph h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; } .ph p { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--ui-muted); }
  .pc { flex: none; width: 32px; height: 32px; margin: -4px -6px 0 0; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: var(--ui-ink); cursor: pointer; } .pc:hover { background: var(--ui-field); } .pc svg { width: 18px; height: 18px; }
  .acts { position: sticky; bottom: 0; display: flex; gap: 8px; margin: auto -20px 0; padding: 14px 20px 20px; background: var(--ui-bg); }
  .acts button { flex: 1; height: 40px; border: 0; border-radius: 999px; background: var(--ui-field); color: var(--ui-ink); font: 600 13px var(--font); cursor: pointer; } .acts button:hover { background: var(--ui-field-hi); }
  @media (min-width: 761px) { body.tuning .stage { inset: 16px 368px 16px 16px; } body.tuning .dock { left: calc(50% - 176px); bottom: calc(34px + env(safe-area-inset-bottom)); } }
  @media (max-width: 760px) {
    .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 56vh; translate: 0 calc(100% + 16px); }
    body.tuning .panel { translate: 0 0; } body.tuning .stage { inset: 8px 8px calc(56vh + 16px) 8px; border-radius: 22px; } body.tuning .back { top: 18px; left: 18px; } body.tuning .dock { display: none; }
    .ms { top: 84px; }
  }
</style>
</head>
<body>
<a class="back" href="../../" aria-label="Back to the lab" title="Back to the lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></a>
<button class="tune" id="tune" type="button" aria-controls="panel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Customize</button>
<main class="stage" id="stage">
  <div class="ms" id="ms">
    <div class="ms-top"><span class="ms-label" id="lbl">Countries</span><span class="ms-count" id="cnt"></span></div>
    <div class="ms-box">
    <div class="ms-field" id="field" role="combobox" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-controls="list" aria-labelledby="lbl">
      <div class="ms-view" id="view"><span class="ms-ph" id="ph">Choose countries</span></div>
      <button class="ms-more" id="more" type="button" tabindex="-1"></button>
      <button class="ms-chev" id="chev" type="button" tabindex="-1" aria-label="Show the list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="ms-menu" id="menu"><div class="ms-in">
      <label class="ms-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search countries" aria-controls="list"></label>
      <ul class="ms-list" id="list" role="listbox" aria-multiselectable="true" aria-label="Countries"></ul>
    </div></div>
    </div>
    <p class="ms-hint" id="hint">Swipe the pills · drag one down to remove it</p>
  </div>
</main>
<div class="fly" id="fly" aria-hidden="true"></div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<div class="dock" id="dock"><div class="vars" id="vars" role="group" aria-label="How a pill goes">
  <button id="prev" type="button" aria-label="Previous way out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  <span class="vn" id="nm" aria-live="polite">Fall</span>
  <button id="next" type="button" aria-label="Next way out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</div></div>
<p class="sr" id="live" aria-live="polite"></p>
<aside class="panel lab-ui soft" id="panel" aria-label="Customize the multiselect"></aside>
<script src="../../shared/lab-ui.js?v=20"></script>
<script>
// ---------- the settings and the choice; kept in the browser ----------
const KEY = 'lab.multiselect.v1';
const DEF = { theme: 'light', width: 400, soft: .5, bounce: .35, glide: .38, gravity: 2600, spin: 1, throwAway: true, flyIn: true, exit: 'fall' };
const START = ['pl', 'de', 'fr', 'it', 'es', 'pt', 'nl', 'se', 'no'];
const q = new URLSearchParams(location.search), THUMB = q.has('thumb');
let P = (() => { try { return { ...DEF, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch { return { ...DEF }; } })();
let SEL = (() => { try { const s = JSON.parse(localStorage.getItem(KEY + '.sel')); return Array.isArray(s) ? s : START.slice(); } catch { return START.slice(); } })();
if (THUMB) { P = { ...DEF }; SEL = START.slice(); document.body.classList.add('bare'); }
const save = () => { if (THUMB) return; try { const d = {}; for (const k in P) if (P[k] !== DEF[k]) d[k] = P[k]; localStorage.setItem(KEY, JSON.stringify(d)); localStorage.setItem(KEY + '.sel', JSON.stringify(SEL)); } catch { } };
const $ = id => document.getElementById(id), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches, coarse = matchMedia('(pointer: coarse)').matches;

const COUNTRIES = [['ar', 'Argentina'], ['au', 'Australia'], ['at', 'Austria'], ['be', 'Belgium'], ['br', 'Brazil'], ['ca', 'Canada'], ['cl', 'Chile'], ['cn', 'China'], ['hr', 'Croatia'], ['cz', 'Czechia'],
  ['dk', 'Denmark'], ['ee', 'Estonia'], ['fi', 'Finland'], ['fr', 'France'], ['de', 'Germany'], ['gr', 'Greece'], ['hu', 'Hungary'], ['is', 'Iceland'], ['in', 'India'], ['id', 'Indonesia'], ['ie', 'Ireland'],
  ['il', 'Israel'], ['it', 'Italy'], ['jp', 'Japan'], ['ke', 'Kenya'], ['lv', 'Latvia'], ['lt', 'Lithuania'], ['mx', 'Mexico'], ['ma', 'Morocco'], ['nl', 'Netherlands'], ['nz', 'New Zealand'], ['ng', 'Nigeria'],
  ['no', 'Norway'], ['pe', 'Peru'], ['ph', 'Philippines'], ['pl', 'Poland'], ['pt', 'Portugal'], ['ro', 'Romania'], ['sg', 'Singapore'], ['sk', 'Slovakia'], ['si', 'Slovenia'], ['za', 'South Africa'],
  ['kr', 'South Korea'], ['es', 'Spain'], ['se', 'Sweden'], ['ch', 'Switzerland'], ['th', 'Thailand'], ['tr', 'Türkiye'], ['ua', 'Ukraine'], ['ae', 'United Arab Emirates'], ['gb', 'United Kingdom'],
  ['us', 'United States'], ['vn', 'Vietnam']];
const NAME = Object.fromEntries(COUNTRIES);
SEL = SEL.filter(c => NAME[c]);

const ms = $('ms'), field = $('field'), view = $('view'), more = $('more'), fly = $('fly'), list = $('list'), search = $('search');
const PADL = 9, PADT = 9, ROWH = 34, GAP = 6, CHEVW = 44, CHIPW = 46;
const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

// ---------- the springs: one feel for everything (Softness = how slow, Bounce = how much it overshoots) ----------
let K = 300, C = 26;
function tune() { K = REDUCED ? 900 : lerp(560, 150, P.soft); C = 2 * (REDUCED ? 1 : lerp(1, .5, P.bounce)) * Math.sqrt(K); }
const spring = (o, k, t, dt, kk = K, cc = C) => { const a = kk * (t - o[k]) - cc * o['v' + k]; o['v' + k] += a * dt; o[k] += o['v' + k] * dt; };

// ---------- the pills ----------
// (a pill lives in the field (x, y in the row, under the scroll) or, when lifted, flying in or falling, on the fly layer over
//  the page (fx, fy on the screen, a turn r and a scale sc))
const PILLS = new Map(), FALL = [];
function makePill(code) { const el = document.createElement('span'); el.className = 'ms-pill'; el.dataset.code = code;
  el.innerHTML = `<span class="fi fis fi-${code}" aria-hidden="true"></span><span>${NAME[code]}</span><button class="ms-x" type="button" aria-label="Remove ${NAME[code]}">${X_ICON}</button>`;
  const p = { code, el, w: 0, x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, state: 'in', fx: 0, fy: 0, vfx: 0, vfy: 0, r: 0, vr: 0, sc: 1, vsc: 0, out: false, gx: 0, gy: 0 };
  const x = el.querySelector('.ms-x'); x.addEventListener('click', e => { e.stopPropagation(); remove(code); });
  x.addEventListener('focus', () => reveal(p)); x.addEventListener('keydown', e => { if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); focusNext(code); remove(code); } });
  view.appendChild(el); p.w = el.offsetWidth; flagImg(code); return p; }
const FLAGS = {}; function flagImg(c) { if (FLAGS[c]) return FLAGS[c]; const i = new Image(); i.crossOrigin = 'anonymous'; i.src = `https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/flags/1x1/${c}.svg`; return FLAGS[c] = i; }
for (const c of SEL) { const p = makePill(c); PILLS.set(c, p); }

// ---------- the layout: one row (collapsed) or wrapped rows (expanded); everything springs to its place ----------
let EXP = false, S = 0, vS = 0, STO = null, maxS = 0, viewW = 300, chipOn = false, FH = 52, vFH = 0, FH_T = 52, wheelT = -1e9, DRAG = null;
function layout() { const fw = field.clientWidth, live = SEL.map(c => PILLS.get(c)).filter(p => p && !p.out);
  const natural = live.reduce((a, p) => a + p.w + GAP, 0) - GAP + PADL * 2;
  chipOn = EXP || natural > fw - CHEVW; viewW = fw - CHEVW - (chipOn ? CHIPW : 0);
  let x = 0, y = 0, rows = 1; const avail = viewW - PADL * 2;
  for (const p of live) { if (EXP && x > 0 && x + p.w > avail) { x = 0; y += ROWH + GAP; rows++; } p.tx = x; p.ty = y; x += p.w + GAP; }
  maxS = EXP ? 0 : Math.max(0, x - GAP + PADL * 2 - viewW);
  FH_T = EXP ? Math.max(52, PADT * 2 + rows * ROWH + (rows - 1) * GAP) : 52;
  more.classList.toggle('on', chipOn); $('ph').classList.toggle('off', SEL.length > 0);

  for (const p of PILLS.values()) { if (p.state === 'in') p.el.style.transform = `translate(${(PADL + p.x - S).toFixed(2)}px, ${(PADT + p.y).toFixed(2)}px)`;
    else p.el.style.transform = `translate(${p.fx.toFixed(2)}px, ${p.fy.toFixed(2)}px) rotate(${p.r.toFixed(2)}deg) scale(${p.sc.toFixed(4)})`; }
  drawFx(dt);
  for (let i = FALL.length - 1; i >= 0; i--) { const p = FALL[i]; p.el.style.transform = `translate(${p.fx.toFixed(2)}px, ${p.fy.toFixed(2)}px) rotate(${p.r.toFixed(2)}deg)`; if (p.fy > innerHeight + 140) { p.el.remove(); FALL.splice(i, 1); } }
  const hn = EXP ? -2 : hidden(); if (hn !== shown) { more.textContent = EXP ? 'Less' : '+' + hn; more.setAttribute('aria-label', EXP ? 'Show one line' : `${hn} more, show all`);
    if (shown >= 0 && hn >= 0) { more.classList.add('bump'); setTimeout(() => more.classList.remove('bump'), 90); } shown = hn; } }

// ---------- the panel ----------
const panel = $('panel'), ctl = {};
function apply() { document.body.classList.toggle('dark', P.theme === 'dark'); panel.classList.toggle('dark', P.theme === 'dark'); $('vars').classList.toggle('dark', P.theme === 'dark'); $('nm').textContent = EXIT_NAME[P.exit] || 'Fall'; document.querySelector('meta[name=theme-color]').content = P.theme === 'dark' ? '#121214' : '#f3f2ee';
  ms.style.setProperty('--w', P.width + 'px'); tune(); layout(); }
function buildPanel() { panel.innerHTML = '';
  const head = document.createElement('header'); head.className = 'ph'; head.innerHTML = '<div><h2>Tune</h2><p>How the pills move, fall and look.</p></div><button class="pc" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  head.querySelector('.pc').onclick = () => openPanel(false); panel.appendChild(head);
  const set = (k, v) => { P[k] = v; save(); apply(); };
  const sl = (g, k, label, min, max, step, unit = '') => ctl[k] = LabUI.slider(g, { label, min, max, step, unit, value: P[k], def: DEF[k], onInput: v => set(k, v) });
  const g1 = LabUI.group(panel, 'Look', { key: KEY + '.g.look', open: true });
  ctl.theme = LabUI.seg(g1, { label: 'Theme', options: [['light', 'Light'], ['dark', 'Dark']], value: P.theme, onChange: v => set('theme', v) });
  sl(g1, 'width', 'Field width', 260, 560, 4, 'px');
  const g2 = LabUI.group(panel, 'Motion', { key: KEY + '.g.motion', open: true });
  sl(g2, 'soft', 'Softness', 0, 1, .01); sl(g2, 'bounce', 'Bounce', 0, 1, .01); sl(g2, 'glide', 'Glide after a swipe', .1, .8, .01, 's');
  const g3 = LabUI.group(panel, 'Throw away', { key: KEY + '.g.fall' });
  ctl.throwAway = LabUI.check(g3, { label: 'Grab a pill and throw it down', value: P.throwAway, onChange: v => set('throwAway', v) });
  ctl.flyIn = LabUI.check(g3, { label: 'Picked items fly into the field', value: P.flyIn, onChange: v => set('flyIn', v) });
  sl(g3, 'gravity', 'Gravity', 800, 4400, 50); sl(g3, 'spin', 'Spin', 0, 2, .05, '×');
  const acts = document.createElement('div'); acts.className = 'acts'; acts.innerHTML = '<button type="button" data-a="fill">Refill the field</button><button type="button" data-a="reset">Reset</button>'; panel.appendChild(acts);
  acts.querySelector('[data-a=fill]').onclick = () => { let d = 0; for (const c of START) if (!SEL.includes(c)) { const r = field.getBoundingClientRect(); setTimeout(() => add(c, { x: r.left + r.width / 2 - 40, y: r.top - 70 }), d); d += 70; } };
  acts.querySelector('[data-a=reset]').onclick = () => { P = { ...DEF }; save(); for (const k in ctl) ctl[k].set?.(P[k]); apply(); }; }
function openPanel(on) { document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); setTimeout(layout, 600); }
$('tune').onclick = () => openPanel(true);
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('tuning')) openPanel(false); });

// ---------- start (?thumb=1: the lab board's still picture: no chrome, the list open) ----------
if (!THUMB) { buildPanel(); const stepExit = d => setExit(EXITS[(EXITS.indexOf(P.exit) + d + EXITS.length) % EXITS.length]);
  LabUI.variants($('vars'), { prev: $('prev'), next: $('next'), name: $('nm'), onStep: stepExit, items: () => EXITS.map(k => EXIT_NAME[k]), current: () => EXIT_NAME[P.exit], onPick: n => setExit(EXITS.find(k => EXIT_NAME[k] === n)) });
  addEventListener('keydown', e => { if (e.target.closest?.('input, .panel, .ms')) return; if (e.key === 'ArrowRight') stepExit(1); if (e.key === 'ArrowLeft') stepExit(-1); }); }
apply(); for (const p of PILLS.values()) { p.x = p.tx; p.y = p.ty; }
if (THUMB) { document.body.classList.add('thumb'); openMenu(true); ACT = ROWS.findIndex(r => r[0] === 'fr'); render(); const fi = $('o-fi'); if (fi) list.scrollTop = fi.offsetTop - list.offsetTop; }
requestAnimationFrame(frame);
window.MS = { setExit, PARTS, get P() { return P; }, get SEL() { return SEL; }, PILLS, FALL, add, remove, openMenu, setExp, layout, get S() { return S; }, set S(v) { S = v; }, get maxS() { return maxS; }, hidden };
</script>
</body>
