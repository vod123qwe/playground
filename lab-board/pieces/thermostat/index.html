<style>
  /* A thermostat dial, after a skeuomorphic design in Figma (UI Practice, Playground #1), made as a real object: a knob turned in
     3D (a chamfered top edge that catches the light, a fine knurl round its side, a dished display with a raised lip), set in a
     housing with a channel where the light arc glows. It works: drag round it, the wheel, the arrow keys; half degrees with a soft
     click; the knob follows on a spring and leans a touch towards the pointer; the number rolls digit by digit. Light by default. */
  :root { --bg: #d9d8d4; --ink: #292929; --sub: #292929; --chip: #fff; --chip-ink: #1b1c20; --hint: rgba(41,41,41,.4); --ease: cubic-bezier(.22,.61,.36,1); --morph: .55s cubic-bezier(.3,1.12,.4,1); --page: #fff; }
  body.dark { --bg: #1d1f27; --ink: #e7e7e7; --sub: rgba(231,231,231,.22); --chip: #2a2d36; --chip-ink: #e7e7e7; --hint: rgba(231,231,231,.35); --page: #15161c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--lab-font); overflow: hidden; user-select: none; -webkit-user-select: none; transition: background .4s; }
  body.tuning { background: var(--page); }
  .stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); transition: inset var(--morph), border-radius var(--morph), background .4s; }
  body.tuning .stage { border-radius: 26px; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* the hand and the reading sit over the 3D, at the design's size (700 × 700), scaled with it */
  .dial { position: absolute; left: 50%; top: 50%; width: 700px; height: 700px; translate: -50% -50%; scale: var(--k, 1); pointer-events: none; }
  .knob { position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; translate: -50% -50%; border-radius: 50%; pointer-events: auto; cursor: grab; touch-action: none; outline: none; }
  .knob.drag { cursor: grabbing; }
  .knob:focus-visible::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 25%, transparent); }
  .dish { position: absolute; left: 50%; top: 50%; width: 330px; height: 330px; translate: -50% -50%; margin: 0; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink);
    font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; pointer-events: auto; cursor: pointer; transition: scale .4s cubic-bezier(.3,1.5,.5,1); }
  .dish:active { scale: .985; } .dish:focus-visible { outline: 2px solid color-mix(in srgb, var(--ink) 30%, transparent); outline-offset: 6px; }
  /* the number: a column of digits per place, rolling to the new value on a spring, fading at its top and bottom instead of cut */
  .num { display: flex; align-items: center; height: 1.3em; margin: -.14em 0; font-variant-numeric: tabular-nums; font: 600 77px/1.3em 'Unbounded', var(--lab-font); letter-spacing: -.02em; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.35);
    -webkit-mask: linear-gradient(transparent, #000 24%, #000 76%, transparent); mask: linear-gradient(transparent, #000 24%, #000 76%, transparent); }
  body.dark .num { text-shadow: 0 -1px 0 rgba(0,0,0,.4); }
  .col { position: relative; height: 1.3em; overflow: visible; display: inline-block; text-align: center; transition: width .5s cubic-bezier(.3,1.2,.4,1), opacity .3s; }
  .col .strip { display: flex; flex-direction: column; transition: transform .62s cubic-bezier(.25,1.25,.4,1); }
  .col .strip span { display: block; height: 1.3em; }
  .col.static { width: auto; }
  .col.gone { opacity: 0; }
  /* engraved: the reading pressed into the dish, a shade of its surface, lit on the lower lip and shaded on the upper */
  body.engraved .num, body.engraved .unit { color: #c4c2bc; text-shadow: 0 1.4px 1px rgba(255,255,255,.85), 0 -1px 1.2px rgba(0,0,0,.22); }
  body.engraved.dark .num, body.engraved.dark .unit { color: #1b1c21; text-shadow: 0 1px .5px rgba(255,255,255,.09), 0 -1.2px 1.2px rgba(0,0,0,.65); }
  .unit { font: 700 30px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .02em; text-transform: uppercase; color: var(--sub); }
  /* chrome, as on the other lab pieces */
  .back, .tune { position: fixed; top: 16px; z-index: 6; transition: top var(--morph), left var(--morph); }
  .back { left: 16px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 999px; background: var(--chip); color: var(--chip-ink); }
  .back:hover { translate: -2px 0; } .back svg { width: 20px; height: 20px; }
  .tune { right: 16px; display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 20px 0 16px; border: 0; border-radius: 999px; background: var(--chip); color: var(--chip-ink); font: 600 14px var(--lab-font); cursor: pointer; transition: transform .2s var(--ease), opacity .3s; }
  .tune:hover { transform: translateY(-1px); } .tune svg { width: 19px; height: 19px; } body.tuning .tune { opacity: 0; pointer-events: none; } body.tuning .back { top: 30px; left: 30px; }
  .hint { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); margin: 0; color: var(--hint); font-size: 13px; pointer-events: none; transition: opacity .6s, left var(--morph); white-space: nowrap; }
  .hint.gone { opacity: 0; }

  .modes { position: fixed; left: 50%; bottom: calc(52px + env(safe-area-inset-bottom)); z-index: 4; transform: translateX(-50%); transition: left var(--morph); }
  .modes button { height: 40px; padding: 0 16px 0 13px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; background: var(--chip); color: var(--chip-ink); font: 600 13px var(--lab-font); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .modes button svg { width: 17px; height: 17px; } .modes button[aria-pressed=true] { background: var(--chip-ink); color: var(--chip); }
  body.editing .knob { pointer-events: none; } body.editing .dish { pointer-events: none; } body.editing .stage { cursor: grab; } body.editing .stage.orbiting { cursor: grabbing; }
  .dial { transition: opacity .3s; } body.away .dial { opacity: 0; }
  /* the shape editor: a card docked at the left; the rings by name, the picked one's controls */
  .shaper { position: fixed; left: 16px; top: 78px; z-index: 7; width: 290px; max-height: calc(100vh - 170px); overflow: auto; padding: 4px 16px 14px; --ui-pad: 16px; border-radius: 22px;
    border: 1px solid var(--ui-card-line, rgba(20,20,20,.08)); box-shadow: 0 18px 40px -20px rgba(0,0,0,.3); font-family: var(--lab-font); opacity: 0; translate: -10px 0; pointer-events: none; transition: opacity .25s, translate .45s cubic-bezier(.3,1.3,.5,1); }
  body.editing .shaper { opacity: 1; translate: 0 0; pointer-events: auto; }
  .shaper h3 { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 8px; font-size: 15px; font-weight: 600; }
  .shaper .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .shaper .chips button { height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--ui-field); color: var(--ui-ink); font: 500 12.5px var(--lab-font); cursor: pointer; transition: background .2s, color .2s; }
  .shaper .chips button.hov { box-shadow: inset 0 0 0 1.5px #ff8a12; } .shaper .chips button.on { background: var(--ui-on, #1b1c20); color: var(--ui-on-text, #fff); }
  .shaper p { margin: 2px 0 6px; font-size: 12.5px; line-height: 1.45; color: var(--ui-muted); }
  .shaper .row { display: flex; gap: 6px; margin-top: 10px; } .shaper .row button { flex: 1; height: 34px; border: 0; border-radius: 999px; background: var(--ui-field); color: var(--ui-ink); font: 600 12.5px var(--lab-font); cursor: pointer; }
  .shaper .row button.dark { background: var(--ui-on, #1b1c20); color: var(--ui-on-text, #fff); }
  @media (max-width: 760px) { .shaper { left: 8px; right: 8px; top: auto; bottom: 104px; width: auto; max-height: 46vh; } }
  body.tuning .modes { left: calc(50% - 176px); } body.bare .modes { display: none !important; }
  @media (max-width: 760px) { body.tuning .modes { display: none; } }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--hint); font-size: 13px; pointer-events: none; transition: opacity .4s; } body.ready .loading { opacity: 0; }
  .panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 340px; z-index: 5; display: flex; flex-direction: column; overflow: auto; overscroll-behavior: contain; padding: 0 20px; --ui-pad: 20px;
    font-family: var(--lab-font); border-radius: 26px; border: 1px solid var(--ui-card-line, rgba(20,20,20,.08)); opacity: 0; translate: 24px 0; visibility: hidden; transition: translate var(--morph), opacity .3s, visibility 0s .55s; }
  body.tuning .panel { opacity: 1; translate: 0 0; visibility: visible; transition: translate var(--morph), opacity .35s .08s; }
  .panel::-webkit-scrollbar { width: 0; }
  .ph { position: sticky; top: 0; z-index: 3; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 0 -20px; padding: 22px 20px 12px; background: var(--ui-bg); }
  .ph h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; } .ph p { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--ui-muted); }
  .pc { flex: none; width: 32px; height: 32px; margin: -4px -6px 0 0; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: var(--ui-ink); cursor: pointer; } .pc:hover { background: var(--ui-field); } .pc svg { width: 18px; height: 18px; }
  @media (min-width: 761px) { body.tuning .stage { inset: 16px 368px 16px 16px; } body.tuning .hint { left: calc(50% - 176px); } }
  @media (max-width: 760px) { .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 56vh; translate: 0 calc(100% + 16px); } body.tuning .panel { translate: 0 0; }
    body.tuning .stage { inset: 8px 8px calc(56vh + 16px) 8px; border-radius: 22px; } body.tuning .hint { display: none; } }
  body.bare .back, body.bare .tune, body.bare .panel, body.bare .hint, body.bare .loading { display: none !important; }

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- the settings; kept in the browser ----------
const KEY = 'lab.thermostat.v2', MIN = 8, MAX = 28, STEP = .5, SWEEP = 270;
const SHAPE = { pe: { round: .55, reach: 6, layer: 'joined' }, rf: { round: 1, reach: 3, layer: 'joined' }, ke: { round: .6, reach: 3.5, layer: 'joined' }, ds: { round: .5, reach: 1.8, layer: 'joined' }, dish: { depth: 10.7, spread: 2.6 } };
const cloneShape = () => JSON.parse(JSON.stringify(SHAPE));
const DEF = { value: 21, unit: 'c', text: 'printed', theme: 'light', sound: true, glow: 1, tilt: true, grain: 1, grainSize: 1, haze: .9, hazeSize: 1, energy: .6, energySpeed: 1, shape: cloneShape() };
const q = new URLSearchParams(location.search), THUMB = q.has('thumb'), DEMO = q.has('demo'), BARE = THUMB || DEMO;
let P = (() => { const p = { ...DEF }; try { const o = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in DEF) if (typeof o[k] === typeof DEF[k]) p[k] = o[k]; } catch { } return p; })();
if (BARE) P = { ...DEF, theme: q.get('theme') === 'dark' ? 'dark' : 'light' };
{ const sh = cloneShape(); for (const k in sh) Object.assign(sh[k], (P.shape || {})[k] || {}); P.shape = sh; }   // (a saved shape over the defaults, ring by ring)
const save = () => { if (BARE) return; try { const d = {}; for (const k in P) if (P[k] !== DEF[k]) d[k] = P[k]; localStorage.setItem(KEY, JSON.stringify(d)); } catch { } };
const $ = id => document.getElementById(id), stage = $('stage'), dial = $('dial'), knobEl = $('knob');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), snap = v => Math.round(v / STEP) * STEP, rad = d => d * Math.PI / 180;
const angleOf = v => -SWEEP / 2 + (v - MIN) / (MAX - MIN) * SWEEP;   // (degrees, clockwise from the top)

// ---------- the room: the dial is set into a flat panel, seen from above; soft light from the room, a key light from the upper
// right, low enough to fall into the recess (the panel's edge throws its shadow onto the knob) ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: THUMB });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; stage.prepend(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(18, 1, 100, 9000); camera.up.set(0, 1, 0);
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
const key = new THREE.DirectionalLight(0xffffff, 2); key.position.set(340, 560, 880); key.castShadow = true;
Object.assign(key.shadow.camera, { left: -420, right: 420, top: 420, bottom: -420, near: 200, far: 2400 }); key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5; key.shadow.bias = -.0003; key.shadow.normalBias = 1.2;
const fill = new THREE.HemisphereLight(0xffffff, 0x9a9aa0, .5); scene.add(key, fill);

// ---------- the material: a fine grain on every surface (bead-blasted, as on a camera ring): the normal and the colour stirred by a
// small noise that sits on the part itself, so the knob's grain turns with the knob ----------
const GRAIN_GLSL = `varying vec3 vGP; uniform float uGrain, uGrainS, uGrainC;
float gh(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }   // (a hash without sin: no streaks far from the middle)
float gn(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(mix(gh(i), gh(i + vec3(1, 0, 0)), f.x), mix(gh(i + vec3(0, 1, 0)), gh(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(gh(i + vec3(0, 0, 1)), gh(i + vec3(1, 0, 1)), f.x), mix(gh(i + vec3(0, 1, 1)), gh(i + vec3(1, 1, 1)), f.x), f.y), f.z); }
`;
function grained(params) { const m = new THREE.MeshPhysicalMaterial(params); m.userData.grain = { uGrain: { value: .22 }, uGrainS: { value: .85 }, uGrainC: { value: .06 } };
  m.onBeforeCompile = sh => { Object.assign(sh.uniforms, m.userData.grain);
    sh.vertexShader = 'varying vec3 vGP;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n  vGP = position;');
    sh.fragmentShader = GRAIN_GLSL + sh.fragmentShader
      .replace('#include <color_fragment>', '#include <color_fragment>\n  diffuseColor.rgb *= 1. + (gn(vGP * uGrainS * .8 + 7.3) - .5) * uGrainC;')
      .replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\n  { vec3 gp = vGP * uGrainS; normal = normalize(normal + vec3(gn(gp) - .5, gn(gp + 31.7) - .5, 0.) * uGrain); }'); };
  return m; }

// ---------- the shapes (px of the design; the panel's face is z = 0): the panel with a round cut, a machined chamfer and a straight
// wall down into the recess, the channel at its floor where the light runs; the knob sunk in it, its face 7 below the panel, a crisp
// chamfer at its edge, a fine knurl round its side, a stepped dish in the middle ----------
function lathe(pts, seg = 256) { const g = new THREE.LatheGeometry(pts.map(([r, z]) => new THREE.Vector2(r, z)), seg); g.rotateX(Math.PI / 2); return g; }
const FACE = -7, FLOOR = -31, W_R = 295, KR = 272.8, DISH_R = 205;
// (a rounded corner: from reach before the corner to reach after it, between a straight chamfer (round 0) and a full curve (round 1))
function corner(C, dIn, dOut, rIn, rOut, round, n = 18) { const A = [C[0] - dIn[0] * rIn, C[1] - dIn[1] * rIn], B = [C[0] + dOut[0] * rOut, C[1] + dOut[1] * rOut], out = [];
  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t, lx = A[0] + (B[0] - A[0]) * t, ly = A[1] + (B[1] - A[1]) * t, bx = u * u * A[0] + 2 * u * t * C[0] + t * t * B[0], by = u * u * A[1] + 2 * u * t * C[1] + t * t * B[1];
    out.push([lx + (bx - lx) * round, ly + (by - ly) * round]); } return out; }
// (the profiles, built from the rings: the panel's edge (pe) and the recess's floor (rf); the knob's edge (ke), the dish's edge (ds), the dish)
// (a ring's reach runs fully across a face and as far down a wall as the wall allows, so a big reach makes a wide, soft bevel)
const reachOf = () => { const S = P.shape, peV = Math.min(S.pe.reach, 22), rfV = Math.min(S.rf.reach, -FLOOR - peV - 1.5), keV = Math.min(S.ke.reach, FACE - FLOOR - 6),
    room = KR - DISH_R - 6, keH = Math.min(S.ke.reach, room * .7), dsH = Math.min(S.ds.reach, room - keH), dsV = Math.min(S.ds.reach, Math.max(1, S.dish.depth - 1));
  return { peV, peH: S.pe.reach, rfV, rfH: Math.min(S.rf.reach, 120), keV, keH, dsH, dsV }; };
// (an edge set as its own layer: a small step of LEDGE between it and the surface next to it, as on a stepped camera ring)
const LEDGE = 1.8;
let peOut = W_R;
function profiles() { const S = P.shape, R = reachOf(), sep = id => S[id].layer === 'separate';
  const recess = [[0, FLOOR]];
  if (sep('rf')) recess.push([W_R - 6.5, FLOOR], [W_R - 6.5, FLOOR + LEDGE], ...corner([W_R, FLOOR + LEDGE], [1, 0], [0, 1], Math.min(R.rfH, 6), R.rfV, S.rf.round));
  else recess.push(...corner([W_R, FLOOR], [1, 0], [0, 1], R.rfH, R.rfV, S.rf.round));
  peOut = W_R; if (sep('pe')) { const zs = -R.peV - LEDGE * 1.6; recess.push([W_R, zs], [W_R + 5, zs]); peOut = W_R + 5; }
  recess.push(...corner([peOut, 0], [0, 1], [1, 0], R.peV, R.peH, S.pe.round));
  const keZ = sep('ke') ? FACE - LEDGE : FACE, dsZ = sep('ds') ? FACE - LEDGE : FACE;
  const stepH = Math.max(2.4, R.dsV + .3), rimZ = dsZ - stepH, fall = Math.max(.5, S.dish.depth - (FACE - rimZ)), bowl = [];
  for (let i = 1; i <= 48; i++) { const r = DISH_R * (1 - i / 48); bowl.push([r, rimZ - fall * (1 - Math.pow(r / DISH_R, S.dish.spread))]); }
  const knob = [[262, FLOOR], [269.5, FLOOR + .8], [KR - .3, FLOOR + 3.6], [KR, Math.min(-12, keZ - R.keV - .5)], ...corner([KR, keZ], [0, 1], [-1, 0], R.keV, R.keH, S.ke.round)];
  if (sep('ke')) knob.push([KR - R.keH - 2.2, keZ], [KR - R.keH - 2.2, FACE]);
  if (sep('ds')) knob.push([DISH_R + R.dsH + 2.2, FACE], [DISH_R + R.dsH + 2.2, dsZ]);
  knob.push(...corner([DISH_R, dsZ], [-1, 0], [0, -1], R.dsH, R.dsV, S.ds.round), [DISH_R, rimZ], ...bowl);
  return { recess, knob: knob.reverse() }; }
function panelGeometry(hr) { const sh = new THREE.Shape(); sh.moveTo(-5000, -5000); sh.lineTo(5000, -5000); sh.lineTo(5000, 5000); sh.lineTo(-5000, 5000); sh.lineTo(-5000, -5000);

  const tip = document.createElement('p'); tip.style.marginTop = '12px'; tip.textContent = 'Drag to look round in 3D · scroll to come closer · double-click to face it again.'; shaper.appendChild(tip); }
function pick(r) { pickRing = r; buildShaper(); placeLine(pickLine, r); }
function hover(r) { if (r === hoverRing) return; hoverRing = r; placeLine(hoverLine, r && r !== pickRing ? r : null); shaper.querySelectorAll('.chips button').forEach(b => b.classList.toggle('hov', !!r && b.dataset.id === r.id)); }
function setEdit(on) { EDIT = on; document.body.classList.toggle('editing', on); $('bEdit').setAttribute('aria-pressed', String(on)); $('hint').classList.remove('gone');
  $('hint').textContent = on ? 'Pick a ring · drag to look round' : 'Turn the dial · tap the middle for °F';
  if (on) { buildShaper(); placeLine(pickLine, pickRing); } else { hover(null); placeLine(pickLine, null); orbit.tt = 0; orbit.tp = 0; orbit.tz = 1; } }
// (the orbit: azimuth, polar angle from straight above, zoom; eased)
const orbit = { t: 0, p: 0, z: 1, tt: 0, tp: 0, tz: 1 }; let od = null;
const rayE = new THREE.Raycaster(), ndcE = new THREE.Vector2();
function surfaceAt(e) { const r = stage.getBoundingClientRect(); ndcE.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height * 2 - 1)); rayE.setFromCamera(ndcE, camera);
  const hit = rayE.intersectObjects([knobMesh, recess, panel], false)[0]; if (!hit) return null; const p = hit.point.clone(); if (hit.object === knobMesh) knob.worldToLocal(p); return p; }
stage.addEventListener('pointerdown', e => { if (!EDIT || e.button > 0 || e.target.closest('.shaper')) return; od = { id: e.pointerId, x: e.clientX, y: e.clientY, t: orbit.tt, p: orbit.tp, moved: false }; try { stage.setPointerCapture(e.pointerId); } catch { } });
stage.addEventListener('pointermove', e => { if (!EDIT) return;
  if (od && e.pointerId === od.id) { const dx = e.clientX - od.x, dy = e.clientY - od.y; if (!od.moved && Math.hypot(dx, dy) > 4) { od.moved = true; stage.classList.add('orbiting'); }
    if (od.moved) { orbit.tt = od.t - dx * .006; orbit.tp = clamp(od.p + dy * .005, 0, 1.25); return; } }
  const p = surfaceAt(e); hover(p ? ringAt(p) : null); });
const endOrbit = e => { if (!od || e.pointerId !== od.id) return; if (!od.moved && hoverRing) pick(hoverRing); od = null; stage.classList.remove('orbiting'); };
stage.addEventListener('pointerup', endOrbit); stage.addEventListener('pointercancel', endOrbit);
stage.addEventListener('wheel', e => { if (!EDIT) return; e.preventDefault(); orbit.tz = clamp(orbit.tz * Math.exp(e.deltaY * .0012), .45, 2.2); }, { passive: false });
stage.addEventListener('dblclick', () => { if (EDIT) { orbit.tt = 0; orbit.tp = 0; orbit.tz = 1; } });
$('bEdit').onclick = () => setEdit(!EDIT);
addEventListener('keydown', e => { if (e.key === 'Escape' && EDIT) setEdit(false); });

// ---------- the view: the dial fills what the screen leaves, the camera straight above it (tilted a little with the pointer) ----------
let K = 1;
function frameView() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  K = Math.max(.3, Math.min(1, (w - 24) / 700, (h - (BARE ? 0 : 90)) / 700)); dial.style.setProperty('--k', K.toFixed(4)); }
function place() { const h = stage.clientHeight, vf = 2 * Math.tan(rad(camera.fov / 2)), dist = h / K / vf;   // (one pixel of the design is K pixels on the screen, at the face's height)
  const ax = tilt.x * .09, ay = tilt.y * .09, d = dist * orbit.z, sp = Math.sin(orbit.p), cp = Math.cos(orbit.p);
  camera.position.set(Math.sin(ax) * d + sp * Math.sin(orbit.t) * d, -Math.sin(ay) * d - sp * Math.cos(orbit.t) * d, FACE + cp * Math.cos(ax) * Math.cos(ay) * d); camera.lookAt(0, 0, FACE);
  // (the reading and the hand sit flat over the dial: they step aside while the view is turned or closer)
  document.body.classList.toggle('away', orbit.p > .03 || Math.abs(orbit.z - 1) > .03); }
new ResizeObserver(() => { frameView(); if (THUMB) render(); }).observe(stage);

// ---------- the loop ----------
let last = 0;
function render() { place(); knob.rotation.z = -rad(angleOf(cur)); paintArc(cur); renderer.render(scene, camera); }
function frame(now) { requestAnimationFrame(frame); const dt = Math.min(.033, last ? (now - last) / 1000 : .016); last = now;
  const k = 420, c = 2 * .8 * Math.sqrt(k); vel += (k * (target - cur) - c * vel) * dt; cur += vel * dt;
  tilt.x += (tilt.tx - tilt.x) * .08; tilt.y += (tilt.ty - tilt.y) * .08; for (const k of ['t', 'p', 'z']) orbit[k] += (orbit['t' + k] - orbit[k]) * .14; ETIME += dt * 2.4 * P.energySpeed; stepLines(); stepHaze(dt); render(); }

// ---------- the panel ----------
const uiPanel = $('panel');
function buildPanel() { uiPanel.innerHTML = '';
  const head = document.createElement('header'); head.className = 'ph'; head.innerHTML = '<div><h2>Tune</h2><p>Light or dark, the unit, the glow and the click of each step.</p></div><button class="pc" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  head.querySelector('.pc').onclick = () => openPanel(false); uiPanel.appendChild(head);
  const g = LabUI.group(uiPanel, 'Dial', { key: KEY + '.g', open: true });
  LabUI.seg(g, { label: 'Theme', options: [['light', 'Light'], ['dark', 'Dark']], value: P.theme, onChange: v => { P.theme = v; save(); applyTheme(); } });
  LabUI.seg(g, { label: 'Reading', options: [['printed', 'Printed'], ['engraved', 'Engraved']], value: P.text, onChange: v => { P.text = v; save(); document.body.classList.toggle('engraved', v === 'engraved'); } });
  LabUI.seg(g, { label: 'Unit', options: [['c', 'Celsius'], ['f', 'Fahrenheit']], value: P.unit, onChange: v => { P.unit = v; save(); readout(target); } });

  LabUI.check(g, { label: 'A soft click at each half degree', value: P.sound, onChange: v => { P.sound = v; save(); } });
  LabUI.check(g, { label: 'Lean towards the pointer', value: P.tilt, onChange: v => { P.tilt = v; save(); if (!v) tilt.tx = tilt.ty = 0; } });
  const gl = LabUI.group(uiPanel, 'Light', { key: KEY + '.gl', open: true });
  LabUI.slider(gl, { label: 'Brightness', min: 0, max: 2, step: .05, unit: '×', value: P.glow, def: DEF.glow, onInput: v => { P.glow = v; save(); } });
  LabUI.slider(gl, { label: 'Haze', min: 0, max: 2, step: .05, unit: '×', value: P.haze, def: DEF.haze, onInput: v => { P.haze = v; save(); } });
  LabUI.slider(gl, { label: 'Haze size', min: .4, max: 2.5, step: .05, unit: '×', value: P.hazeSize, def: DEF.hazeSize, onInput: v => { P.hazeSize = v; save(); } });
  LabUI.slider(gl, { label: 'Energy', min: 0, max: 1.5, step: .05, unit: '', value: P.energy, def: DEF.energy, onInput: v => { P.energy = v; save(); } });
  LabUI.slider(gl, { label: 'Energy speed', min: .2, max: 3, step: .05, unit: '×', value: P.energySpeed, def: DEF.energySpeed, onInput: v => { P.energySpeed = v; save(); } });
  const gm = LabUI.group(uiPanel, 'Material', { key: KEY + '.gm', open: true });
  LabUI.slider(gm, { label: 'Grain', min: 0, max: 2.5, step: .05, unit: '×', value: P.grain, def: DEF.grain, onInput: v => { P.grain = v; save(); paintGrain(); } });
  LabUI.slider(gm, { label: 'Grain size', min: .5, max: 4, step: .05, unit: '×', value: P.grainSize, def: DEF.grainSize, onInput: v => { P.grainSize = v; save(); paintGrain(); } });
  const gs = LabUI.group(uiPanel, 'Shape', { key: KEY + '.gs', open: true });
  const p = document.createElement('p'); p.className = 'note'; p.style.cssText = 'margin:2px 0 10px; font-size:12.5px; line-height:1.45; color:var(--ui-muted)'; p.textContent = 'Edit shape (at the bottom) opens the rings: pick one, shape its rounding and reach, and turn the dial round in 3D to see it.'; gs.appendChild(p);
  const rb = document.createElement('button'); rb.type = 'button'; rb.textContent = 'Reset the shape'; rb.style.cssText = 'height:36px; padding:0 14px; border:0; border-radius:999px; background:var(--ui-field); color:var(--ui-ink); font:600 13px var(--lab-font); cursor:pointer; margin-bottom:10px';
  rb.onclick = () => { P.shape = cloneShape(); save(); rebuild(); if (EDIT) buildShaper(); }; gs.appendChild(rb); }
function openPanel(on) { document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);
addEventListener('keydown', e => { if (e.key === 'Escape' && !EDIT) openPanel(false); });

// ---------- start (?thumb=1 the still at 21°, &theme=dark; ?demo=1 it turns by itself) ----------
if (BARE) document.body.classList.add('bare'); else buildPanel();
frameView(); applyTheme(); readout(target); document.body.classList.toggle('engraved', P.text === 'engraved' || q.get('text') === 'engraved');
document.fonts.ready.then(() => readout(target));
if (THUMB) render(); else requestAnimationFrame(frame);
document.body.classList.add('ready');
if (DEMO) { const seq = [24, 18, 21], wait = ms => new Promise(r => setTimeout(r, ms)); (async () => { for (;;) for (const v of seq) { await wait(1800); while (target !== v) { set(target + Math.sign(v - target) * STEP); await wait(90); } } })(); }
window.DIAL = { orbit, pick, ringAt, surfaceAt, set, get value() { return target; }, render, scene, camera, knob, setEdit, rebuild, get P() { return P; }, HAZE, stepHaze };
</script>
</body>
</html>
