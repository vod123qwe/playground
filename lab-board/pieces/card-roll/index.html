<style>
  /* A wallet as a rolodex: eight payment cards on a drum, seen from a little above. The wheel, a drag or the arrows turn the drum;
     the cards behind lean back, the ones in front lean toward you, and the one you stop on rises out of the roll. A click draws it
     out to the middle, the rest of the roll going soft behind it; it follows the pointer a little, the light sliding over it. A click
     outside puts it back. Soft realism: gradients, a grain, a chip, the contactless mark, each card its own stock. Light or dark on
     top; Customize tunes the drum and the pull. */
  :root { --bg: #f3f2ee; --ink: #1b1c20; --muted: rgba(20,20,20,.52); --ease: cubic-bezier(.22,.61,.36,1); --page: #fff; --boxbg: #f3f2ee; --morph: .55s cubic-bezier(.3,1.12,.4,1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--lab-font); overflow: hidden; transition: background .4s; -webkit-font-smoothing: antialiased; }
  body.dark { --bg: #0e0e10; --ink: #f2f2f0; --muted: rgba(255,255,255,.5); --page: #17181b; --boxbg: #151517; }
  body.tuning { background: var(--page); }
  .stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); transition: inset var(--morph), border-radius var(--morph), background .4s; touch-action: none; user-select: none; -webkit-user-select: none; }
  body.tuning .stage { background: var(--boxbg); border-radius: 26px; }
  /* the room: perspective from a little above; the drum at its middle; a soft shadow on the ground under it */
  .room { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 42%; }
  .rig { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .floor { position: absolute; left: 50%; top: 50%; width: 560px; height: 150px; margin: -75px 0 0 -280px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(40,44,60,.22), rgba(40,44,60,.08) 55%, transparent); filter: blur(14px); transition: opacity .4s; }
  body.dark .floor { background: radial-gradient(closest-side, rgba(0,0,0,.7), rgba(0,0,0,.25) 55%, transparent); }
  /* a card: one face, centred on the rig; the drum places it (JS) */
  /* a card is drawn at --q times its size and scaled down in place, so it stays sharp when it is drawn out and grows */
  :root { --q: 2; }
  .card { --w: calc(340px * var(--q)); --h: calc(214px * var(--q)); position: absolute; left: calc(var(--w) / -2); top: calc(var(--h) / -2); width: var(--w); height: var(--h); padding: 0; border: 0; border-radius: calc(24px * var(--q));
    background: none; cursor: pointer; transform-style: preserve-3d; outline: none; transform-origin: 50% 50%; font: inherit; color: inherit; }
  .card:focus-visible .face { box-shadow: 0 0 0 calc(3px * var(--q)) var(--ink); }
  .face { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; isolation: isolate; color: #fff; text-align: left; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: inset 0 calc(1px * var(--q)) 0 rgba(255,255,255,calc(.15 + var(--lit, .5) * .5)), inset 0 0 0 calc(1px * var(--q)) rgba(255,255,255,.14), 0 calc(1px * var(--q)) calc(1px * var(--q)) rgba(0,0,0,.08), 0 calc(10px * var(--q)) calc(26px * var(--q)) -12px rgba(20,24,40,.35); }
  .face > * { position: absolute; }
  /* a gently domed face: light along the top rim where it meets the edge, a touch of shade along the bottom, softly round the sides */
  .bevel { inset: 0; z-index: 5; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 calc(1px * var(--q)) calc(1.5px * var(--q)) rgba(255,255,255,calc(.1 + var(--lit, .5) * .25)), inset 0 calc(2px * var(--q)) calc(3px * var(--q)) rgba(255,255,255,calc(.06 + var(--lit, .5) * .14)),
      inset 0 calc(-2px * var(--q)) calc(5px * var(--q)) rgba(0,0,0,.16), inset calc(1.5px * var(--q)) 0 calc(4px * var(--q)) rgba(255,255,255,.06), inset calc(-1.5px * var(--q)) 0 calc(4px * var(--q)) rgba(0,0,0,.08); }
  .art { inset: 0; z-index: 0; }
  .grain { inset: 0; z-index: 1; background-image: var(--grain); background-size: calc(180px * var(--q)); mix-blend-mode: overlay; opacity: .28; pointer-events: none; }
  .issuer { left: calc(22px * var(--q)); top: calc(19px * var(--q)); z-index: 2; font-weight: 650; font-size: calc(15px * var(--q)); letter-spacing: -.01em; }
  .issuer small { display: block; margin-top: calc(2px * var(--q)); font-size: calc(10.5px * var(--q)); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; opacity: .72; }
  .chip { left: calc(24px * var(--q)); top: calc(74px * var(--q)); width: calc(44px * var(--q)); height: calc(34px * var(--q)); z-index: 2; }
  .nfc { left: calc(78px * var(--q)); top: calc(79px * var(--q)); width: calc(22px * var(--q)); height: calc(24px * var(--q)); z-index: 2; opacity: .8; }
  .num { left: calc(24px * var(--q)); bottom: calc(44px * var(--q)); z-index: 2; font: 500 calc(15px * var(--q))/1 'Geist Mono', ui-monospace, monospace; letter-spacing: .14em; opacity: .92; }
  .holder { left: calc(24px * var(--q)); bottom: calc(21px * var(--q)); z-index: 2; font-size: calc(10.5px * var(--q)); font-weight: 550; letter-spacing: .12em; text-transform: uppercase; opacity: .78; }
  .net { right: calc(20px * var(--q)); bottom: calc(16px * var(--q)); z-index: 2; height: calc(30px * var(--q)); display: flex; align-items: flex-end; }
  .face { --vc: #fff; }
  .visa { color: var(--vc); font: italic 850 calc(29px * var(--q))/1 var(--lab-font); letter-spacing: -.035em; transform: skewX(-4deg); padding-right: calc(2px * var(--q)); }
  .mc { width: calc(52px * var(--q)); height: calc(32px * var(--q)); }
  .amex { padding: calc(5px * var(--q)) calc(7px * var(--q)) calc(4px * var(--q)); border-radius: calc(3px * var(--q)); background: #2e77bc; color: #fff; font: 800 calc(10px * var(--q))/1.05 var(--lab-font); letter-spacing: .02em; text-align: center; }
  /* the light: a sheen that slides with the card's lean, and a shade for a card that leans away from the light */
  .sheen { inset: -120%; z-index: 3; pointer-events: none; mix-blend-mode: soft-light; opacity: var(--sh-o, .5);
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.75) 46%, rgba(255,255,255,.15) 54%, transparent 66%); transform: translate(var(--sh-x, 0%), var(--sh-y, 0%)); }
  .shade { inset: 0; z-index: 4; pointer-events: none; background: #0b0d14; opacity: var(--sd, 0); }
  /* the gradient set: smooth colour, one big soft shape that fades to nothing, almost no grain */
  body.grad .grain { opacity: .05; } body.grad .issuer b { color: inherit; } body.grad .face { --vc: #fff; color: #fff; }
  .shp { inset: 0; z-index: 1; pointer-events: none; display: none; } body.grad .shp { display: block; }
  body.grad .f-ice, body.grad .f-lilac { color: #1c2133; --vc: #1a1f71; }
  body.grad .f-emerald .art { background: linear-gradient(150deg, #1d7a4e 0%, #0f5a37 45%, #08321f 100%); } body.grad .f-emerald .shp { background: radial-gradient(circle at 92% 50%, transparent 0 34%, rgba(255,255,255,.22) 34.4% 47%, transparent 47.4%); -webkit-mask-image: linear-gradient(100deg, transparent 35%, #000 85%); mask-image: linear-gradient(100deg, transparent 35%, #000 85%); }
  body.grad .f-midnight .art { background: radial-gradient(90% 120% at 100% 100%, #3a5bff 0%, rgba(58,91,255,0) 60%), linear-gradient(160deg, #141b3d, #070a1a); } body.grad .f-midnight .shp { background: radial-gradient(circle at 78% 30%, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 22%, rgba(255,255,255,0) 46%); }
  body.grad .f-sunset .art { background: linear-gradient(125deg, #ff8a5c 0%, #ff4f7b 45%, #8b3dff 100%); } body.grad .f-sunset .shp { background: radial-gradient(150% 120% at 110% 120%, transparent 0 48%, rgba(255,255,255,.28) 48.5% 50%, transparent 50.5% 60%, rgba(255,255,255,.16) 60.5% 62%, transparent 62.5%); -webkit-mask-image: linear-gradient(200deg, #000 20%, transparent 80%); mask-image: linear-gradient(200deg, #000 20%, transparent 80%); }
  body.grad .f-ice .art { background: linear-gradient(160deg, #f4f8ff 0%, #d6e5ff 55%, #b9cdf2 100%); } body.grad .f-ice .shp { background: radial-gradient(circle at 92% 50%, transparent 0 34%, rgba(255,255,255,.22) 34.4% 47%, transparent 47.4%); -webkit-mask-image: linear-gradient(100deg, transparent 35%, #000 85%); mask-image: linear-gradient(100deg, transparent 35%, #000 85%); }
  body.grad .f-graphite .art { background: radial-gradient(80% 110% at 0% 0%, #4a4a50 0%, rgba(74,74,80,0) 65%), linear-gradient(150deg, #2a2a2e, #111113); } body.grad .f-graphite .shp { background: repeating-radial-gradient(circle at 100% 100%, rgba(255,255,255,.14) 0 1.2px, transparent 1.6px calc(14px * var(--q))); -webkit-mask-image: radial-gradient(circle at 100% 100%, #000 0%, transparent 70%); mask-image: radial-gradient(circle at 100% 100%, #000 0%, transparent 70%); }
  body.grad .f-lilac .art { background: linear-gradient(140deg, #efe6ff 0%, #d6c4ff 50%, #f6d5ef 100%); } body.grad .f-lilac .shp { background: radial-gradient(circle at 78% 30%, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 22%, rgba(255,255,255,0) 46%); }
  body.grad .f-ocean .art { background: linear-gradient(150deg, #00b4d8 0%, #0a78c2 45%, #053a7a 100%); } body.grad .f-ocean .shp { background: radial-gradient(140% 70% at 50% 130%, rgba(255,255,255,.3) 0 40%, transparent 40.5%), radial-gradient(140% 70% at 30% 145%, rgba(255,255,255,.18) 0 45%, transparent 45.5%); -webkit-mask-image: linear-gradient(90deg, #000, transparent 90%); mask-image: linear-gradient(90deg, #000, transparent 90%); }
  body.grad .f-volt .art { background: radial-gradient(70% 120% at 100% 0%, rgba(200,255,40,.9) 0%, rgba(200,255,40,0) 62%), linear-gradient(160deg, #1b1d20, #0b0c0d); } body.grad .f-volt .shp { background: radial-gradient(150% 120% at 110% 120%, transparent 0 48%, rgba(255,255,255,.28) 48.5% 50%, transparent 50.5% 60%, rgba(255,255,255,.16) 60.5% 62%, transparent 62.5%); -webkit-mask-image: linear-gradient(200deg, #000 20%, transparent 80%); mask-image: linear-gradient(200deg, #000 20%, transparent 80%); }
  /* the stocks */
  /* frosted: each card a pane of glass with only a breath of its own colour, what lies under it blurred hard through it; a bright rim for its thickness */
  /* frosted, tunable (Frosted glass in the panel): --fb the blur, --fs the colour drawn up through it, --fm the milk of the frost, --ft the
     card's own colour left in it, --fg its grain, --fl the lens rim (a band at the edge that bends the light: brighter, less blurred,
     and a bright line round it), --fr how wide that band is. Lengths times --q: the card is drawn at q and scaled down */
  body.glass .card { transform-style: flat; }
  body.glass .face { -webkit-backdrop-filter: blur(calc(var(--fb) * var(--q) * 1px)) saturate(var(--fs)); backdrop-filter: blur(calc(var(--fb) * var(--q) * 1px)) saturate(var(--fs));

    background: rgba(255,255,255,var(--fm)); color: var(--ink);
    box-shadow: inset 0 0 0 calc(1px * var(--q)) rgba(255,255,255,calc(.12 + var(--fl) * .5)), inset 0 calc(1.5px * var(--q)) calc(2px * var(--q)) rgba(255,255,255,calc(var(--fl) * .55)),
      0 calc(10px * var(--q)) calc(26px * var(--q)) calc(-12px * var(--q)) rgba(20,24,40,.25); }
  body.glass .card.hero .face { backdrop-filter: url(#glassF) saturate(var(--fs)); }
  body.glass .card.deep .face { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255,255,255,calc(var(--fm) + .1)); }
  body.glass.dark .card.deep .face { background: rgba(255,255,255,calc(var(--fm) * .35 + .05)); }
  body.glass .art { opacity: var(--ft); } body.glass .grain { opacity: var(--fg); } body.glass .bevel { display: none; } body.glass .visa { color: var(--ink) !important; } body.glass .t-onyx .issuer b, body.glass .t-volt .issuer b { color: inherit; }
  body.glass.dark .face { background: rgba(255,255,255,calc(var(--fm) * .35)); }
  /* the lens edge: only light, a fine rim like the edge of a pane of glass catching it, brightest along the top and the left, faint
     on the far side; no shade. Lens width is the line, Lens edge its strength. (The bending of what is behind is the Refraction) */
  .lens { display: none; } body.glass .lens { display: block; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: var(--fl);
    border: calc(var(--fr) * .5px * var(--q)) solid transparent; background: linear-gradient(140deg, rgba(255,255,255,1) 0%, rgba(255,255,255,.35) 22%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.3) 80%, rgba(255,255,255,.75) 100%) border-box;
    -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0);
    filter: blur(calc(var(--fr) * .12px * var(--q))); }
  /* the hint at the foot */
  .dock { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; transition: left var(--morph), bottom var(--morph); }
  .mat { display: flex; gap: 2px; height: 46px; padding: 4px; border-radius: 999px; background: #fff; font: 600 13px var(--lab-font); }
  .mat button { height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: rgba(20,20,20,.55); font: inherit; cursor: pointer; }
  .mat button:hover { color: #1b1c20; } .mat button[aria-checked=true] { background: #1b1c20; color: #fff; }
  body.dark .mat { background: #1c1c1f; } body.dark .mat button { color: rgba(255,255,255,.5); } body.dark .mat button:hover { color: #f2f2f0; } body.dark .mat button[aria-checked=true] { background: #f2f2f0; color: #1b1c20; }
  .hint { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 3; transform: translateX(-50%); margin: 0; color: var(--muted); font-size: 13px; pointer-events: none; transition: opacity .3s, left var(--morph); white-space: nowrap; }
  body.open .hint { opacity: 0; }
  /* the corner controls (as on every piece) */
  .back, .tune, .mode { position: fixed; top: 16px; z-index: 6; transition: top var(--morph), left var(--morph); }
  body.tuning .back, body.tuning .mode { top: 30px; } body.tuning .back { left: 30px; }
  .back { left: 16px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 999px; background: #fff; color: #1b1c20; }
  .back:hover { translate: -2px 0; } .back svg { width: 20px; height: 20px; }

  .tune:hover { transform: translateY(-1px); } .tune svg { width: 19px; height: 19px; } body.tuning .tune { opacity: 0; pointer-events: none; }
  .mode { left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: #fff; font: 600 13px var(--lab-font); transition: left .45s var(--ease); }
  .mode button { height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: rgba(20,20,20,.55); font: inherit; cursor: pointer; }
  .mode button:hover { color: #1b1c20; } .mode button[aria-checked=true] { background: #1b1c20; color: #fff; }

  body.bare .back, body.bare .tune, body.bare .mode, body.bare .panel, body.bare .hint, body.bare .dock { display: none; }
  /* the panel: a card beside the stage (lab-ui soft) */
  .panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 340px; z-index: 5; display: flex; flex-direction: column; overflow: auto; overscroll-behavior: contain; padding: 0 20px; --ui-pad: 20px;
    font-family: var(--lab-font); border-radius: 26px; border: 1px solid var(--ui-card-line, rgba(20,20,20,.08)); opacity: 0; translate: 24px 0; visibility: hidden;
    transition: translate var(--morph), opacity .3s, visibility 0s .55s; }
  body.tuning .panel { opacity: 1; translate: 0 0; visibility: visible; transition: translate var(--morph), opacity .35s .08s; }
  .panel::-webkit-scrollbar { width: 0; }

  .ph h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; } .ph p { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--ui-muted); }
  .pc { flex: none; width: 32px; height: 32px; margin: -4px -6px 0 0; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: var(--ui-ink); cursor: pointer; transition: background .2s; } .pc:hover { background: var(--ui-hover, rgba(20,20,20,.06)); } .pc svg { width: 18px; height: 18px; }
  .acts { position: sticky; bottom: 0; z-index: 3; display: flex; margin: auto -20px 0; padding: 14px 20px 20px; background: var(--ui-bg); }
  @media (min-width: 761px) { body.tuning .stage { inset: 16px 368px 16px 16px; } body.tuning .mode, body.tuning .hint, body.tuning .dock { left: calc(50% - 176px); } }
  @media (max-width: 760px) { .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 56vh; translate: 0 calc(100% + 16px); }
    body.tuning .panel { translate: 0 0; } body.tuning .stage { inset: 8px 8px calc(56vh + 16px) 8px; border-radius: 22px; }
    body.tuning .back, body.tuning .mode { top: 18px; } body.tuning .back { left: 18px; } body.tuning .dock, body.tuning .hint { display: none; } }

<script>

// ---------- the motions: four ways for the wallet to lie and turn. Each places a card by its distance from the one you stop on (d),

//           neighbours apart and tips back a touch, still in the middle of the deck
//   Roll    round a wide cylinder seen from above, behind packing upward, in front overlapping like a wallet

const MODES = { deck: { name: 'Deck', tilt: 52, space: 1.6, lift: 47, dof: 2.85 }, roll: { name: 'Roll', tilt: 40, space: 1.9, lift: 34, dof: .6 }, barrel: { name: 'Barrel', tilt: 8, space: .5, lift: 100, dof: 1 }, wallet: { name: 'Wallet', tilt: 16, space: 1, lift: 34, dof: 1 }, fan: { name: 'Fan', tilt: 20, space: 1, lift: 34, dof: 1 } }, ORDER = Object.keys(MODES);

  ctl.follow = LabUI.check(g1, { label: 'Follow the pointer', value: P.follow, onChange: v => { set('follow', v); if (!v) { look.tx = look.ty = 0; wake(); } } });
  const gf = LabUI.group(panel, 'Frosted glass', { key: KEY + '.g.frost' }), fsl = (k, label, min, max, step, unit) => ctl[k] = LabUI.slider(gf, { label, min, max, step, unit, value: P[k], def: DEF[k], onInput: v => { P[k] = v; save(); applyGlass(); } });
  fsl('fb', 'Frost', 0, 80, 1, 'px'); fsl('fm', 'Milk', 0, .6, .01, ''); fsl('ft', 'Card colour', 0, 1, .01, ''); fsl('fs', 'Colour through', 1, 2.6, .05, '×'); fsl('fl', 'Lens edge', 0, 1, .01, ''); fsl('fr', 'Lens width', 2, 24, .5, 'px'); fsl('fg', 'Grain', 0, .3, .01, ''); fsl('refr', 'Refraction', 0, 160, 1, 'px'); fsl('bez', 'Bezel', 4, 80, 1, 'px');
  const g2 = LabUI.group(panel, 'Look', { key: KEY + '.g.look' });
  ctl.glass = LabUI.seg(g2, { label: 'Cards', options: [['solid', 'Solid'], ['glass', 'Frosted']], value: P.glass ? 'glass' : 'solid', onChange: v => setGlass(v === 'glass', true) }); sl(g2, 'size', 'Size', .6, 1.6, .05, '×');
  const acts = document.createElement('div'); acts.className = 'acts'; acts.innerHTML = '<button type="button" data-a="reset">Reset all</button><button type="button" data-a="copy">Copy settings</button>'; panel.appendChild(acts);
  acts.querySelector('[data-a=reset]').onclick = () => { P = { ...DEF }; save(); for (const k in ctl) ctl[k].set(k === 'glass' ? (P.glass ? 'glass' : 'solid') : P[k]); applyGlass(); fit(); };
  acts.querySelector('[data-a=copy]').onclick = e => { const d = {}; for (const k in P) if (P[k] !== DEF[k]) d[k] = P[k]; navigator.clipboard?.writeText(JSON.stringify(d, null, 2)); e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy settings', 1200); }; }
function setGlass(on, fromPanel) { P.glass = on; if (on) preset(GLASS[P.anim] || FROST); if (!fromPanel) ctl.glass?.set(on ? 'glass' : 'solid'); paintMat(); save(); applyGlass(); fit(); }
function paintMat() { document.querySelectorAll('#mat button').forEach(b => b.setAttribute('aria-checked', String((b.dataset.g === 'glass') === !!P.glass))); }
function preset(o) { for (const k in o) { P[k] = o[k]; ctl[k]?.set(P[k]); } }
function setAnim(v, fromPanel) { if (!MODES[v]) return; P.anim = v; for (const k of ['tilt', 'space', 'lift', 'dof']) { P[k] = MODES[v][k]; ctl[k]?.set(P[k]); } if (P.glass) { preset(GLASS[v] || FROST); applyGlass(); fit(); }
  if (!fromPanel) ctl.anim?.set(v); $('nm').textContent = MODES[v].name; pos = target = lastPos = idx(pos); CS.forEach(c => c.p = pos); save(); wake(); }
function edgeMap(band, sign) { const MW = 340, MH = 214, sx = W * Q / MW, R = 24 * Q / sx, bw = band / sx, c = document.createElement('canvas'); c.width = MW; c.height = MH;
  const x = c.getContext('2d'), im = x.createImageData(MW, MH), hw = MW / 2, hh = MH / 2;
  for (let py = 0; py < MH; py++) for (let px = 0; px < MW; px++) { const X = px + .5 - hw, Y = py + .5 - hh, qx = Math.abs(X) - (hw - R), qy = Math.abs(Y) - (hh - R);
    const d = -(Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - R); let nx = 0, ny = 0, k = 0;
    if (d < bw && d > -1) { k = (1 - Math.max(0, d) / bw) ** 2; if (qx > 0 && qy > 0) { const l = Math.hypot(qx, qy) || 1; nx = qx / l * Math.sign(X); ny = qy / l * Math.sign(Y); } else if (qx > qy) nx = Math.sign(X); else ny = Math.sign(Y); }
    const o = (py * MW + px) * 4; im.data[o] = 128 + sign * nx * k * 127; im.data[o + 1] = 128 + sign * ny * k * 127; im.data[o + 2] = 128; im.data[o + 3] = 255; }
  x.putImageData(im, 0, 0); return c.toDataURL(); }
const setHref = (id, url) => { const m = document.getElementById(id); m.setAttribute('href', url); m.setAttributeNS('http://www.w3.org/1999/xlink', 'href', url); };
let lensKey = '', glassKey = '';
function lensMap() { const w = Math.max(2, P.fr) * Q, key = w + '';
  if (key !== lensKey) { lensKey = key; setHref('lensMap', edgeMap(w, 1)); }
  document.getElementById('lensDisp').setAttribute('scale', (P.fl * 90).toFixed(1)); document.getElementById('lensBlur').setAttribute('stdDeviation', (P.fb * .06 * U).toFixed(2));
  const gk = Math.max(2, P.bez) * Q + ''; if (gk !== glassKey) { glassKey = gk; setHref('glassMap', edgeMap(Math.max(2, P.bez) * Q, -1)); }   // (the pane: it draws from further in, so what is behind seems pulled round the edge)
  document.getElementById('glassDisp').setAttribute('scale', (P.refr * U).toFixed(1)); document.getElementById('glassBlur').setAttribute('stdDeviation', (P.fb * U).toFixed(2)); }
function applyGlass() { lensMap(); const r = document.body.style; for (const k of ['fb', 'fs', 'fm', 'ft', 'fg', 'fl', 'fr']) r.setProperty('--' + k, P[k]); document.body.classList.toggle('glass', !!P.glass); document.body.classList.add('grad'); }
function openPanel(on) { document.body.classList.toggle('tuning', on); $('tune').setAttribute('aria-expanded', String(on)); }
$('tune').onclick = () => openPanel(true);
buildPanel(); setMode(mode); applyGlass(); LabUI.segThumb($('mode'));
const VARS = LabUI.variants($('vars'), { prev: $('prev'), next: $('next'), name: $('nm'), onStep: d => setAnim(ORDER[(ORDER.indexOf(P.anim) + d + ORDER.length) % ORDER.length]),
  items: () => ORDER.map(k => MODES[k].name), current: () => MODES[P.anim].name, onPick: n => setAnim(ORDER.find(k => MODES[k].name === n)) });
$('nm').textContent = MODES[P.anim]?.name || 'Deck';
if (!BARE && P.anim !== 'deck') setAnim('deck');   // (it always opens on Deck; the other motions are a step away)
document.querySelectorAll('#mat button').forEach(b => b.onclick = () => setGlass(b.dataset.g === 'glass')); paintMat(); LabUI.segThumb($('mat'));

// ---------- the board's box: ?thumb=1 the still (the third card risen), ?demo=1 the roll turning, stopping, one drawn out ----------
if (BARE) { document.body.classList.add('bare'); P = { ...DEF, ...GLASS.deck, anim: 'deck', glass: true, size: 1 }; if (q.has('anim')) P.anim = q.get('anim'); setMode(q.get('mode') === 'light' ? 'light' : 'dark'); applyGlass(); lift.p = 1; lastTurn = -1e9; CS.forEach(c => { c.p = pos; c.v = 0; }); CS[idx(pos)].l.p = 1; }
if (DEMO) { (async () => { const wait = ms => new Promise(r => setTimeout(r, ms)); await wait(900);
    for (let n = 0; ; n++) { const seq = [3, 4, 5, 6, 5, 4, 3, 2, 1, 0, 1, 2]; for (const s of seq) { turnTo(s); await wait(s === 2 ? 1300 : 900); if (s === 5 && n % 2 === 0) { open(5); await wait(1900); close(); await wait(700); } } } })(); }
fit(); frame(performance.now());
window.ROLL = { get P() { return P; }, turnTo, open, close, get pos() { return pos; } };
