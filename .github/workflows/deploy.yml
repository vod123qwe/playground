name: Deploy playground to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/peaceful-cannon-zdfwm9
  workflow_dispatch:

# Permissions needed for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lithos/package-lock.json

      - name: Build Lithos
        working-directory: lithos
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -r hello _site/hello
          cp -r lithos/dist _site/lithos

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
